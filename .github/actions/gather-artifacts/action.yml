---
name: Gather OSAC Artifacts
description: >-
  Collect cluster diagnostics, redact sensitive data, and upload as a
  workflow artifact. Wraps scripts/gather-osac-logs.sh.

inputs:
  namespace:
    description: "OSAC E2E namespace"
    required: false
    default: "osac-e2e-ci"
  kubeconfig-path:
    description: "Path to the cluster kubeconfig"
    required: true
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "osac-logs"
  junit-path:
    description: "Path to JUnit XML (included in artifact if it exists)"
    required: false
    default: ""
  aap-job-ids-file:
    description: "Optional JSON file listing AAP job IDs to collect instead of scanning recent jobs"
    required: false
    default: ""
  aap-jobs-only:
    description: "Collect only the related AAP job output"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Gather and redact
      if: always()
      shell: bash
      env:
        KUBECONFIG: ${{ inputs.kubeconfig-path }}
        E2E_NAMESPACE: ${{ inputs.namespace }}
        JUNIT_PATH: ${{ inputs.junit-path }}
        AAP_JOB_IDS_FILE: ${{ inputs.aap-job-ids-file }}
        AAP_JOBS_ONLY: ${{ inputs.aap-jobs-only }}
      run: |
        ARTIFACT_DIR="${RUNNER_TEMP}/osac-artifacts"
        rm -rf -- "${ARTIFACT_DIR}"
        mkdir -p "${ARTIFACT_DIR}"
        rm -f "${RUNNER_TEMP}/osac-artifacts-redaction-complete"
        if timeout 900 "$GITHUB_WORKSPACE/scripts/gather-osac-logs.sh" "${ARTIFACT_DIR}"; then
          touch "${ARTIFACT_DIR}/.redaction-complete"
        fi

    - name: Verify redaction complete
      if: always()
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
        REDACTION_MARKER: ${{ runner.temp }}/osac-artifacts-redaction-complete
      run: |
        if [[ -d "${ARTIFACT_DIR}" ]] && [[ ! -f "${ARTIFACT_DIR}/.redaction-complete" ]]; then
          echo "::error::Gather script did not complete — refusing to upload"
          rm -rf "${ARTIFACT_DIR}"
          rm -f "${REDACTION_MARKER}"
          exit 1
        fi
        rm -f "${ARTIFACT_DIR}/.redaction-complete" 2>/dev/null || true

    - name: Scan artifacts with gitleaks
      id: gitleaks-scan
      if: always()
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
        GITLEAKS_CONFIG: ${{ github.workspace }}/.github/scripts/.gitleaks.toml
        # Same pinned image as scan-run-logs.sh
        GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
      run: |
        if [[ ! -d "${ARTIFACT_DIR}" ]]; then
          echo "No artifact directory — skipping gitleaks scan"
          exit 0
        fi


        ENGINE=""
        if command -v docker &>/dev/null; then
          ENGINE=docker
        elif command -v podman &>/dev/null; then
          ENGINE=podman
        else
          echo "::warning::Neither docker nor podman available — uploading without pre-scan (post-upload scanner will cover)"
          exit 0
        fi

        SELINUX_SUFFIX=""
        if [[ -r /sys/fs/selinux/enforce ]] && [[ "$(</sys/fs/selinux/enforce)" == "1" ]]; then
          SELINUX_SUFFIX=",Z"
        fi

        REPORT_DIR="${RUNNER_TEMP}/gitleaks-pre-upload"
        mkdir -p "${REPORT_DIR}"
        chmod 777 "${REPORT_DIR}"
        trap 'rm -rf -- "${REPORT_DIR}"' EXIT

        MAX_PASSES=3
        for pass in $(seq 1 ${MAX_PASSES}); do
          echo "::group::Gitleaks pre-upload scan (pass ${pass}/${MAX_PASSES})"
          REPORT="${REPORT_DIR}/findings-pass-${pass}.json"

          if ! "${ENGINE}" run --rm --network=none \
            --user "$(id -u):$(id -g)" \
            -v "${ARTIFACT_DIR}:/scan:ro${SELINUX_SUFFIX}" \
            -v "${GITLEAKS_CONFIG}:/gitleaks.toml:ro${SELINUX_SUFFIX}" \
            -v "${REPORT_DIR}:/out${SELINUX_SUFFIX}" \
            "${GITLEAKS_IMAGE}" dir /scan \
            --config=/gitleaks.toml \
            --report-format=json \
            --report-path="/out/$(basename "${REPORT}")" \
            --exit-code=0; then
            echo "::warning::Gitleaks scan failed — uploading anyway (post-upload scanner will cover)"
            echo "::endgroup::"
            rm -rf "${REPORT_DIR}"
            exit 0
          fi

          if [[ ! -f "${REPORT}" ]]; then
            echo "[]" > "${REPORT}"
          fi

          FINDING_COUNT=$(jq 'length' "${REPORT}")
          echo "Pass ${pass}: ${FINDING_COUNT} finding(s)"
          if [[ "${FINDING_COUNT}" -gt 0 ]]; then
            echo "Findings (sanitized):"
            jq -r '.[] | "  \(.RuleID) \(.File):\(.StartLine)"' "${REPORT}"
          fi
          echo "::endgroup::"

          if [[ "${FINDING_COUNT}" -eq 0 ]]; then
            echo "Artifacts are clean after pass ${pass}"
            break
          fi

          echo "::group::Redacting ${FINDING_COUNT} finding(s) (pass ${pass})"
          python3 "${{ github.workspace }}/.github/scripts/redact.py" "${REPORT}" "${ARTIFACT_DIR}"
          echo "::endgroup::"

          if [[ "${pass}" -eq "${MAX_PASSES}" ]]; then
            FINAL_REPORT="${REPORT_DIR}/findings-final.json"
            if ! "${ENGINE}" run --rm --network=none \
              --user "$(id -u):$(id -g)" \
              -v "${ARTIFACT_DIR}:/scan:ro${SELINUX_SUFFIX}" \
              -v "${GITLEAKS_CONFIG}:/gitleaks.toml:ro${SELINUX_SUFFIX}" \
              -v "${REPORT_DIR}:/out${SELINUX_SUFFIX}" \
              "${GITLEAKS_IMAGE}" dir /scan \
              --config=/gitleaks.toml \
              --report-format=json \
              --report-path="/out/findings-final.json" \
              --exit-code=0; then
              echo "::warning::Final gitleaks scan failed — uploading anyway (post-upload scanner will cover)"
              break
            fi
            if [[ ! -f "${FINAL_REPORT}" ]]; then
              echo "[]" > "${FINAL_REPORT}"
            fi
            REMAINING=$(jq 'length' "${FINAL_REPORT}")
            if [[ "${REMAINING}" -gt 0 ]]; then
              echo "::warning::${REMAINING} finding(s) remain after ${MAX_PASSES} redaction passes — uploading anyway (post-upload scanner will cover)"
              echo "Remaining findings (sanitized):"
              jq -r '.[] | "  \(.RuleID) \(.File):\(.StartLine)"' "${FINAL_REPORT}"
            fi
          fi
        done

        rm -rf "${REPORT_DIR}"

    - name: Mark redacted artifacts ready for reuse
      if: always() && steps.gitleaks-scan.outcome == 'success'
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
        REDACTION_MARKER: ${{ runner.temp }}/osac-artifacts-redaction-complete
      run: |
        if [[ -d "${ARTIFACT_DIR}" ]]; then
          touch "${REDACTION_MARKER}"
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/osac-artifacts/
        retention-days: 7
        if-no-files-found: warn
