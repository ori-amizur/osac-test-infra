---
name: E2E CaaS Netris Full Install

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      instance-type:
        description: "EC2 instance type -- curated allow-list, not free text, so a dispatch (available to anyone with write access) can't accidentally launch an unexpectedly expensive type. Add to `options` deliberately."
        required: false
        type: choice
        options:
          - "c5n.metal"
        default: "c5n.metal"
      aws-region:
        description: "AWS region to launch into"
        required: false
        default: "us-east-1"
      tooling-check-cmds:
        description: "Semicolon-separated commands to verify on the box before JIT registration. Defaults to installing the CaaS/Netris flow's prerequisites."
        required: false
        default: "dnf install -y ansible-core python3-pip make podman; /usr/bin/python3 -m pip install --ignore-installed ansible; command -v ansible-playbook; command -v make; command -v podman"
      osac-operator-image:
        description: "Override osac-operator image (registry-pullable reference) -- empty means no override"
        required: false
        default: ""
      fulfillment-service-image:
        description: "Override fulfillment-service image (registry-pullable reference) -- empty means no override"
        required: false
        default: ""
      osac-aap-ee-image:
        description: "Override osac-aap execution-environment image (registry-pullable reference) -- empty means no override"
        required: false
        default: ""
      osac-repo:
        description: "Override osac mono-repo git URI -- empty means upstream"
        required: false
        default: ""
      osac-branch:
        description: "Branch, tag, or commit of the OSAC mono-repo to deploy and test -- empty means main"
        required: false
        default: ""
      components:
        description: >-
          Optional JSON array of OSAC components to build from source and load
          onto the cluster. Set repo/ref to the same OSAC PR repository/ref
          when testing implementation changes; empty builds no PR components.
        required: false
        default: "[]"
      test-marker:
        description: "pytest -m marker expression; empty runs all CaaS tests (default: requires_caas_fabric)"
        required: false
        default: "requires_caas_fabric"
      test-filter:
        description: "Optional pytest -k filter expression"
        required: false
        default: ""

concurrency:
  group: e2e-caas-netris-full-install-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e-caas-netris:
    uses: ./.github/workflows/e2e-caas-netris-full-install.yml
    with:
      instance-type: ${{ inputs.instance-type || 'c5n.metal' }}
      aws-region: ${{ inputs.aws-region || 'us-east-1' }}
      tooling-check-cmds: ${{ inputs.tooling-check-cmds || 'dnf install -y ansible-core python3-pip make podman; /usr/bin/python3 -m pip install --ignore-installed ansible; command -v ansible-playbook; command -v make; command -v podman' }}
      osac-operator-image: ${{ inputs.osac-operator-image || '' }}
      fulfillment-service-image: ${{ inputs.fulfillment-service-image || '' }}
      osac-aap-ee-image: ${{ inputs.osac-aap-ee-image || '' }}
      osac-repo: ${{ inputs.osac-repo || '' }}
      osac-branch: ${{ inputs.osac-branch || '' }}
      components: ${{ inputs.components || '[]' }}
      test-marker: ${{ inputs.test-marker }}
      test-filter: ${{ inputs.test-filter }}
