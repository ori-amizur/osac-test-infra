---
name: E2E CaaS Netris Full Install

permissions:
  contents: read

# Suite-specific: provisions an ephemeral EC2 bare-metal box (via
# ec2-runner-provision.yml), runs the real CaaS/Netris e2e flow on it, and
# tears it down (via ec2-runner-teardown.yml). The provision/teardown
# pieces are generic and suite-agnostic -- see those files' own headers --
# split out specifically so a future suite needing the same bare-metal
# provisioning doesn't have to copy this file's plumbing, only write its
# own test job. See docs/ec2-ephemeral-runner-setup.md.
on:
  workflow_call:
    inputs:
      instance-type:
        description: "EC2 instance type"
        required: false
        type: string
        default: "c5n.metal"
      aws-region:
        description: "AWS region to launch into"
        required: false
        type: string
        default: "us-east-1"
      orchestrator-runner-label:
        description: "Self-hosted runner label for the orchestrator (dedicated, not the shared osac-ci fleet, so it's never queued behind existing e2e jobs)"
        required: false
        type: string
        default: "osac-ci-orchestrator"
      # The default installs real packages/network access (dnf + pip), unlike
      # ec2-runner-provision.yml's own generic "command -v podman" default --
      # this workflow supplies the CaaS/Netris-specific default itself,
      # since the provisioner shouldn't hardcode one suite's prerequisites.
      # Each semicolon-separated item runs as its own SSH call with no
      # retry -- v1 accepts that a transient mirror/PyPI hiccup hard-fails
      # verification (skipping JIT registration, same cost as any other
      # tooling-check failure), matching this repo's existing
      # accept-and-revisit-if-flaky precedent (see provision.sh's
      # InsufficientInstanceCapacity handling for the same philosophy).
      tooling-check-cmds:
        description: "Semicolon-separated commands to run/verify on the box before JIT registration. Defaults to installing and verifying the CaaS/Netris flow's bootstrap prerequisites (ansible-core, python3-pip, make, podman, and tcpdump). Test tools are installed by infra/netris prerequisites."
        required: false
        type: string
        default: "dnf install -y ansible-core python3-pip make podman tcpdump; /usr/bin/python3 -m pip install --ignore-installed ansible; command -v ansible-playbook; command -v make; command -v podman; command -v tcpdump"
      osac-installer-image:
        description: "Override osac-installer image (registry-pullable reference, e.g. from a component repo's own PR build) -- accepted but not yet consumed: infra/netris has no plain extra-var for this (see the test job's 'Build component image overrides' step comment), needs podman-extraction handling in a later PR"
        required: false
        type: string
        default: ""
      osac-operator-image:
        description: "Override osac-operator image (registry-pullable reference) -- empty builds from the selected OSAC revision"
        required: false
        type: string
        default: ""
      fulfillment-service-image:
        description: "Override fulfillment-service image (registry-pullable reference) -- empty builds from the selected OSAC revision"
        required: false
        type: string
        default: ""
      osac-aap-ee-image:
        description: "Override AAP bootstrap and execution-environment image -- empty builds from the selected OSAC revision"
        required: false
        type: string
        default: ""
      osac-repo:
        description: "Override osac mono-repo git URI -- empty means upstream"
        required: false
        type: string
        default: ""
      osac-branch:
        description: "Branch, tag, or commit of the osac mono-repo to clone -- empty means main"
        required: false
        type: string
        default: ""
      components:
        description: >-
          Optional source-build overrides. By default fulfillment-service,
          osac-operator, osac-aap and bare-metal-fulfillment-operator are built
          from the selected OSAC revision and loaded onto the SNO node.
          Entries override those defaults by imageKey: repo, ref, containerfile,
          imageKey (Helm value path), optional buildType ("ansible-builder"),
          and optional context (build context directory relative to repo root;
          defaults to the containerfile's parent directory).
          Explicit overrides must be compatible with the selected revision's CRDs.
        required: false
        type: string
        default: "[]"
      test-marker:
        description: "pytest -m marker expression; empty runs all CaaS tests (default: requires_caas_fabric)"
        required: false
        type: string
        default: "requires_caas_fabric"
      test-filter:
        description: "Optional pytest -k filter expression"
        required: false
        type: string
        default: ""
      debug-on-failure:
        description: "After an E2E job failure, keep the Netris lab available for 30 minutes after diagnostics before automatic teardown"
        required: false
        type: boolean
        default: false
      test-infra-repository:
        description: "Repository to checkout for actions and scripts (for cross-repo calls)"
        required: false
        type: string
        default: ""
      fork-pr-author-association:
        description: "PR author_association from the caller"
        required: false
        type: string
        default: ""
      fork-pr-author:
        description: "GitHub login of the PR author (for fork PR org membership check)"
        required: false
        type: string
        default: ""
      pr-number:
        description: "PR number (for label-based authorization check)"
        required: false
        type: string
        default: ""
    outputs:
      result:
        description: "Overall result: PASSED or FAILED"
        value: ${{ jobs.e2e.outputs.result }}

jobs:
  # Runs before provision (not inside push-secrets, which only runs after
  # provision) specifically so an unauthorized fork PR is rejected before
  # a real EC2 instance is ever launched -- provisioning is exactly the
  # cost/blast-radius this authorization gate exists to prevent, so it
  # can't be allowed to happen first. Lightweight: only needs the local
  # AppRole files (already present on the orchestrator) and a couple of
  # GitHub API calls, no dependency on the box existing.
  authorize:
    runs-on: ${{ inputs.orchestrator-runner-label }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          persist-credentials: false

      - name: Validate and bootstrap
        id: setup
        uses: ./.github/actions/validate-and-bootstrap
        with:
          test-suite: ec2-runner
          run-id: ${{ github.run_id }}

      - name: Authorize fork PR
        if: inputs.fork-pr-author-association != ''
        uses: ./.github/actions/authorize-fork-pr
        with:
          role-id: ${{ steps.setup.outputs.role-id }}
          secret-id: ${{ steps.setup.outputs.secret-id }}
          fork-pr-author: ${{ inputs.fork-pr-author }}
          pr-number: ${{ inputs.pr-number }}

  provision:
    needs: authorize
    uses: ./.github/workflows/ec2-runner-provision.yml
    permissions:
      contents: read
    with:
      instance-type: ${{ inputs.instance-type }}
      aws-region: ${{ inputs.aws-region }}
      orchestrator-runner-label: ${{ inputs.orchestrator-runner-label }}
      tooling-check-cmds: ${{ inputs.tooling-check-cmds }}
      test-infra-repository: ${{ inputs.test-infra-repository }}


  # Fetches all 5 CaaS/Netris secrets and pushes them to the box, on the
  # orchestrator -- not the box itself. The box was never bootstrapped with
  # the Vault SSH-tunnel/AppRole setup persistent machines like the
  # orchestrator have, confirmed the hard way (a real dispatch failed here:
  # "AppRole credentials missing or empty in ~/.vault-server/.approle").
  # See push-caas-netris-secrets.sh's header for the full rationale.
  push-secrets:
    needs: provision
    runs-on: ${{ inputs.orchestrator-runner-label }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Must match ec2-runner-provision.yml's derivation exactly.
      KNOWN_HOSTS_FILE: /tmp/osac-ec2-known-hosts-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          persist-credentials: false

      - name: Validate and bootstrap
        id: setup
        uses: ./.github/actions/validate-and-bootstrap
        with:
          test-suite: ec2-runner
          run-id: ${{ github.run_id }}

      # Authorization already happened in the authorize job, before
      # provision -- not repeated here.

      # Not ./.github/actions/fetch-and-write-secrets: that composite action
      # also writes a merged podman auth.json to $HOME/.config/containers and
      # (via sudo) /root/.config/containers -- appropriate for e2e-vmaas.yml,
      # where it runs on the same box that later podman-pulls images with it,
      # but wrong here: this job runs on the persistent orchestrator, not the
      # disposable box, so it would leave standing registry credentials on a
      # long-lived machine (the exact thing this fix is trying to avoid --
      # see push-caas-netris-secrets.sh's header) and needs sudo, which isn't
      # guaranteed on every orchestrator runner. infra/netris never reads
      # auth.json (confirmed: no reference to it anywhere under infra/netris
      # or the root Makefile) -- only the raw pull-secret JSON and AAP
      # license zip are actually needed, so fetch just those two directly.
      - name: Fetch pull secret and AAP license from Vault
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.setup.outputs.role-id }}
          secretId: ${{ steps.setup.outputs.secret-id }}
          exportEnv: false
          secrets: |
            secret/data/osac/e2e/pull-secret dockerconfigjson | PULL_SECRET ;
            secret/data/osac/e2e/aap-license license | AAP_LICENSE ;
            secret/data/osac/e2e/quay-io-osac-ci-bot-account user | QUAY_USER ;
            secret/data/osac/e2e/quay-io-osac-ci-bot-account password | QUAY_PASSWORD

      - name: Write pull secret and AAP license to temp files
        shell: bash
        env:
          PULL_SECRET: ${{ steps.vault-secrets.outputs.PULL_SECRET }}
          AAP_LICENSE: ${{ steps.vault-secrets.outputs.AAP_LICENSE }}
          QUAY_USER: ${{ steps.vault-secrets.outputs.QUAY_USER }}
          QUAY_PASSWORD: ${{ steps.vault-secrets.outputs.QUAY_PASSWORD }}
        run: |
          jq -s \
            '.[0].auths * {"quay.io/osac-project": {"auth": ((env.QUAY_USER + ":" + env.QUAY_PASSWORD) | @base64)}} | {auths: .}' \
            <(printf '%s' "${PULL_SECRET}") \
            > "$RUNNER_TEMP/pull-secret.json"
          chmod 600 "$RUNNER_TEMP/pull-secret.json"
          printf '%s' "${AAP_LICENSE}" | base64 -d > "$RUNNER_TEMP/aap-license.zip"
          chmod 600 "$RUNNER_TEMP/aap-license.zip"

      - name: Fetch Netris license
        id: netris-license
        uses: ./.github/actions/fetch-netris-license
        with:
          role-id: ${{ steps.setup.outputs.role-id }}
          secret-id: ${{ steps.setup.outputs.secret-id }}

      - name: Fetch CaaS Route 53 credentials
        id: route53-creds
        uses: ./.github/actions/fetch-caas-route53-creds
        with:
          role-id: ${{ steps.setup.outputs.role-id }}
          secret-id: ${{ steps.setup.outputs.secret-id }}

      # Not an externally issued credential -- netris-lab assigns this
      # straight into its own freshly-deployed controller's DB on creation
      # (see roles/k3s_controller/tasks/password_fix.yml), so there's
      # nothing to fetch from Vault and no reason to reuse the same value
      # run over run.
      - name: Generate Netris controller password
        id: netris-password
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::${password}"
          echo "NETRIS_PASSWORD=${password}" >> "$GITHUB_OUTPUT"

      - name: Push Netris secrets to ephemeral box
        shell: bash
        env:
          SSH_USER: ${{ needs.provision.outputs.ssh-user }}
          PUBLIC_IP: ${{ needs.provision.outputs.public-ip }}
          NETRIS_LICENSE: ${{ steps.netris-license.outputs.NETRIS_LICENSE }}
          NETRIS_PASSWORD: ${{ steps.netris-password.outputs.NETRIS_PASSWORD }}
          AAP_LICENSE_ZIP_PATH: ${{ runner.temp }}/aap-license.zip
          PULL_SECRET_JSON_PATH: ${{ runner.temp }}/pull-secret.json
          LAB_NAME: ci-${{ github.run_id }}
        run: |
          export SSH_KEY_PATH="${HOME}/.ssh/osac_ec2_orchestrator"
          ./scripts/ec2-runner/push-netris-secrets.sh

      - name: Push Route53 credentials to ephemeral box
        shell: bash
        env:
          SSH_USER: ${{ needs.provision.outputs.ssh-user }}
          PUBLIC_IP: ${{ needs.provision.outputs.public-ip }}
          ROUTE53_AWS_ACCESS_KEY_ID: ${{ steps.route53-creds.outputs.ROUTE53_AWS_ACCESS_KEY_ID }}
          ROUTE53_AWS_SECRET_ACCESS_KEY: ${{ steps.route53-creds.outputs.ROUTE53_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          export SSH_KEY_PATH="${HOME}/.ssh/osac_ec2_orchestrator"
          ./scripts/ec2-runner/push-route53-secrets.sh

  e2e:
    needs: [provision, push-secrets]
    # The capped install/setup steps can sum to 6h15; reserve the remainder
    # for the serial CaaS fabric scenarios. This 10h ceiling is an initial
    # budget and should be tuned from the first successful run's duration.
    runs-on: ${{ needs.provision.outputs.runner-label }}
    timeout-minutes: 600
    permissions:
      contents: read
    env:
      ANSIBLE_LOG_PATH: ${{ github.workspace }}/infra/netris/logs/ansible.log
    outputs:
      result: ${{ steps.deploy-caas.outcome == 'success' && steps.test.outcome == 'success' && 'PASSED' || 'FAILED' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          persist-credentials: false

      - name: Prepare Netris diagnostic log directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p infra/netris/logs
          {
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'run_id=%s\nrun_attempt=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf 'ref=%s\ncommit=%s\n' "${GITHUB_REF}" "$(git rev-parse HEAD)"
            printf 'run_url=%s/%s/actions/runs/%s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } > infra/netris/logs/run-metadata.txt

      - name: Overlay tests from OSAC mono-repo
        id: osac-source
        env:
          OSAC_REPO: ${{ inputs.osac-repo }}
          OSAC_REF: ${{ inputs.osac-branch }}
        run: |
          OSAC_REPO="${OSAC_REPO:-https://github.com/osac-project/osac.git}"
          OSAC_REF="${OSAC_REF:-main}"

          if [[ ! "${OSAC_REPO}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$ ]]; then
            echo "::error::osac-repo must be an https://github.com/owner/repo[.git] URL"
            exit 1
          fi
          if [[ ! "${OSAC_REF}" =~ ^[A-Za-z0-9._/@-]+$ ]] \
            || ! git check-ref-format --branch "${OSAC_REF}" >/dev/null 2>&1; then
            echo "::error::osac-branch is not a valid branch, tag, or commit reference"
            exit 1
          fi

          OSAC_CLONE_DIR="${RUNNER_TEMP}/osac-test-source"
          git init "${OSAC_CLONE_DIR}"
          git -C "${OSAC_CLONE_DIR}" fetch --depth 1 "${OSAC_REPO}" "${OSAC_REF}"
          git -C "${OSAC_CLONE_DIR}" checkout FETCH_HEAD
          OSAC_SHA=$(git -C "${OSAC_CLONE_DIR}" rev-parse HEAD)
          echo "OSAC source for tests, CLI, images, installer/CRDs and AAP: ${OSAC_REPO}@${OSAC_SHA}"
          echo "repo=${OSAC_REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${OSAC_SHA}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "${OSAC_CLONE_DIR}/tests/e2e/conftest.py" ]]; then
            echo "::error::${OSAC_REPO}@${OSAC_REF} does not contain tests/e2e/conftest.py"
            exit 1
          fi

          # Keep this repo's pyproject.toml/uv.lock and runner utilities; only
          # the OSAC-owned test tree is overlaid, matching the CaaS full-install
          # workflow's test source handling.
          rm -rf tests/
          cp -a "${OSAC_CLONE_DIR}/tests" ./tests

      # SECURITY: EXTRA_VARS ends up passed as EXTRA_VARS='$(EXTRA_VARS)' on
      # a recipe line through several layers of make (root Makefile ->
      # infra/netris/Makefile) before reaching
      # ansible-playbook. GNU Make recursively re-expands $(...) sequences
      # every time a variable is dereferenced -- verified empirically that
      # an image-override value containing e.g. $(shell <cmd>) gets executed
      # for real by make itself during that expansion, independent of any
      # shell-quoting concerns, giving anyone with write access to dispatch
      # this workflow root code execution on the ephemeral box (with access
      # to every secret staged there: pull secret, AAP/Netris licenses,
      # Route53 AWS creds). Real container image references never contain
      # anything outside this character set, so validate-and-reject instead
      # of trying to escape -- escaping doesn't cleanly survive an unknown
      # number of make-expansion layers (verified: a single $ -> $$ escape
      # is consumed by the first layer and unprotected by the second). Runs
      # first, before any Vault secret fetch, so a bad input fails fast.
      - name: Validate component image override inputs
        shell: bash
        env:
          OSAC_INSTALLER_IMAGE: ${{ inputs.osac-installer-image }}
          OSAC_OPERATOR_IMAGE: ${{ inputs.osac-operator-image }}
          FULFILLMENT_SERVICE_IMAGE: ${{ inputs.fulfillment-service-image }}
          OSAC_AAP_EE_IMAGE: ${{ inputs.osac-aap-ee-image }}
          OSAC_REPO: ${{ steps.osac-source.outputs.repo }}
          OSAC_BRANCH: ${{ steps.osac-source.outputs.sha }}
        run: |
          for name in OSAC_INSTALLER_IMAGE OSAC_OPERATOR_IMAGE FULFILLMENT_SERVICE_IMAGE OSAC_AAP_EE_IMAGE OSAC_REPO; do
            value="${!name}"
            if [[ -n "$value" ]] && [[ ! "$value" =~ ^[A-Za-z0-9._/:@-]+$ ]]; then
              echo "::error::${name} contains characters outside a valid reference (letters, digits, and ._/:@- only): ${value}"
              exit 1
            fi
          done
          for name in OSAC_BRANCH; do
            value="${!name}"
            if [[ -n "$value" ]]; then
              if [[ ! "$value" =~ ^[A-Za-z0-9._/@-]+$ ]]; then
                echo "::error::${name} contains characters outside a valid branch name (letters, digits, and ._/@- only): ${value}"
                exit 1
              fi
              if ! git check-ref-format --branch "$value" >/dev/null 2>&1; then
                echo "::error::${name} is not a valid git branch name: ${value}"
                exit 1
              fi
            fi
          done

      - name: Build component image overrides
        id: extra-vars
        shell: bash
        env:
          OSAC_OPERATOR_IMAGE: ${{ inputs.osac-operator-image }}
          FULFILLMENT_SERVICE_IMAGE: ${{ inputs.fulfillment-service-image }}
          OSAC_AAP_EE_IMAGE: ${{ inputs.osac-aap-ee-image }}
          OSAC_REPO: ${{ steps.osac-source.outputs.repo }}
          OSAC_BRANCH: ${{ steps.osac-source.outputs.sha }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo dnf install -y jq
          fi
          # This profile deploys CaaS over the Metal3 BMaaS backend. Keep the
          # infrastructure setup aligned with caas-ci's bmf.metal3.enabled;
          # prep-osac uses this flag to create the required Provisioning CR.
          # The moving metering-service:latest image now requires an issuer
          # setting that this selected OSAC branch does not provide. Pin the
          # last-known-good image until the chart and image contract align.
          METERING_SERVICE_IMAGE_DIGEST="05c7911ef53b19694488f08191677149c47b00466053ae599ec034031a19c85c"
          EXTRA_VARS=$(jq -cn --arg digest "$METERING_SERVICE_IMAGE_DIGEST" \
            '{bare_metal_services:true,metering_service_image_digest:$digest}')
          declare -A OVERRIDES=(
            [osac_operator_image]="$OSAC_OPERATOR_IMAGE"
            [fulfillment_service_image]="$FULFILLMENT_SERVICE_IMAGE"
            [osac_aap_image]="$OSAC_AAP_EE_IMAGE"
            [osac_repo]="$OSAC_REPO"
            [osac_branch]="$OSAC_BRANCH"
            [aap_project_git_uri]="$OSAC_REPO"
            [aap_project_git_branch]="$OSAC_BRANCH"
          )
          for key in "${!OVERRIDES[@]}"; do
            value="${OVERRIDES[$key]}"
            if [ -n "$value" ]; then
              EXTRA_VARS=$(echo "$EXTRA_VARS" | jq -c --arg k "$key" --arg v "$value" '. + {($k): $v}')
              echo "Component image override: ${key}=${value}"
            fi
          done
          echo "json=${EXTRA_VARS}" >> "$GITHUB_OUTPUT"

      - name: Log unconsumed osac-installer-image input
        shell: bash
        env:
          OSAC_INSTALLER_IMAGE: ${{ inputs.osac-installer-image }}
        run: |
          if [ -n "${OSAC_INSTALLER_IMAGE}" ]; then
            echo "osac-installer-image was set (${OSAC_INSTALLER_IMAGE}) but is not consumed yet -- see the 'Build component image overrides' step's comment."
          fi

      # push-secrets already staged these on the box (before the JIT runner
      # even started) since the box can't talk to Vault itself -- this just
      # copies them from that fixed staging location into infra/netris/ and
      # /root/pull-secret, which didn't exist until this job's own checkout
      # above ran.
      - name: Stage CaaS/Netris secrets into place
        shell: bash
        env:
          NETRIS_DIR: infra/netris
        run: ./scripts/ec2-runner/stage-caas-netris-secrets.sh

      # Each stage is a separate step (rather than one `make e2e` call) for
      # per-stage visibility/timing in the Actions UI, mirroring Prow's own
      # per-step granularity (lab-setup/lab-deploy/lab-snapshot/caas-setup
      # were all separate Prow steps too). make e2e INFRA=netris SUITE=caas
      # is the equivalent single-command form if that granularity is ever
      # not wanted.
      - name: Install prerequisites and cache images
        shell: bash
        timeout-minutes: 30
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make setup-infra INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      # setup-infra (roles/setup-infra) just built osac to $HOME/.local/bin,
      # a job-scoped, non-root path instead of the old machine-wide
      # /usr/local/bin -- which is not necessarily on PATH for the
      # non-interactive shells make/ansible-playbook use. roles/create-caas
      # and roles/setup-caas both invoke bare `osac ...` relying on PATH
      # resolution, so every later step in this job needs it added
      # explicitly via GITHUB_PATH (GITHUB_PATH changes apply to all
      # subsequent steps in the job, not just this one).
      - name: Add osac CLI to PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSAC_CLI_BIN=$HOME/.local/bin/osac" >> "$GITHUB_ENV"

      - name: Deploy Netris lab
        shell: bash
        # 60 (not 45) so a SoftGate bootstrap/agent-readiness failure runs its
        # full Ansible retry budget and the rescue diagnostics capture before
        # GitHub Actions kills the step — at 45m the step timed out ~40s before
        # the rescue would have fired, losing per-SoftGate logs.
        timeout-minutes: 60
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make deploy-infra INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      - name: Deploy OCP from snapshot
        shell: bash
        timeout-minutes: 60
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make deploy-ocp INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      - name: Build and load component images
        id: components
        timeout-minutes: 60
        shell: bash
        env:
          COMPONENTS_JSON_INPUT: ${{ inputs.components || '[]' }}
          OSAC_REPO: ${{ steps.osac-source.outputs.repo }}
          OSAC_SHA: ${{ steps.osac-source.outputs.sha }}
          OSAC_OPERATOR_IMAGE: ${{ inputs.osac-operator-image }}
          FULFILLMENT_SERVICE_IMAGE: ${{ inputs.fulfillment-service-image }}
          OSAC_AAP_EE_IMAGE: ${{ inputs.osac-aap-ee-image }}
          KUBECONFIG: /root/.kube/config
        run: |
          # An empty components input still builds a coherent CaaS/BMaaS stack.
          # Registry overrides replace the corresponding default build; explicit
          # components entries retain precedence over registry overrides.
          CORE_COMPONENTS=$(jq -nc --arg repo "${OSAC_REPO}" --arg ref "${OSAC_SHA}" '
            [
              ({repo: $repo, ref: $ref, containerfile: "fulfillment-service/Containerfile", context: ".", imageKey: "service.images.service"}
                | select(env.FULFILLMENT_SERVICE_IMAGE == "")),
              ({repo: $repo, ref: $ref, containerfile: "osac-operator/Containerfile", context: ".", imageKey: "operator.image.repository"}
                | select(env.OSAC_OPERATOR_IMAGE == "")),
              ({repo: $repo, ref: $ref, containerfile: "osac-aap/execution-environment/execution-environment.yaml", imageKey: "aap.bootstrap.image", buildType: "ansible-builder"}
                | select(env.OSAC_AAP_EE_IMAGE == "")),
              {repo: $repo, ref: $ref, containerfile: "bare-metal-fulfillment-operator/Containerfile", context: ".", imageKey: "bmf.image.repository"}
            ]')
          COMPONENTS_JSON=$(jq -ce --argjson core "${CORE_COMPONENTS}" '
            if type != "array" then error("components must be an array") else . end
            | map(if .imageKey == "service.images.service.repository" then .imageKey = "service.images.service" else . end)
            | . as $requested
            | if any(.[]; (.repo | type) != "string" or (.ref | type) != "string" or (.imageKey | type) != "string")
              then error("each component requires repo, ref and imageKey") else . end
            | if (map(.imageKey) | unique | length) != length
              then error("duplicate component imageKey") else . end
            | [$core[] | select(.imageKey as $key | $requested | all(.[]; .imageKey != $key))] + $requested
          ' <<< "${COMPONENTS_JSON_INPUT}")
          COUNT=$(echo "${COMPONENTS_JSON}" | jq 'length')
          IMAGE_OVERRIDES="{}"
          NODE_NAME=$(oc get nodes -o jsonpath='{.items[0].metadata.name}')

          declare -A REPO_PINNED_SHA

          for i in $(seq 0 $((COUNT - 1))); do
            repo=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].repo")
            ref=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].ref")
            file=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].containerfile // \"Containerfile\"")
            image_key=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].imageKey")
            build_type=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].buildType // \"containerfile\"")
            context=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].context // empty")

            tag="localhost/component-${i}:${GITHUB_RUN_ID}"
            src="$RUNNER_TEMP/component-${i}-src"

            echo "::group::Build component[$i]: ${repo}@${ref} (${file})"
            repo_url="${repo}"
            if [[ "${repo_url}" != https://* ]]; then
              repo_url="https://github.com/${repo_url%.git}.git"
            fi
            source_key="${repo_url%.git}@${ref}"
            if [[ "${repo_url%.git}" == "${OSAC_REPO%.git}" && "${ref}" == "${OSAC_SHA}" ]]; then
              src="${RUNNER_TEMP}/osac-test-source"
              sha="${OSAC_SHA}"
            elif [[ -n "${REPO_PINNED_SHA[$source_key]:-}" ]]; then
              sha="${REPO_PINNED_SHA[$source_key]}"
              echo "Cloning ${repo} at pinned SHA ${sha} (first clone resolved this from ref '${ref}')."
              git init "${src}"
              git -C "${src}" fetch --depth 1 "${repo_url}" "${sha}"
              git -C "${src}" checkout FETCH_HEAD
            else
              git init "${src}"
              git -C "${src}" fetch --depth 1 "${repo_url}" "${ref}"
              git -C "${src}" checkout FETCH_HEAD
              sha=$(git -C "${src}" rev-parse HEAD)
              REPO_PINNED_SHA[$source_key]="${sha}"
              echo "Pinned ${repo} to SHA ${sha} (resolved from ref '${ref}')."
            fi

            # Derive component_dir (for CLI build, CRD discovery) from
            # the containerfile path, and build_context (for podman build)
            # from the optional context field.  When context is omitted,
            # build_context defaults to component_dir (the containerfile's
            # parent directory), preserving pre-existing behavior.
            component_dir="${src}"
            build_context="${src}"
            containerfile_name="${file}"
            if [[ "${file}" == */* ]]; then
              component_dir="${src}/$(dirname "${file}")"
              containerfile_name="$(basename "${file}")"
            fi
            if [[ -n "${context}" ]]; then
              build_context="${src}/${context}"
            else
              build_context="${component_dir}"
            fi

            if [[ "${build_type}" == "ansible-builder" ]]; then
              /usr/bin/python3 -m pip install --ignore-installed --quiet 'ansible-builder~=3.0'
              # Relative requirements and additional_build_files are resolved
              # from the execution-environment directory.
              (cd "${component_dir}" && ansible-builder create --file "${containerfile_name}" --context context)
              podman build -t "${tag}" -f "${component_dir}/context/Containerfile" "${component_dir}/context"
            else
              podman build --build-arg GODEBUG=http2client=0 -t "${tag}" -f "${component_dir}/${containerfile_name}" "${build_context}"
            fi

            # Use the CLI from the same fulfillment-service image under test
            # when one was built from this OSAC ref.
            if [[ "${image_key}" == "service.images.service" || "${image_key}" == "service.images.service.repository" ]]; then
              cli_container=$(podman create "${tag}")
              podman cp "${cli_container}:/usr/local/bin/osac" "${RUNNER_TEMP}/osac-cli-bin"
              podman rm "${cli_container}" >/dev/null
              chmod +x "${RUNNER_TEMP}/osac-cli-bin"
              echo "OSAC_CLI_BIN=${RUNNER_TEMP}/osac-cli-bin" >> "$GITHUB_ENV"
            fi

            echo "Loading ${tag} onto node ${NODE_NAME}..."
            podman save "${tag}" | oc debug "node/${NODE_NAME}" -t=false -- chroot /host podman load

            # Map imageKey to ansible extra-var name
            case "${image_key}" in
              service.images.service|service.images.service.repository) var_name="fulfillment_service_image" ;;
              operator.image.repository)   var_name="osac_operator_image" ;;
              aap.bootstrap.image)         var_name="osac_aap_image" ;;
              aap.configAsCode.eeImage)    var_name="osac_aap_ee_image" ;;
              bmf.image.repository)        var_name="bmf_operator_image" ;;
              *)
                echo "::error::components[$i].imageKey '${image_key}' is not a recognized override key"
                exit 1
                ;;
            esac

            IMAGE_OVERRIDES=$(echo "${IMAGE_OVERRIDES}" | jq -c --arg k "${var_name}" --arg v "${tag}" '. + {($k): $v}')
            echo "Built ${var_name}=${tag}"
            echo "::endgroup::"
          done

          echo "overrides=${IMAGE_OVERRIDES}" >> "$GITHUB_OUTPUT"

      - name: Build OSAC E2E test image
        env:
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}"
        run: |
          BUILD_ARGS=(--no-cache)
          if [[ -n "${OSAC_CLI_BIN:-}" ]] && [[ -f "${OSAC_CLI_BIN}" ]]; then
            cp "${OSAC_CLI_BIN}" ./osac-cli-bin
            BUILD_ARGS+=(--build-arg OSAC_CLI_BIN=osac-cli-bin)
          fi
          podman build "${BUILD_ARGS[@]}" -t "${E2E_IMAGE}" -f Containerfile .
          rm -f ./osac-cli-bin

      - name: Deploy OSAC
        id: deploy-osac
        timeout-minutes: 90
        shell: bash
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
          COMPONENT_OVERRIDES: ${{ steps.components.outputs.overrides || '{}' }}
        run: |
          MERGED=$(jq -nc --argjson base "${EXTRA_VARS}" --argjson built "${COMPONENT_OVERRIDES}" '$base + $built')
          make deploy-osac INFRA=netris SUITE=caas EXTRA_VARS="${MERGED}"

      # CaaS uses the BMaaS BMH pool. Create those hosts after OSAC is ready
      # (BMaaS registers its catalog there) and before setup-caas prelabels the
      # hosts. The workers stay off until OSAC provisions their order InfraEnv.
      - name: Setup BMaaS hosts for CaaS
        shell: bash
        timeout-minutes: 30
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make setup-suite INFRA=netris SUITE=bmaas_networking EXTRA_VARS="${EXTRA_VARS}"

      - name: Setup CaaS hosts and catalog
        shell: bash
        # Includes CaaS worker preparation, catalog registration, and AAP
        # template publishing. The shared discovery-ISO wait is skipped for CaaS.
        timeout-minutes: 45
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make setup-suite INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      # Arm serial-console readers while workers are still off. The diagnostic
      # helper attaches as soon as ClusterOrder provisioning powers each VM on,
      # preserving first-boot serial output and DHCP/DNS/connection metadata
      # for the order InfraEnv registration path.
      - name: Start CaaS worker boot and network capture
        timeout-minutes: 3
        shell: bash
        continue-on-error: true
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: >-
          make -C infra/netris capture-caas-worker-diagnostics
          CAAS_WORKER_DIAGNOSTICS_ACTION=start EXTRA_VARS="${EXTRA_VARS}"

      - name: Deploy CaaS cluster
        id: deploy-caas
        timeout-minutes: 90
        shell: bash
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make -C infra/netris deploy-caas EXTRA_VARS="${EXTRA_VARS}"

      - name: Create test adapter route for metering tests
        id: metering-adapter
        env:
          KUBECONFIG: /root/.kube/config
          OSAC_NAMESPACE: osac-e2e-ci
        shell: bash
        run: |
          SVC_NAME=$(oc get svc \
            -n "${OSAC_NAMESPACE}" \
            -l app.kubernetes.io/component=echo-adapter \
            -o jsonpath='{.items[0].metadata.name}')
          if [[ -z "${SVC_NAME}" ]]; then
            echo "::error::No echo-adapter Service found in namespace ${OSAC_NAMESPACE}"
            exit 1
          fi
          oc expose "svc/${SVC_NAME}" -n "${OSAC_NAMESPACE}" --name=metering-test-adapter
          ROUTE_HOST=$(oc get route metering-test-adapter -n "${OSAC_NAMESPACE}" -o jsonpath='{.spec.host}')
          if [[ -z "${ROUTE_HOST}" ]]; then
            echo "::error::Metering test adapter route is not available"
            exit 1
          fi
          echo "url=http://${ROUTE_HOST}" >> "$GITHUB_OUTPUT"

      - name: Run OSAC CaaS fabric E2E tests
        id: test
        env:
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}"
          TEST_FILTER: ${{ inputs.test-filter }}
          TEST_MARKER: ${{ inputs.test-marker }}
          OSAC_NAMESPACE: osac-e2e-ci
          OSAC_CLUSTER_TEMPLATE: ocp-ci-small
          METERING_ADAPTER_URL: ${{ steps.metering-adapter.outputs.url }}
        run: |
          KUBECONFIG_PATH=/root/.kube/config
          mkdir -p "$RUNNER_TEMP/test-output"
          rm -f "$RUNNER_TEMP/caas_ssh_key" "$RUNNER_TEMP/caas_ssh_key.pub"
          ssh-keygen -t ed25519 -f "$RUNNER_TEMP/caas_ssh_key" -N '' -q

          FILTER_ARGS=()
          if [[ -n "${TEST_FILTER}" ]]; then
            FILTER_ARGS=(-k "${TEST_FILTER}")
          fi
          MARKER_ARGS=()
          if [[ -n "${TEST_MARKER}" ]]; then
            MARKER_ARGS=(-m "${TEST_MARKER}")
          fi

          podman run --rm --network=host \
            -v "${KUBECONFIG_PATH}":/root/.kube/config:ro,Z \
            -v /root/pull-secret:/root/pull-secret:ro,Z \
            -v "${RUNNER_TEMP}/caas_ssh_key.pub":/root/.ssh/id_rsa.pub:ro,Z \
            -v "${RUNNER_TEMP}/test-output":/tmp/test-output:Z \
            -e KUBECONFIG=/root/.kube/config \
            -e OSAC_NAMESPACE="${OSAC_NAMESPACE}" \
            -e OSAC_CLUSTER_TEMPLATE="${OSAC_CLUSTER_TEMPLATE}" \
            -e OSAC_PULL_SECRET_PATH=/root/pull-secret \
            -e METERING_ADAPTER_URL="${METERING_ADAPTER_URL}" \
            "${E2E_IMAGE}" \
            pytest tests/e2e/caas/ "${FILTER_ARGS[@]}" "${MARKER_ARGS[@]}" \
              -n 0 --junitxml=/tmp/test-output/junit.xml -v

      - name: Capture CaaS worker boot and network diagnostics
        if: always()
        timeout-minutes: 10
        shell: bash
        continue-on-error: true
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: >-
          make -C infra/netris capture-caas-worker-diagnostics
          CAAS_WORKER_DIAGNOSTICS_ACTION=collect EXTRA_VARS="${EXTRA_VARS}"

      - name: Gather related AAP worker job artifacts
        if: always() && steps.deploy-osac.outcome != 'skipped' && steps.deploy-osac.outcome != ''
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/gather-artifacts
        with:
          namespace: osac-e2e-ci
          kubeconfig-path: /root/.kube/config
          artifact-name: caas-aap-jobs-${{ github.run_id }}
          aap-job-ids-file: ${{ github.workspace }}/infra/netris/logs/caas/worker-diagnostics/aap-job-ids.json
          aap-jobs-only: "true"

      - name: Include redacted AAP worker output in Netris artifact
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        env:
          OSAC_ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
          OSAC_REDACTION_MARKER: ${{ runner.temp }}/osac-artifacts-redaction-complete
          WORKER_DIAGNOSTICS_DIR: infra/netris/logs/caas/worker-diagnostics
        run: |
          AAP_OUTPUT_DIR="${WORKER_DIAGNOSTICS_DIR}/aap-jobs"
          mkdir -p "${WORKER_DIAGNOSTICS_DIR}"
          rm -rf -- "${AAP_OUTPUT_DIR}"
          mkdir -p "${AAP_OUTPUT_DIR}"
          status="redacted-source-unavailable"

          if [[ -f "${OSAC_REDACTION_MARKER}" && -d "${OSAC_ARTIFACT_DIR}/aap-jobs" ]]; then
            cp -a "${OSAC_ARTIFACT_DIR}/aap-jobs/." "${AAP_OUTPUT_DIR}/"
            output_count="$(find "${AAP_OUTPUT_DIR}" -maxdepth 1 -type f | wc -l)"
            if [[ "${output_count}" -gt 0 ]]; then
              status="captured"
            else
              status="collector-completed-no-output"
            fi
          fi

          captured_files_json="$(find "${AAP_OUTPUT_DIR}" -maxdepth 1 -type f -printf 'aap-jobs/%f\n' 2>/dev/null | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg status "${status}" \
            --argjson capturedFiles "${captured_files_json}" \
            '{capturedAt: $capturedAt, status: $status, capturedFiles: $capturedFiles}' \
            > "${WORKER_DIAGNOSTICS_DIR}/aap-capture-status.json"

      - name: Gather OSAC test artifacts
        if: always() && steps.deploy-osac.outcome != 'skipped' && steps.deploy-osac.outcome != ''
        continue-on-error: true
        uses: ./.github/actions/gather-artifacts
        with:
          namespace: osac-e2e-ci
          kubeconfig-path: /root/.kube/config
          artifact-name: osac-logs-caas-netris-full-install-${{ github.run_id }}
          junit-path: ${{ runner.temp }}/test-output/junit.xml
          aap-job-ids-file: ${{ github.workspace }}/infra/netris/logs/caas/worker-diagnostics/aap-job-ids.json

      - name: Include redacted OSAC worker diagnostics in Netris artifact
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        env:
          OSAC_ARTIFACT_DIR: ${{ runner.temp }}/osac-artifacts
          OSAC_REDACTION_MARKER: ${{ runner.temp }}/osac-artifacts-redaction-complete
          WORKER_DIAGNOSTICS_DIR: infra/netris/logs/caas/worker-diagnostics
        run: |
          DESTINATION="${WORKER_DIAGNOSTICS_DIR}/osac"
          rm -rf -- "${DESTINATION}"
          mkdir -p "${DESTINATION}"
          copied_files=()
          status="redacted-source-unavailable"

          if [[ -f "${OSAC_REDACTION_MARKER}" && -d "${OSAC_ARTIFACT_DIR}" ]]; then
            status="redacted-source-available"
            for filename in \
              cluster-order-agents.yaml \
              cluster-order-infraenvs.txt \
              discovery-agents.yaml \
              discovery-infraenvs.txt; do
              if [[ -f "${OSAC_ARTIFACT_DIR}/${filename}" ]]; then
                cp "${OSAC_ARTIFACT_DIR}/${filename}" "${DESTINATION}/"
                copied_files+=("osac/${filename}")
              fi
            done
            if [[ ${#copied_files[@]} -eq 0 ]]; then
              status="redacted-source-available-no-matching-files"
            else
              status="captured"
            fi
          fi

          copied_files_json="$(printf '%s\n' "${copied_files[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg status "${status}" \
            --argjson copiedFiles "${copied_files_json}" \
            '{capturedAt: $capturedAt, status: $status, copiedFiles: $copiedFiles}' \
            > "${WORKER_DIAGNOSTICS_DIR}/osac-artifact-copy-status.json"

      # Two separate steps, each independently best-effort (rather than one
      # script with both commands): GH Actions' default bash shell runs with
      # -e, so if the first command failed inside a single multi-line step,
      # the second would never even attempt to run despite
      # continue-on-error -- that only stops a step's failure from failing
      # the job, it doesn't help a step's own script recover mid-script.
      - name: Gather infra diagnostics
        if: always()
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: make gather-infra INFRA=netris

      - name: Gather management cluster diagnostics
        if: always()
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: make -C infra/netris gather-mgmt-cluster

      - name: Gather CaaS diagnostics
        if: always()
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: make gather-suite INFRA=netris SUITE=caas

      - name: Stage Netris artifacts for redacted collection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          staging_dir="${RUNNER_TEMP}/osac-artifacts"
          cleanup_stage() {
            rm -rf -- "${staging_dir}/reports" "${staging_dir}/netris-logs"
          }
          trap cleanup_stage ERR
          mkdir -p "${staging_dir}"
          [[ -d reports ]] && cp -a reports "${staging_dir}/reports"
          [[ -d infra/netris/logs ]] && cp -a infra/netris/logs "${staging_dir}/netris-logs"
          if [[ -d "${staging_dir}/netris-logs" ]]; then
            find "${staging_dir}/netris-logs" -type d \( -name must-gather -o -name inspect \) \
              -prune -print -exec rm -rf -- {} +
            remaining=$(find "${staging_dir}/netris-logs" -type d \( -name must-gather -o -name inspect \) -print -quit)
            if [[ -n "${remaining}" ]]; then
              echo "::error::Refusing to stage raw must-gather/inspect diagnostics: ${remaining}"
              cleanup_stage
              exit 1
            fi
          fi
          trap - ERR

      - name: Select kubeconfig for artifact collection
        id: artifact-kubeconfig
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_kubeconfig="${RUNNER_TEMP}/netris-artifact-kubeconfig"
          if [[ -s /root/.kube/config ]] && install -m 600 /root/.kube/config "$artifact_kubeconfig"; then
            echo "path=${artifact_kubeconfig}" >> "$GITHUB_OUTPUT"
          else
            umask 077
            placeholder="${RUNNER_TEMP}/netris-empty-kubeconfig"
            : > "$placeholder"
            echo "path=${placeholder}" >> "$GITHUB_OUTPUT"
            mkdir -p "${RUNNER_TEMP}/osac-artifacts"
            cat > "${RUNNER_TEMP}/osac-artifacts/cluster-collection-status.txt" <<'EOF'
          status=skipped
          reason=management kubeconfig was not created
          staged_lab_diagnostics=will be redacted and uploaded
          EOF
          fi

      - name: Gather and redact Netris artifacts
        if: always()
        uses: ./.github/actions/gather-artifacts
        with:
          namespace: osac-e2e-ci
          kubeconfig-path: ${{ steps.artifact-kubeconfig.outputs.path }}
          artifact-name: caas-netris-artifacts

      - name: Hold failed Netris lab for investigation
        if: failure() && inputs.debug-on-failure
        shell: bash
        timeout-minutes: 35
        run: |
          echo "::notice title=Debug hold::Failure diagnostics are complete. The Netris lab and its DNS records will remain available for 30 minutes, then cleanup and EC2 teardown will run automatically."
          sleep 1800

      # Not part of the formal backend contract (infra/contract.md's target
      # list doesn't include it), so called directly
      # rather than through a root Makefile wrapper -- see this PR's
      # description for why a generic root-level wrapper would be
      # misleading for a netris-specific extra.
      - name: Cleanup DNS records
        if: always()
        shell: bash
        timeout-minutes: 5
        continue-on-error: true
        run: make -C infra/netris cleanup-dns

      - name: Gather EC2 runner artifacts
        if: always()
        uses: ./.github/actions/gather-ec2-runner-artifacts

  teardown:
    needs: [provision, push-secrets, e2e]
    if: always()
    uses: ./.github/workflows/ec2-runner-teardown.yml
    permissions:
      contents: read
    with:
      instance-id: ${{ needs.provision.outputs.instance-id }}
      runner-id: ${{ needs.provision.outputs.runner-id }}
      orchestrator-runner-label: ${{ inputs.orchestrator-runner-label }}
      aws-region: ${{ inputs.aws-region }}
      test-infra-repository: ${{ inputs.test-infra-repository }}
