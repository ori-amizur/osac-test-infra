---
name: E2E CaaS Netris Full Install

permissions:
  contents: read

# Suite-specific: provisions an ephemeral EC2 bare-metal box (via
# ec2-runner-provision.yml), runs the real CaaS/Netris e2e flow on it, and
# tears it down (via ec2-runner-teardown.yml). The provision/teardown
# pieces are generic and suite-agnostic -- see those files' own headers --
# split out specifically so a future suite needing the same bare-metal
# provisioning doesn't have to copy this file's plumbing, only write its
# own test job. See docs/ec2-ephemeral-runner-setup.md.
on:
  workflow_call:
    inputs:
      instance-type:
        description: "EC2 instance type"
        required: false
        type: string
        default: "c5n.metal"
      aws-region:
        description: "AWS region to launch into"
        required: false
        type: string
        default: "us-east-1"
      orchestrator-runner-label:
        description: "Self-hosted runner label for the orchestrator (dedicated, not the shared osac-ci fleet, so it's never queued behind existing e2e jobs)"
        required: false
        type: string
        default: "osac-ci-orchestrator"
      # The default installs real packages/network access (dnf + pip), unlike
      # ec2-runner-provision.yml's own generic "command -v podman" default --
      # this workflow supplies the CaaS/Netris-specific default itself,
      # since the provisioner shouldn't hardcode one suite's prerequisites.
      # Each semicolon-separated item runs as its own SSH call with no
      # retry -- v1 accepts that a transient mirror/PyPI hiccup hard-fails
      # verification (skipping JIT registration, same cost as any other
      # tooling-check failure), matching this repo's existing
      # accept-and-revisit-if-flaky precedent (see provision.sh's
      # InsufficientInstanceCapacity handling for the same philosophy).
      tooling-check-cmds:
        description: "Semicolon-separated commands to run/verify on the box before JIT registration. Defaults to installing and verifying the CaaS/Netris flow's prerequisites (ansible-core, python3-pip, make -- matching what the equivalent Prow lab-setup step installed, and infra/netris/README.md's own documented setup)."
        required: false
        type: string
        default: "dnf install -y ansible-core python3-pip make; pip3 install ansible; command -v ansible-playbook; command -v make"
      osac-installer-image:
        description: "Override osac-installer image (registry-pullable reference, e.g. from a component repo's own PR build) -- accepted but not yet consumed: infra/netris has no plain extra-var for this (see the test job's 'Build component image overrides' step comment), needs podman-extraction handling in a later PR"
        required: false
        type: string
        default: ""
      osac-operator-image:
        description: "Override osac-operator image (registry-pullable reference) -- empty means no override"
        required: false
        type: string
        default: ""
      fulfillment-service-image:
        description: "Override fulfillment-service image (registry-pullable reference) -- empty means no override"
        required: false
        type: string
        default: ""
      osac-aap-ee-image:
        description: "Override osac-aap execution-environment image (registry-pullable reference) -- empty means no override"
        required: false
        type: string
        default: ""
      osac-repo:
        description: "Override osac mono-repo git URI -- empty means upstream"
        required: false
        type: string
        default: ""
      osac-branch:
        description: "Branch, tag, or commit of the osac mono-repo to clone -- empty means main"
        required: false
        type: string
        default: ""
      components:
        description: >-
          JSON array of components to build from source on the EC2 box and
          load onto the SNO node. Each entry: repo, ref, containerfile,
          imageKey (Helm value path), optional buildType ("ansible-builder"),
          and optional context (build context directory relative to repo root;
          defaults to the containerfile's parent directory).
          Empty array (default) builds nothing from source.
        required: false
        type: string
        default: "[]"
      osac-test-marker:
        description: "pytest marker expression for the OSAC suite cloned from osac-repo/osac-branch"
        required: false
        type: string
        default: "requires_caas_fabric"
      test-infra-repository:
        description: "Repository to checkout for actions and scripts (for cross-repo calls)"
        required: false
        type: string
        default: ""
      fork-pr-author-association:
        description: "PR author_association from the caller"
        required: false
        type: string
        default: ""
      fork-pr-author:
        description: "GitHub login of the PR author (for fork PR org membership check)"
        required: false
        type: string
        default: ""
      pr-number:
        description: "PR number (for label-based authorization check)"
        required: false
        type: string
        default: ""
    outputs:
      result:
        description: "Overall result: PASSED or FAILED"
        value: ${{ jobs.e2e.outputs.result }}

jobs:
  # Runs before provision (not inside push-secrets, which only runs after
  # provision) specifically so an unauthorized fork PR is rejected before
  # a real EC2 instance is ever launched -- provisioning is exactly the
  # cost/blast-radius this authorization gate exists to prevent, so it
  # can't be allowed to happen first. Lightweight: only needs the local
  # AppRole files (already present on the orchestrator) and a couple of
  # GitHub API calls, no dependency on the box existing.
  authorize:
    runs-on: ${{ inputs.orchestrator-runner-label }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          persist-credentials: false

      - name: Validate and bootstrap
        id: setup
        uses: ./.github/actions/validate-and-bootstrap
        with:
          test-suite: ec2-runner
          run-id: ${{ github.run_id }}

      - name: Authorize fork PR
        if: inputs.fork-pr-author-association != ''
        uses: ./.github/actions/authorize-fork-pr
        with:
          role-id: ${{ steps.setup.outputs.role-id }}
          secret-id: ${{ steps.setup.outputs.secret-id }}
          fork-pr-author: ${{ inputs.fork-pr-author }}
          pr-number: ${{ inputs.pr-number }}

  provision:
    needs: authorize
    uses: ./.github/workflows/ec2-runner-provision.yml
    permissions:
      contents: read
    with:
      instance-type: ${{ inputs.instance-type }}
      aws-region: ${{ inputs.aws-region }}
      orchestrator-runner-label: ${{ inputs.orchestrator-runner-label }}
      tooling-check-cmds: ${{ inputs.tooling-check-cmds }}
      test-infra-repository: ${{ inputs.test-infra-repository }}


  # Fetches all 5 CaaS/Netris secrets and pushes them to the box, on the
  # orchestrator -- not the box itself. The box was never bootstrapped with
  # the Vault SSH-tunnel/AppRole setup persistent machines like the
  # orchestrator have, confirmed the hard way (a real dispatch failed here:
  # "AppRole credentials missing or empty in ~/.vault-server/.approle").
  # See push-caas-netris-secrets.sh's header for the full rationale.
  push-secrets:
    needs: provision
    runs-on: ${{ inputs.orchestrator-runner-label }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Must match ec2-runner-provision.yml's derivation exactly.
      KNOWN_HOSTS_FILE: /tmp/osac-ec2-known-hosts-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          persist-credentials: false

      - name: Validate and bootstrap
        id: setup
        uses: ./.github/actions/validate-and-bootstrap
        with:
          test-suite: ec2-runner
          run-id: ${{ github.run_id }}

      # Authorization already happened in the authorize job, before
      # provision -- not repeated here.

      # Not ./.github/actions/fetch-and-write-secrets: that composite action
      # also writes a merged podman auth.json to $HOME/.config/containers and
      # (via sudo) /root/.config/containers -- appropriate for e2e-vmaas.yml,
      # where it runs on the same box that later podman-pulls images with it,
      # but wrong here: this job runs on the persistent orchestrator, not the
      # disposable box, so it would leave standing registry credentials on a
      # long-lived machine (the exact thing this fix is trying to avoid --
      # see push-caas-netris-secrets.sh's header) and needs sudo, which isn't
      # guaranteed on every orchestrator runner. infra/netris never reads
      # auth.json (confirmed: no reference to it anywhere under infra/netris
      # or the root Makefile) -- only the raw pull-secret JSON and AAP
      # license zip are actually needed, so fetch just those two directly.
      - name: Fetch pull secret and AAP license from Vault
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.setup.outputs.role-id }}
          secretId: ${{ steps.setup.outputs.secret-id }}
          exportEnv: false
          secrets: |
            secret/data/osac/e2e/pull-secret dockerconfigjson | PULL_SECRET ;
            secret/data/osac/e2e/aap-license license | AAP_LICENSE

      - name: Write pull secret and AAP license to temp files
        shell: bash
        env:
          PULL_SECRET: ${{ steps.vault-secrets.outputs.PULL_SECRET }}
          AAP_LICENSE: ${{ steps.vault-secrets.outputs.AAP_LICENSE }}
        run: |
          printf '%s' "${PULL_SECRET}" > "$RUNNER_TEMP/pull-secret.json"
          chmod 600 "$RUNNER_TEMP/pull-secret.json"
          printf '%s' "${AAP_LICENSE}" | base64 -d > "$RUNNER_TEMP/aap-license.zip"
          chmod 600 "$RUNNER_TEMP/aap-license.zip"

      - name: Fetch Netris license
        id: netris-license
        uses: ./.github/actions/fetch-netris-license
        with:
          role-id: ${{ steps.setup.outputs.role-id }}
          secret-id: ${{ steps.setup.outputs.secret-id }}

      - name: Fetch CaaS Route 53 credentials
        id: route53-creds
        uses: ./.github/actions/fetch-caas-route53-creds
        with:
          role-id: ${{ steps.setup.outputs.role-id }}
          secret-id: ${{ steps.setup.outputs.secret-id }}

      - name: Push CaaS/Netris secrets to ephemeral box
        shell: bash
        env:
          SSH_USER: ${{ needs.provision.outputs.ssh-user }}
          PUBLIC_IP: ${{ needs.provision.outputs.public-ip }}
          NETRIS_LICENSE: ${{ steps.netris-license.outputs.NETRIS_LICENSE }}
          ROUTE53_AWS_ACCESS_KEY_ID: ${{ steps.route53-creds.outputs.ROUTE53_AWS_ACCESS_KEY_ID }}
          ROUTE53_AWS_SECRET_ACCESS_KEY: ${{ steps.route53-creds.outputs.ROUTE53_AWS_SECRET_ACCESS_KEY }}
          AAP_LICENSE_ZIP_PATH: ${{ runner.temp }}/aap-license.zip
          PULL_SECRET_JSON_PATH: ${{ runner.temp }}/pull-secret.json
          LAB_NAME: ci-${{ github.run_id }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          export SSH_KEY_PATH="${HOME}/.ssh/osac_ec2_orchestrator"
          ./scripts/ec2-runner/push-caas-netris-secrets.sh

  e2e:
    needs: [provision, push-secrets]
    # The Netris lab flow can take several hours, and the serial OSAC CaaS
    # lifecycle tests each provision and remove a hosted cluster. This is an
    # explicit upper bound for the self-hosted ephemeral runner.
    runs-on: ${{ needs.provision.outputs.runner-label }}
    timeout-minutes: 840
    permissions:
      contents: read
    outputs:
      result: ${{ steps.osac-fabric-tests.outcome == 'success' && steps.deploy-caas.outcome == 'success' && 'PASSED' || 'FAILED' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.test-infra-repository || github.repository }}
          persist-credentials: false

      # SECURITY: EXTRA_VARS ends up passed as EXTRA_VARS='$(EXTRA_VARS)' on
      # a recipe line through several layers of make (root Makefile ->
      # infra/netris/Makefile) before reaching
      # ansible-playbook. GNU Make recursively re-expands $(...) sequences
      # every time a variable is dereferenced -- verified empirically that
      # an image-override value containing e.g. $(shell <cmd>) gets executed
      # for real by make itself during that expansion, independent of any
      # shell-quoting concerns, giving anyone with write access to dispatch
      # this workflow root code execution on the ephemeral box (with access
      # to every secret staged there: pull secret, AAP/Netris licenses,
      # Route53 AWS creds). Real container image references never contain
      # anything outside this character set, so validate-and-reject instead
      # of trying to escape -- escaping doesn't cleanly survive an unknown
      # number of make-expansion layers (verified: a single $ -> $$ escape
      # is consumed by the first layer and unprotected by the second). Runs
      # first, before any Vault secret fetch, so a bad input fails fast.
      - name: Validate component image override inputs
        shell: bash
        env:
          OSAC_INSTALLER_IMAGE: ${{ inputs.osac-installer-image }}
          OSAC_OPERATOR_IMAGE: ${{ inputs.osac-operator-image }}
          FULFILLMENT_SERVICE_IMAGE: ${{ inputs.fulfillment-service-image }}
          OSAC_AAP_EE_IMAGE: ${{ inputs.osac-aap-ee-image }}
          OSAC_REPO: ${{ inputs.osac-repo }}
          OSAC_BRANCH: ${{ inputs.osac-branch }}
        run: |
          for name in OSAC_INSTALLER_IMAGE OSAC_OPERATOR_IMAGE FULFILLMENT_SERVICE_IMAGE OSAC_AAP_EE_IMAGE OSAC_REPO; do
            value="${!name}"
            if [[ -n "$value" ]] && [[ ! "$value" =~ ^[A-Za-z0-9._/:@-]+$ ]]; then
              echo "::error::${name} contains characters outside a valid reference (letters, digits, and ._/:@- only): ${value}"
              exit 1
            fi
          done
          for name in OSAC_BRANCH; do
            value="${!name}"
            if [[ -n "$value" ]]; then
              if [[ ! "$value" =~ ^[A-Za-z0-9._/@-]+$ ]]; then
                echo "::error::${name} contains characters outside a valid branch name (letters, digits, and ._/@- only): ${value}"
                exit 1
              fi
              if ! git check-ref-format --branch "$value" >/dev/null 2>&1; then
                echo "::error::${name} is not a valid git branch name: ${value}"
                exit 1
              fi
            fi
          done

      - name: Build component image overrides
        id: extra-vars
        shell: bash
        env:
          OSAC_OPERATOR_IMAGE: ${{ inputs.osac-operator-image }}
          FULFILLMENT_SERVICE_IMAGE: ${{ inputs.fulfillment-service-image }}
          OSAC_AAP_EE_IMAGE: ${{ inputs.osac-aap-ee-image }}
          OSAC_REPO: ${{ inputs.osac-repo }}
          OSAC_BRANCH: ${{ inputs.osac-branch }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo dnf install -y jq
          fi
          EXTRA_VARS="{}"
          declare -A OVERRIDES=(
            [osac_operator_image]="$OSAC_OPERATOR_IMAGE"
            [fulfillment_service_image]="$FULFILLMENT_SERVICE_IMAGE"
            [osac_aap_image]="$OSAC_AAP_EE_IMAGE"
            [osac_repo]="$OSAC_REPO"
            [osac_branch]="$OSAC_BRANCH"
          )
          for key in "${!OVERRIDES[@]}"; do
            value="${OVERRIDES[$key]}"
            if [ -n "$value" ]; then
              EXTRA_VARS=$(echo "$EXTRA_VARS" | jq -c --arg k "$key" --arg v "$value" '. + {($k): $v}')
              echo "Component image override: ${key}=${value}"
            fi
          done
          echo "json=${EXTRA_VARS}" >> "$GITHUB_OUTPUT"

      - name: Log unconsumed osac-installer-image input
        shell: bash
        env:
          OSAC_INSTALLER_IMAGE: ${{ inputs.osac-installer-image }}
        run: |
          if [ -n "${OSAC_INSTALLER_IMAGE}" ]; then
            echo "osac-installer-image was set (${OSAC_INSTALLER_IMAGE}) but is not consumed yet -- see the 'Build component image overrides' step's comment."
          fi

      # push-secrets already staged these on the box (before the JIT runner
      # even started) since the box can't talk to Vault itself -- this just
      # copies them from that fixed staging location into infra/netris/ and
      # /root/pull-secret, which didn't exist until this job's own checkout
      # above ran.
      - name: Stage CaaS/Netris secrets into place
        shell: bash
        env:
          NETRIS_DIR: infra/netris
        run: ./scripts/ec2-runner/stage-caas-netris-secrets.sh

      # Each stage is a separate step (rather than one `make e2e` call) for
      # per-stage visibility/timing in the Actions UI, mirroring Prow's own
      # per-step granularity (lab-setup/lab-deploy/lab-snapshot/caas-setup
      # were all separate Prow steps too). make e2e INFRA=netris SUITE=caas
      # is the equivalent single-command form if that granularity is ever
      # not wanted.
      - name: Install prerequisites and cache images
        shell: bash
        timeout-minutes: 30
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make setup-infra INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      # setup-infra (roles/setup-infra) just built osac to $HOME/.local/bin,
      # a job-scoped, non-root path instead of the old machine-wide
      # /usr/local/bin -- which is not necessarily on PATH for the
      # non-interactive shells make/ansible-playbook use. roles/create-caas
      # and roles/setup-caas both invoke bare `osac ...` relying on PATH
      # resolution, so every later step in this job needs it added
      # explicitly via GITHUB_PATH (GITHUB_PATH changes apply to all
      # subsequent steps in the job, not just this one).
      - name: Add osac CLI to PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy Netris lab
        shell: bash
        timeout-minutes: 45
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make deploy-infra INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      - name: Deploy OCP from snapshot
        shell: bash
        timeout-minutes: 60
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make deploy-ocp INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      - name: Build and load component images
        if: inputs.components != '[]' && inputs.components != ''
        id: components
        timeout-minutes: 30
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
          KUBECONFIG: /root/.kube/config
        run: |
          COUNT=$(echo "${COMPONENTS_JSON}" | jq 'length')
          IMAGE_OVERRIDES="{}"
          NODE_NAME=$(oc get nodes -o jsonpath='{.items[0].metadata.name}')

          declare -A REPO_PINNED_SHA

          for i in $(seq 0 $((COUNT - 1))); do
            repo=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].repo")
            ref=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].ref")
            file=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].containerfile // \"Containerfile\"")
            image_key=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].imageKey")
            build_type=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].buildType // \"containerfile\"")
            context=$(echo "${COMPONENTS_JSON}" | jq -r ".[$i].context // empty")

            tag="localhost/component-${i}:${GITHUB_RUN_ID}"
            src="$RUNNER_TEMP/component-${i}-src"

            echo "::group::Build component[$i]: ${repo}@${ref} (${file})"
            if [[ -n "${REPO_PINNED_SHA[$repo]:-}" ]]; then
              sha="${REPO_PINNED_SHA[$repo]}"
              echo "Cloning ${repo} at pinned SHA ${sha} (first clone resolved this from ref '${ref}')."
              git init "${src}"
              git -C "${src}" fetch --depth 1 "https://github.com/${repo}.git" "${sha}"
              git -C "${src}" checkout FETCH_HEAD
            else
              git init "${src}"
              git -C "${src}" fetch --depth 1 "https://github.com/${repo}.git" "${ref}"
              git -C "${src}" checkout FETCH_HEAD
              sha=$(git -C "${src}" rev-parse HEAD)
              REPO_PINNED_SHA[$repo]="${sha}"
              echo "Pinned ${repo} to SHA ${sha} (resolved from ref '${ref}')."
            fi

            # Derive component_dir (for CLI build, CRD discovery) from
            # the containerfile path, and build_context (for podman build)
            # from the optional context field.  When context is omitted,
            # build_context defaults to component_dir (the containerfile's
            # parent directory), preserving pre-existing behavior.
            component_dir="${src}"
            build_context="${src}"
            containerfile_name="${file}"
            if [[ "${file}" == */* ]]; then
              component_dir="${src}/$(dirname "${file}")"
              containerfile_name="$(basename "${file}")"
            fi
            if [[ -n "${context}" ]]; then
              build_context="${src}/${context}"
            else
              build_context="${component_dir}"
            fi

            if [[ "${build_type}" == "ansible-builder" ]]; then
              pip3 install --quiet 'ansible-builder~=3.0'
              ansible-builder create --file "${component_dir}/${containerfile_name}" --context "${component_dir}/context"
              podman build -t "${tag}" -f "${component_dir}/context/Containerfile" "${component_dir}/context"
            else
              podman build -t "${tag}" -f "${component_dir}/${containerfile_name}" "${build_context}"
            fi

            echo "Loading ${tag} onto node ${NODE_NAME}..."
            podman save "${tag}" | oc debug "node/${NODE_NAME}" -t=false -- chroot /host podman load

            # Map imageKey to ansible extra-var name
            case "${image_key}" in
              service.images.service)      var_name="fulfillment_service_image" ;;
              operator.image.repository)   var_name="osac_operator_image" ;;
              aap.bootstrap.image)         var_name="osac_aap_image" ;;
              aap.configAsCode.eeImage)    var_name="osac_aap_ee_image" ;;
              bmf.image.repository)        var_name="osac_bmf_image" ;;
              *)
                echo "::error::components[$i].imageKey '${image_key}' is not a recognized override key"
                exit 1
                ;;
            esac

            IMAGE_OVERRIDES=$(echo "${IMAGE_OVERRIDES}" | jq -c --arg k "${var_name}" --arg v "${tag}" '. + {($k): $v}')
            echo "Built ${var_name}=${tag}"
            echo "::endgroup::"
          done

          echo "overrides=${IMAGE_OVERRIDES}" >> "$GITHUB_OUTPUT"

      - name: Deploy OSAC
        timeout-minutes: 90
        shell: bash
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
          COMPONENT_OVERRIDES: ${{ steps.components.outputs.overrides || '{}' }}
        run: |
          MERGED=$(echo "${EXTRA_VARS}" | jq -c ". + ${COMPONENT_OVERRIDES}")
          make deploy-osac INFRA=netris SUITE=caas EXTRA_VARS="${MERGED}"

      - name: Setup CaaS hosts and catalog
        shell: bash
        timeout-minutes: 30
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make setup-suite INFRA=netris SUITE=caas EXTRA_VARS="${EXTRA_VARS}"

      # Run before the baseline cluster below so its worker NodePools do not
      # consume the BMaaS agents needed by the OSAC lifecycle assertions.
      - name: Create test adapter route for metering tests
        id: metering-adapter
        env:
          KUBECONFIG: /root/.kube/config
          OSAC_NAMESPACE: osac-e2e-ci
        shell: bash
        run: |
          SVC_NAME=$(oc get svc -n "${OSAC_NAMESPACE}" \
            -l app.kubernetes.io/component=echo-adapter \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "${SVC_NAME}" ]; then
            echo "::error::No echo-adapter Service found in namespace ${OSAC_NAMESPACE}"
            exit 1
          fi
          if ! oc get route metering-test-adapter -n "${OSAC_NAMESPACE}" >/dev/null 2>&1; then
            oc expose "svc/${SVC_NAME}" -n "${OSAC_NAMESPACE}" --name=metering-test-adapter
          fi
          ROUTE_HOST=$(oc get route metering-test-adapter -n "${OSAC_NAMESPACE}" -o jsonpath='{.spec.host}')
          if [ -z "${ROUTE_HOST}" ]; then
            echo "::error::Metering test adapter route has no host"
            exit 1
          fi
          echo "url=http://${ROUTE_HOST}" >> "$GITHUB_OUTPUT"

      - name: Run OSAC CaaS fabric pytest cases
        id: osac-fabric-tests
        timeout-minutes: 600
        env:
          OSAC_REPO: ${{ inputs.osac-repo || 'https://github.com/osac-project/osac.git' }}
          OSAC_BRANCH: ${{ inputs.osac-branch || 'main' }}
          OSAC_TEST_MARKER: ${{ inputs.osac-test-marker }}
          KUBECONFIG: /root/.kube/config
          OSAC_NAMESPACE: osac-e2e-ci
          OSAC_PULL_SECRET_PATH: /root/pull-secret
          OSAC_SSH_PUBLIC_KEY_PATH: /root/.ssh/id_rsa.pub
          METERING_ADAPTER_URL: ${{ steps.metering-adapter.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          OSAC_SRC="$RUNNER_TEMP/osac-under-test"
          TEST_OUTPUT="$RUNNER_TEMP/osac-test-output"
          mkdir -p "$OSAC_SRC" "$TEST_OUTPUT" "$HOME/.local/bin"
          git -C "$OSAC_SRC" init
          git -C "$OSAC_SRC" remote add origin "$OSAC_REPO"
          git -C "$OSAC_SRC" fetch --depth 1 origin "$OSAC_BRANCH"
          git -C "$OSAC_SRC" checkout --detach FETCH_HEAD

          curl --retry 5 --retry-delay 2 -LsSf https://astral.sh/uv/install.sh \
            | env UV_INSTALL_DIR="$HOME/.local/bin" sh
          curl --retry 5 --retry-delay 2 -Lsf \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | tar xz --no-same-owner -C "$HOME/.local/bin" grpcurl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          cd "$OSAC_SRC"
          uv sync --all-groups --python 3.11

          # This helper derives fulfillment/Keycloak endpoints from the live
          # cluster and adds route hosts when lab wildcard DNS is unavailable.
          source tests/e2e/setup-env.sh
          if ! getent ahostsv4 "${METERING_ADAPTER_URL#http://}" >/dev/null 2>&1; then
            ROUTE_HOST="${METERING_ADAPTER_URL#http://}"
            CLUSTER_DOMAIN=$(oc get ingress.config.openshift.io cluster -o jsonpath='{.spec.domain}')
            INGRESS_IP=$(getent ahostsv4 "api.${CLUSTER_DOMAIN}" | awk 'NR==1 {print $1}')
            if [ -z "$INGRESS_IP" ]; then
              echo "::error::Cannot resolve metering route ${ROUTE_HOST} or ingress IP for api.${CLUSTER_DOMAIN}"
              exit 1
            fi
            echo "$INGRESS_IP $ROUTE_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi

          uv run pytest tests/e2e/caas/ -m "$OSAC_TEST_MARKER" -n 0 \
            --junitxml="$TEST_OUTPUT/junit.xml" \
            --log-file="$TEST_OUTPUT/e2e.log" -v

      - name: Deploy CaaS cluster
        id: deploy-caas
        timeout-minutes: 90
        shell: bash
        env:
          EXTRA_VARS: ${{ steps.extra-vars.outputs.json }}
        run: make -C infra/netris deploy-caas EXTRA_VARS="${EXTRA_VARS}"

      # Two separate steps, each independently best-effort (rather than one
      # script with both commands): GH Actions' default bash shell runs with
      # -e, so if the first command failed inside a single multi-line step,
      # the second would never even attempt to run despite
      # continue-on-error -- that only stops a step's failure from failing
      # the job, it doesn't help a step's own script recover mid-script.
      - name: Gather infra diagnostics
        if: always()
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: make gather-infra INFRA=netris

      - name: Gather management cluster diagnostics
        if: always()
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: make -C infra/netris gather-mgmt-cluster

      - name: Gather CaaS diagnostics
        if: always()
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: make gather-suite INFRA=netris SUITE=caas

      - name: Upload artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caas-netris-artifacts
          path: infra/netris/logs/
          if-no-files-found: ignore

      - name: Upload OSAC CaaS pytest results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caas-netris-osac-pytest-${{ github.run_id }}
          path: ${{ runner.temp }}/osac-test-output/
          if-no-files-found: ignore

      # Not part of the formal backend contract (infra/contract.md's target
      # list doesn't include it), so called directly
      # rather than through a root Makefile wrapper -- see this PR's
      # description for why a generic root-level wrapper would be
      # misleading for a netris-specific extra.
      - name: Cleanup DNS records
        if: always()
        shell: bash
        timeout-minutes: 5
        continue-on-error: true
        run: make -C infra/netris cleanup-dns

      - name: Gather EC2 runner artifacts
        if: always()
        uses: ./.github/actions/gather-ec2-runner-artifacts

  teardown:
    needs: [provision, push-secrets, e2e]
    if: always()
    uses: ./.github/workflows/ec2-runner-teardown.yml
    permissions:
      contents: read
    with:
      instance-id: ${{ needs.provision.outputs.instance-id }}
      runner-id: ${{ needs.provision.outputs.runner-id }}
      orchestrator-runner-label: ${{ inputs.orchestrator-runner-label }}
      aws-region: ${{ inputs.aws-region }}
      test-infra-repository: ${{ inputs.test-infra-repository }}
