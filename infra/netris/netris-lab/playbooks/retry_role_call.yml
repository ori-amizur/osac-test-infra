---
# Netris controller roles are state-based or read-only. Retrying the complete
# role is safe after a transient connection failure: each attempt re-reads the
# controller state before making any required change.
- name: Run Netris controller role attempt
  block:
    - name: Execute Netris controller role
      ansible.builtin.include_role:
        name: "{{ netris_retry_role_name }}"
  rescue:
    - name: Fail after the final Netris controller role attempt
      ansible.builtin.fail:
        msg: >-
          Netris controller role {{ netris_retry_role_name }} failed after
          {{ netris_retry_max_attempts | default(5) }} attempts.
      when: netris_retry_attempt | int >= netris_retry_max_attempts | default(5) | int

    - name: Pause before retrying the Netris controller role
      ansible.builtin.pause:
        seconds: 5
      when: netris_retry_attempt | int < netris_retry_max_attempts | default(5) | int

    - name: Retry Netris controller role
      ansible.builtin.include_tasks: "{{ netris_retry_role_call_path }}"
      vars:
        netris_retry_attempt: "{{ netris_retry_attempt | int + 1 }}"
