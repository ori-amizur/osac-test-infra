---
- name: Flush restrictive libvirt nftables chains
  shell: |
    nft flush chain ip filter LIBVIRT_FWI 2>/dev/null || true
    nft flush chain ip filter LIBVIRT_FWO 2>/dev/null || true
    nft flush chain ip filter LIBVIRT_FWX 2>/dev/null || true
    if nft list chain ip libvirt_network guest_input &>/dev/null; then
      nft flush chain ip libvirt_network guest_input
      nft flush chain ip libvirt_network guest_output
      nft add rule ip libvirt_network guest_input accept
      nft add rule ip libvirt_network guest_output accept
    fi
  changed_when: false

- name: Wait for mgmt-server VM to be reachable
  wait_for:
    host: 192.168.122.10
    port: 22
    timeout: 600
    sleep: 15

- name: Remove stale SSH host key for mgmt-server
  # After destroy/redeploy the mgmt-server VM gets a new host key; clear
  # known_hosts so the OpenVPN SSH check below does not fail with
  # "REMOTE HOST IDENTIFICATION HAS CHANGED".
  shell: ssh-keygen -R 192.168.122.10 2>/dev/null || true
  changed_when: false

- name: Wait for mgmt-server OpenVPN server
  block:
    - name: Poll mgmt-server OpenVPN service
      shell: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@192.168.122.10 "systemctl is-active openvpn@server"
      register: vpn_server_check
      until: vpn_server_check.stdout == "active"
      retries: 30
      delay: 10
      changed_when: false
  rescue:
    - name: Create management server diagnostic directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../logs/lab/openvpn"
        state: directory
        mode: "0755"

    - name: Capture management server startup diagnostics
      ansible.builtin.shell: |
        set -o pipefail
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@192.168.122.10 '
          set +e
          echo "=== cloud-init status ==="
          cloud-init status --long 2>&1 || true
          echo "=== cloud-init output, last 300 lines ==="
          tail -n 300 /var/log/cloud-init-output.log 2>&1 || true
          echo "=== relevant cloud-init log entries ==="
          grep -Ei "openvpn|runcmd|error|failed|warning|package" /var/log/cloud-init.log 2>/dev/null | tail -n 150 || true
          echo "=== OpenVPN service status ==="
          systemctl status openvpn@server --no-pager -l 2>&1 || true
          echo "=== OpenVPN boot journal ==="
          journalctl -b -u openvpn@server --no-pager -n 200 2>&1 || true
          echo "=== resolver configuration ==="
          cat /etc/resolv.conf 2>&1 || true
          echo "=== effective resolver state ==="
          resolvectl status 2>&1 || true
          echo "=== DNS query for Ubuntu package host ==="
          resolvectl query security.ubuntu.com 2>&1 || true
          echo "=== DNS query for OpenVPN file host ==="
          resolvectl query raw.githubusercontent.com 2>&1 || true
          echo "=== guest routes ==="
          ip route 2>&1 || true
          echo "=== raw.githubusercontent.com lookup ==="
          getent ahosts raw.githubusercontent.com 2>&1 || true
          echo "=== HTTPS check to OpenVPN file host ==="
          curl -sS -L --connect-timeout 5 --max-time 15 -o /dev/null -w "HTTP %{http_code}\\n" https://raw.githubusercontent.com/rawfilescloud/ovpn-config-examples/main/ca.crt 2>&1 || true
          echo "=== OpenVPN file metadata ==="
          for file in /etc/openvpn/server.conf /etc/openvpn/ca.crt /etc/openvpn/dh.pem /etc/openvpn/myservername.crt /etc/openvpn/myservername.key /etc/openvpn/ta.key; do
            stat -c "%n %s bytes mode=%a" "$file" 2>&1 || true
          done
          echo "=== server certificate metadata ==="
          openssl x509 -in /etc/openvpn/myservername.crt -noout -subject -issuer -dates 2>&1 || true
          echo "=== TUN device and interface ==="
          if [ -c /dev/net/tun ]; then ls -l /dev/net/tun; else echo "/dev/net/tun missing or not a character device"; fi
          ip -brief address show tun0 2>&1 || true
          echo "=== TCP/1194 listener ==="
          ss -lntp 2>&1 | grep "1194" || echo "no TCP/1194 listener"
        ' 2>&1 | python3 -c 'import sys; from capture_caas_worker_diagnostics import redact_text; sys.stdout.write(redact_text(sys.stdin.read()))' > {{ (playbook_dir ~ '/../logs/lab/openvpn/mgmt-server-startup.txt') | quote }}
      args:
        executable: /bin/bash
      environment:
        PYTHONPATH: "{{ playbook_dir }}/../scripts"
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail because mgmt-server OpenVPN did not become active
      ansible.builtin.fail:
        msg: >-
          mgmt-server OpenVPN did not become active after 30 checks. Guest diagnostics were
          saved to infra/netris/logs/lab/openvpn/mgmt-server-startup.txt and will be included
          in the CaaS Netris workflow artifacts.

- name: Fix OpenVPN server topology
  shell: |
    ssh -o StrictHostKeyChecking=no root@192.168.122.10 "
      if ! grep -q 'topology subnet' /etc/openvpn/server.conf; then
        sed -i '/^server /a topology subnet' /etc/openvpn/server.conf
        systemctl restart openvpn@server
      fi
    "
  changed_when: false

- name: Create RHEL openvpn client directory
  file:
    path: /etc/openvpn/client
    state: directory

- name: Copy VPN client config to RHEL path
  copy:
    src: "/etc/openvpn/{{ item }}"
    dest: "/etc/openvpn/client/{{ item }}"
    remote_src: true
  loop:
    - client.conf
    - ca.crt
    - ta.key
    - myclient1.crt
    - myclient1.key

- name: Fix VPN remote address
  lineinfile:
    path: /etc/openvpn/client/client.conf
    regexp: '^remote\s+'
    line: 'remote 192.168.122.10 1194'

- name: Set VPN client topology to subnet
  lineinfile:
    path: /etc/openvpn/client/client.conf
    regexp: '^topology\s+'
    line: 'topology subnet'
    insertafter: '^dev tun'

- name: Install VPN route fix script
  template:
    src: openvpn-route-fix.sh.j2
    dest: /usr/local/bin/openvpn-route-fix.sh
    mode: '0755'
    setype: bin_t

- name: Create systemd override directory
  file:
    path: /etc/systemd/system/openvpn-client@client.service.d
    state: directory
    mode: '0755'

- name: Create systemd override for VPN route fix
  copy:
    dest: /etc/systemd/system/openvpn-client@client.service.d/route-fix.conf
    content: |
      [Service]
      ExecStartPost=/usr/local/bin/openvpn-route-fix.sh
    mode: '0644'
  register: vpn_override

- name: Reload systemd
  when: vpn_override.changed
  systemd:
    daemon_reload: true

- name: Start OpenVPN client
  systemd:
    name: openvpn-client@client
    state: started
    enabled: true

- name: Wait for tun0 interface
  wait_for:
    path: /sys/class/net/tun0
    timeout: 30

- name: Verify VPN IP
  shell: ip addr show tun0 | grep "10.8.0.2"
  changed_when: false
