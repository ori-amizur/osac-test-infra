---
- name: Check K3s is installed
  command: k3s --version
  register: k3s_check
  changed_when: false
  failed_when: false

- name: Create K3s config directory
  file:
    path: /etc/rancher/k3s
    state: directory

- name: Write K3s resolv.conf
  copy:
    dest: /etc/rancher/k3s/resolv.conf
    content: |
      nameserver {{ dns_server | default('8.8.8.8') }}
    mode: "0644"

- name: Write K3s config
  copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      https-listen-port: {{ k3s_api_port }}
      resolv-conf: /etc/rancher/k3s/resolv.conf
      disable-network-policy: true

- name: Install K3s
  when: k3s_check.rc != 0
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      diagnostic_dir=/tmp/netris-k3s-installer
      mkdir -p "${diagnostic_dir}"
      attempt_id="$(date -u +%Y%m%dT%H%M%SZ)-$$"
      result_file="${diagnostic_dir}/${attempt_id}-curl-result.txt"
      curl --fail-with-body --silent --show-error --location \
        --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
        --connect-timeout 10 --max-time 180 \
        --dump-header "${diagnostic_dir}/${attempt_id}-response-headers.txt" \
        --output "${diagnostic_dir}/${attempt_id}-response-body.txt" \
        --write-out 'http_code=%{http_code}\nremote_ip=%{remote_ip}\nurl_effective=%{url_effective}\n' \
        https://get.k3s.io >"${result_file}" 2>&1 || {
          curl_rc=$?
          printf 'curl_exit_code=%s\n' "${curl_rc}" >>"${result_file}"
          cat "${result_file}" >&2
          exit "${curl_rc}"
        }
      cp "${diagnostic_dir}/${attempt_id}-response-body.txt" /tmp/install-k3s.sh
      INSTALL_K3S_VERSION={{ k3s_version }} sh /tmp/install-k3s.sh
    executable: /bin/bash
  register: k3s_install
  until: k3s_install.rc == 0
  retries: 5
  delay: 10

- name: Ensure K3s is running
  systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for K3s API
  wait_for:
    port: "{{ k3s_api_port }}"
    host: 127.0.0.1
    timeout: 60

- name: Wait for K3s node ready
  shell: kubectl get nodes --no-headers | grep -c " Ready"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_ready
  until: node_ready.stdout | int >= 1
  retries: 30
  delay: 5
  changed_when: false

- name: Check for cached container images
  stat:
    path: "{{ k3s_image_cache_dir }}"
  register: image_cache

- name: Import cached container images
  when: image_cache.stat.exists
  shell: |
    imported=0
    for imgdir in {{ k3s_image_cache_dir }}/*/; do
      [ -f "${imgdir}image-ref" ] || continue
      img_ref=$(cat "${imgdir}image-ref")
      if k3s ctr images check "name==${img_ref}" 2>/dev/null | grep -q "${img_ref}"; then
        continue
      fi
      tmptar=$(mktemp /tmp/k3s-import-XXXXXX.tar)
      if skopeo copy "dir:${imgdir}" "oci-archive:${tmptar}:${img_ref}" 2>/dev/null && \
         k3s ctr images import "${tmptar}" 2>/dev/null; then
        imported=$((imported + 1))
      fi
      rm -f "${tmptar}"
    done
    echo "Imported ${imported} images from cache"
  register: _image_import
  changed_when: "'Imported 0' not in _image_import.stdout"

- name: Deploy cert-manager manifest
  copy:
    src: cert-manager.yaml
    dest: /var/lib/rancher/k3s/server/manifests/cert-manager.yaml

- name: Check if netris-controller is already deployed
  shell: kubectl get helmchart netris-controller -n netris-controller -o name 2>/dev/null
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _nctl_exists
  changed_when: false
  until: _nctl_exists.rc == 0 or 'NotFound' in _nctl_exists.stderr
  retries: 5
  delay: 5
  failed_when: _nctl_exists.rc != 0 and 'NotFound' not in _nctl_exists.stderr

- name: Record controller Helm job before baseline install
  when: _nctl_exists.rc != 0
  shell: kubectl get job helm-install-netris-controller -n netris-controller -o jsonpath='{.metadata.uid}' 2>/dev/null
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _baseline_helm_job_before
  changed_when: false
  until: _baseline_helm_job_before.rc == 0 or 'NotFound' in _baseline_helm_job_before.stderr
  retries: 5
  delay: 5
  failed_when: _baseline_helm_job_before.rc != 0 and 'NotFound' not in _baseline_helm_job_before.stderr

- name: Deploy baseline netris-controller (no image overrides)
  when: _nctl_exists.rc != 0
  template:
    src: netris-controller-baseline.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/netris-controller.yaml
  register: _baseline_manifest

- name: Deploy traefik config
  copy:
    src: traefik-config.yaml
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml

- name: Wait for baseline controller Helm install to complete
  when:
    - _nctl_exists.rc != 0
    - _baseline_manifest.changed
  shell: |
    previous_uid="{{ _baseline_helm_job_before.stdout | trim }}"
    deadline=$(( $(date +%s) + 600 ))
    while [ "$(date +%s)" -lt "$deadline" ]; do
      current_uid=$(kubectl get job helm-install-netris-controller -n netris-controller -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
      if [ -n "$current_uid" ] && [ "$current_uid" != "$previous_uid" ]; then
        kubectl wait --for=condition=complete --timeout=600s job/helm-install-netris-controller -n netris-controller
        exit 0
      fi
      sleep 5
    done
    echo "Timed out waiting for the baseline Helm job to be recreated" >&2
    exit 1
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for baseline controller workloads to be ready
  when: _nctl_exists.rc != 0
  shell: |
    set -e
    for resource in deployment statefulset; do
      while read -r name; do
        [ -n "$name" ] || continue
        kubectl rollout status "$name" -n netris-controller --timeout=600s
      done < <(kubectl get "$resource" -n netris-controller -o name)
    done
    kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=netris-controller -n netris-controller --timeout=600s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Record controller Helm job before image upgrade
  shell: kubectl get job helm-install-netris-controller -n netris-controller -o jsonpath='{.metadata.uid}' 2>/dev/null
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _upgrade_helm_job_before
  changed_when: false
  until: _upgrade_helm_job_before.rc == 0 or 'NotFound' in _upgrade_helm_job_before.stderr
  retries: 5
  delay: 5
  failed_when: _upgrade_helm_job_before.rc != 0 and 'NotFound' not in _upgrade_helm_job_before.stderr

- name: Upgrade netris-controller with image overrides
  template:
    src: netris-controller.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/netris-controller.yaml
  register: _upgrade_manifest

- name: Wait for controller Helm upgrade to complete
  when: _upgrade_manifest.changed
  shell: |
    previous_uid="{{ _upgrade_helm_job_before.stdout | trim }}"
    deadline=$(( $(date +%s) + 600 ))
    while [ "$(date +%s)" -lt "$deadline" ]; do
      current_uid=$(kubectl get job helm-install-netris-controller -n netris-controller -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
      if [ -n "$current_uid" ] && [ "$current_uid" != "$previous_uid" ]; then
        kubectl wait --for=condition=complete --timeout=600s job/helm-install-netris-controller -n netris-controller
        exit 0
      fi
      sleep 5
    done
    echo "Timed out waiting for the controller Helm job to be recreated" >&2
    exit 1
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for controller workloads to be ready
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  shell: |
    set -e
    for resource in deployment statefulset; do
      while read -r name; do
        [ -n "$name" ] || continue
        kubectl rollout status "$name" -n netris-controller --timeout=600s
      done < <(kubectl get "$resource" -n netris-controller -o name)
    done
    kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=netris-controller -n netris-controller --timeout=600s
  changed_when: false

- name: Get traefik NodePort for web
  shell: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_nodeport
  until: traefik_nodeport.rc == 0 and (traefik_nodeport.stdout | length) > 0
  retries: 5
  delay: 5
  changed_when: false

- name: Set controller_nodeport fact
  set_fact:
    controller_nodeport: "{{ traefik_nodeport.stdout }}"

- name: Fix controller password
  include_tasks: password_fix.yml

- name: Create socat env directory
  file:
    path: /etc/netris-lab/socat
    state: directory

- name: Install socat-forwarder systemd template
  copy:
    dest: /etc/systemd/system/socat-forwarder@.service
    content: |
      [Unit]
      Description=Socat forwarder %i
      After=network-online.target k3s.service
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/socat TCP-LISTEN:${PORT},bind=${BIND_IP},fork,reuseaddr TCP:${TARGET_IP}:${TARGET_PORT}
      Restart=always
      RestartSec=5
      EnvironmentFile=/etc/netris-lab/socat/%i.env

      [Install]
      WantedBy=multi-user.target

- name: Create controller UI socat env file (port {{ controller_ui_port }} -> traefik NodePort)
  copy:
    dest: "/etc/netris-lab/socat/0.0.0.0-{{ controller_ui_port }}.env"
    content: |
      BIND_IP=0.0.0.0
      PORT={{ controller_ui_port }}
      TARGET_IP=127.0.0.1
      TARGET_PORT={{ traefik_nodeport.stdout }}

- name: Start controller UI socat forwarder
  systemd:
    name: "socat-forwarder@0.0.0.0-{{ controller_ui_port }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Verify controller API
  uri:
    url: "http://localhost:{{ controller_nodeport }}/api/auth"
    method: POST
    body_format: json
    body: '{"user":"{{ netris_login }}","password":"{{ netris_password }}"}'
    status_code: 200
    timeout: 60
  register: api_verify
  until: (api_verify.status | default(0)) == 200
  retries: 5
  delay: 10

- name: Check if license file exists
  stat:
    path: "{{ netris_license_file }}"
  register: license_file

- name: Apply license via collection
  when: license_file.stat.exists
  ansible.builtin.include_tasks: "{{ playbook_dir }}/retry_role_call.yml"
  vars:
    netris_retry_role_name: netris.controller.license
    netris_retry_role_vars:
      netris_controller_url: "http://localhost:{{ controller_nodeport }}"
      netris_username: "{{ netris_login }}"
      netris_validate_certs: false
      netris_timeout: 30
      license_state: present
      license_key_file: "{{ netris_license_file }}"
    netris_retry_attempt: 1
