---
# Fresh Netris 4.14.0 installs set mandatoryPasswordChange=true, which blocks
# /api/v2/* endpoints. Clear it by "changing" the password via /api/userdetails
# (even to the same value). Direct DB updates don't clear the flag.
#
# Uses raw URI for login (not netris.controller.auth) to avoid setting the
# global netris_session_cookie fact — that fact would cause downstream roles
# (connectivity, verify) to skip re-authentication and use a stale cookie.
# Do not send auth_scheme_id here: on 4.14.0, doing so can make the auth
# response report mandatoryPasswordChange=false even while the userdetails
# endpoint still requires the password-change operation.
- name: Login to controller
  ansible.builtin.uri:
    url: "http://localhost:{{ controller_nodeport }}/api/auth"
    method: POST
    body_format: json
    body:
      user: "{{ netris_login }}"
      password: "{{ netris_password }}"
    status_code: 200
    timeout: 30
  register: _pwd_fix_auth
  no_log: true

- name: Extract session cookie
  ansible.builtin.set_fact:
    _pwd_fix_cookie: "{{ _pwd_fix_auth.cookies['connect.sid'] }}"
  no_log: true

- name: Clear mandatory password change via userdetails API
  ansible.builtin.uri:
    url: "http://localhost:{{ controller_nodeport }}/api/userdetails"
    method: PUT
    body_format: json
    body:
      login: "{{ netris_login }}"
      name: "{{ _pwd_fix_auth.json.data.name | default('Netris') }}"
      email: "{{ _pwd_fix_auth.json.data.email | default('info@netris.local') }}"
      company: "Netris"
      password: "{{ netris_password }}"
      repassword: "{{ netris_password }}"
      oldPassword: "{{ netris_password }}"
    headers:
      Cookie: "connect.sid={{ _pwd_fix_cookie }}"
    status_code: 200
    timeout: 30
