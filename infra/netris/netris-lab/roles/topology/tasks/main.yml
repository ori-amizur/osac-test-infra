---
- name: Get traefik NodePort for controller access
  shell: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_nodeport
  changed_when: false

- name: Set controller_url fact
  set_fact:
    controller_url: "http://localhost:{{ traefik_nodeport.stdout }}"

- name: Create topology working directory
  file:
    path: "{{ topology_dir }}"
    state: directory

# Provider 3.6.23 introduced the inventory-profile AAA schema and removed the
# tenant field from allocation requests. The controller deployed here still
# requires that field, so the Terraform constraint below caps the provider at
# 3.6.22. Omit the AAA block for older provider schemas.
- name: Check for an existing OpenTofu provider lock
  stat:
    path: "{{ topology_dir }}/.terraform.lock.hcl"
  register: topology_provider_lock

- name: Read existing OpenTofu provider lock
  slurp:
    src: "{{ topology_dir }}/.terraform.lock.hcl"
  register: topology_provider_lock_contents
  when: topology_provider_lock.stat.exists

- name: Parse the locked Netris provider version
  set_fact:
    topology_netris_provider_version: >-
      {{
        topology_provider_lock_contents.content | b64decode
        | regex_findall('provider "[^"]*netrisai/netris" {[^}]*version *= *"([^"]+)"')
        | first
        | default('', true)
      }}
  when: topology_provider_lock.stat.exists

- name: Require the existing lock to identify the Netris provider
  assert:
    that:
      - topology_netris_provider_version | length > 0
    fail_msg: "Could not read the Netris provider version from {{ topology_dir }}/.terraform.lock.hcl"
  when: topology_provider_lock.stat.exists

- name: Determine whether the existing provider lock violates the constraint
  set_fact:
    topology_provider_lock_requires_refresh: >-
      {{
        topology_provider_lock.stat.exists
        and (
          (topology_netris_provider_version | default('0.0.0')) is version('3.6.3', '<')
          or
          (topology_netris_provider_version | default('0.0.0')) is version('3.6.23', '>=')
        )
      }}

- name: Determine whether the locked Netris provider supports AAA
  set_fact:
    netris_provider_aaa_supported: >-
      {{
        topology_provider_lock.stat.exists
        and not (topology_provider_lock_requires_refresh | bool)
        and ((topology_netris_provider_version | default('0.0.0')) is version('3.6.23', '>='))
      }}

- name: Copy static .tf files
  copy:
    src: "{{ item }}"
    dest: "{{ topology_dir }}/{{ item }}"
  loop:
    - bgp.tf
    - server-cluster-template.tf

- name: Render topology templates
  template:
    src: "{{ item }}.j2"
    dest: "{{ topology_dir }}/{{ item }}"
  loop:
    - east-west.tf
    - north-south.tf

- name: Render terraform.tf
  template:
    src: terraform.tf.j2
    dest: "{{ topology_dir }}/terraform.tf"

- name: Render terraform.tfvars
  template:
    src: terraform.tfvars.j2
    dest: "{{ topology_dir }}/terraform.tfvars"

- name: Render ipam-vars.tf
  template:
    src: ipam-vars.tf.j2
    dest: "{{ topology_dir }}/ipam-vars.tf"

- name: Refresh incompatible OpenTofu provider lock
  shell: tofu init -upgrade
  args:
    chdir: "{{ topology_dir }}"
  when: topology_provider_lock_requires_refresh | bool

- name: Initialize OpenTofu
  shell: tofu init
  args:
    chdir: "{{ topology_dir }}"
    creates: "{{ topology_dir }}/.terraform.lock.hcl"

# On a first run or after refreshing an incompatible lock, init selects the
# provider version. Re-check the lock and render the matching schema.
- name: Read provider lock created by OpenTofu initialization
  slurp:
    src: "{{ topology_dir }}/.terraform.lock.hcl"
  register: topology_initialized_provider_lock
  when:
    - not topology_provider_lock.stat.exists or topology_provider_lock_requires_refresh | bool

- name: Parse the initialized Netris provider version
  set_fact:
    topology_netris_provider_version: >-
      {{
        topology_initialized_provider_lock.content | b64decode
        | regex_findall('provider "[^"]*netrisai/netris" {[^}]*version *= *"([^"]+)"')
        | first
        | default('', true)
      }}
  when:
    - not topology_provider_lock.stat.exists or topology_provider_lock_requires_refresh | bool

- name: Require the initialized lock to identify the Netris provider
  assert:
    that:
      - topology_netris_provider_version | length > 0
    fail_msg: "Could not read the Netris provider version from {{ topology_dir }}/.terraform.lock.hcl"
  when:
    - not topology_provider_lock.stat.exists or topology_provider_lock_requires_refresh | bool

- name: Determine whether the initialized Netris provider supports AAA
  set_fact:
    netris_provider_aaa_supported: >-
      {{ topology_netris_provider_version is version('3.6.23', '>=') }}
  when:
    - not topology_provider_lock.stat.exists or topology_provider_lock_requires_refresh | bool

- name: Render topology templates with the selected provider schema
  template:
    src: "{{ item }}.j2"
    dest: "{{ topology_dir }}/{{ item }}"
  loop:
    - east-west.tf
    - north-south.tf
  when: not topology_provider_lock.stat.exists or topology_provider_lock_requires_refresh | bool

# The softgate and fabric-link resources have no explicit depends_on and
# can be created concurrently under default parallelism, occasionally
# causing "Softgate does not have link to the fabric" (Netris API 400).
# `tofu apply` is idempotent, so retrying re-applies against the
# partially-created state rather than starting over.
- name: Apply topology
  shell: tofu apply -auto-approve
  args:
    chdir: "{{ topology_dir }}"
  register: tofu_apply
  until: tofu_apply.rc == 0
  retries: 3
  delay: 10
  changed_when: "'0 added, 0 changed' not in tofu_apply.stdout"
