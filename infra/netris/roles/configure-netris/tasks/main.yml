---
- name: Read Netris lab connectivity values for route validation
  ansible.builtin.set_fact:
    _netris_lab_connectivity_mode: >-
      {{ (lookup('ansible.builtin.file', netris_lab_dir ~ '/group_vars/all.yml')
          | from_yaml).connectivity_mode }}
    _netris_lab_bgp_link_subnet: >-
      {{ (lookup('ansible.builtin.file', netris_lab_dir ~ '/group_vars/all.yml')
          | from_yaml).bgp_link_subnet }}
    _netris_lab_public_bridge_name: >-
      {{ (lookup('ansible.builtin.file', netris_lab_dir ~ '/group_vars/all.yml')
          | from_yaml).public_bridge_name }}

- name: Validate OCP node subnet and gateway configuration
  ansible.builtin.include_tasks: validate-ocp-network-inputs.yml

- name: Discover Netris controller URL
  ansible.builtin.shell:
    cmd: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _traefik_nodeport
  changed_when: false
  until: _traefik_nodeport.rc == 0 and _traefik_nodeport.stdout | length > 0
  retries: 10
  delay: 15

- name: Set controller URL
  ansible.builtin.set_fact:
    netris_controller_url: "http://localhost:{{ _traefik_nodeport.stdout }}"

- name: Authenticate to Netris controller
  ansible.builtin.include_role:
    name: netris.controller.auth

- name: Validate the configured OCP DNAT frontend IP
  ansible.builtin.include_tasks: validate-ocp-dnat-ip.yml

- name: Read the host route to the OCP DNAT frontend
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - route
      - get
      - "{{ ocp_dnat_ip }}"
  register: _ocp_dnat_host_route
  changed_when: false

- name: Require the isolated lab route to use the Netris ISP path
  ansible.builtin.assert:
    that:
      - >-
        ('via ' ~ (_netris_lab_bgp_link_subnet
                    | ansible.utils.ipaddr('network')
                    | ansible.utils.ipmath(2))) in _ocp_dnat_host_route.stdout
      - "('dev ' ~ _netris_lab_public_bridge_name) in _ocp_dnat_host_route.stdout"
    fail_msg: >-
      Host route to OCP DNAT frontend {{ ocp_dnat_ip }} does not use the
      isolated Netris ISP next hop and public bridge:
      {{ _ocp_dnat_host_route.stdout | trim }}.
  when: _netris_lab_connectivity_mode == 'isolated'

# Point the Default DHCP option set at the lab's configurable DNS server. This
# option set is what every V-Net DHCP hands out (the OCP mgmt-cluster V-Net and
# the BMaaS provisioning V-Net included); Netris ships it with public resolvers
# (1.1.1.1/8.8.8.8), which are unreachable on labs that only allow an internal
# resolver — leaving DHCP clients (e.g. the metal3 IPA) unable to resolve quay.io.
- name: Get DHCP option sets
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/dhcp-option-set"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    status_code: 200
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _dhcp_option_sets

- name: Find default DHCP option set
  ansible.builtin.set_fact:
    _default_dhcp_option_set: >-
      {{ (_dhcp_option_sets.json.data | default([]))
         | selectattr('isDefault', 'equalto', true) | list | first | default({}) }}

- name: Set lab DNS server on the default DHCP option set
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/dhcp-option-set/{{ _default_dhcp_option_set.id }}"
    method: PUT
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ _default_dhcp_option_set.name }}"
      dnsServers: ["{{ dns_server }}"]
    status_code: [200]
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  when: _default_dhcp_option_set.id is defined

- name: Create VPC for OCP
  ansible.builtin.include_role:
    name: netris.controller.vpc
  vars:
    vpc_name: "{{ ocp_vpc_name }}"
    vpc_state: present
    vpc_tenant_id: 1

- name: Create IPAM allocation for OCP
  ansible.builtin.include_role:
    name: netris.controller.ipam
  vars:
    ipam_state: create_allocation
    ipam_name: "{{ ocp_vpc_name }}-allocation"
    ipam_cidr: "{{ ocp_subnet_cidr }}"
    ipam_tenant_id: 1
    ipam_vpc_id: "{{ vpc_id }}"

- name: Create IPAM subnet for OCP
  ansible.builtin.include_role:
    name: netris.controller.ipam
  vars:
    ipam_state: create_subnet
    ipam_name: "{{ ocp_vpc_name }}-subnet"
    ipam_cidr: "{{ ocp_subnet_cidr }}"
    ipam_purpose: common
    ipam_site_id: 1
    ipam_tenant_id: 1
    ipam_vpc_id: "{{ vpc_id }}"

- name: Create VNet for OCP server
  ansible.builtin.include_role:
    name: netris.controller.vnet
  vars:
    vnet_name: "{{ ocp_vnet_name }}"
    vnet_state: present
    vnet_vpc_id: "{{ vpc_id }}"
    vnet_site_id: 1
    vnet_tenant_id: 1
    vnet_gateway: "{{ ocp_gateway }}"
    vnet_dhcp_enabled: false
    vnet_ports: "{{ ocp_server_ports }}"

- name: Ensure OCP VNet ports match inventory
  ansible.builtin.include_tasks: ensure-ocp-vnet-ports.yml

- name: Create SNAT rule for OCP VNet
  ansible.builtin.include_role:
    name: netris.controller.nat
  vars:
    nat_name: "{{ ocp_vpc_name }}-snat"
    nat_state: present
    nat_action: snat
    nat_site_id: 1
    nat_vpc_id: "{{ vpc_id }}"
    nat_source_address: "{{ ocp_subnet_cidr }}"
    nat_snat_to_ip: "{{ ocp_snat_ip }}"

# Covers both API and Ingress traffic
- name: Create DNAT rule for OCP
  ansible.builtin.include_role:
    name: netris.controller.nat
  vars:
    nat_name: "{{ ocp_vpc_name }}-dnat"
    nat_state: present
    nat_action: dnat
    nat_protocol: all
    nat_site_id: 1
    nat_vpc_id: "{{ vpc_id }}"
    nat_destination_address: "{{ ocp_dnat_ip }}/32"
    nat_dnat_to_ip: "{{ ocp_node_ip }}"

- name: Verify Netris OCP subnet, VNet, and DNAT configuration
  ansible.builtin.include_tasks: verify-ocp-netris-resources.yml

- name: Create ACL permit rule for mgmt cluster
  ansible.builtin.include_role:
    name: netris.controller.acl
    tasks_from: create
  vars:
    acl_name: "{{ ocp_vpc_name }}-permit-all"
    acl_action: permit
    acl_proto: all
    acl_vpc_id: "{{ vpc_id }}"
    acl_src_prefix: "{{ ocp_subnet_cidr }}"
    acl_dst_prefix: "0.0.0.0/0"
    acl_reverse: "yes"
    acl_comment: "Allow all traffic from mgmt cluster subnet"

- name: Check if NS-only server cluster template exists
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster-template"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    validate_certs: false
  register: _sct_list
  no_log: true

- name: Create NS-only server cluster template for CaaS
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster-template"
    method: POST
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ caas_server_cluster_template_name }}"
      vnets:
        - postfix: "North-South"
          type: "l2vpn"
          vlan: "untagged"
          vlanID: "auto"
          serverNics: ["eth9"]
          ipv4Gateway: "{{ caas_server_cluster_template_gateway }}"
    validate_certs: false
    status_code: [200, 201]
  no_log: true
  when: _sct_list.json.data | selectattr('name', 'equalto', caas_server_cluster_template_name) | list | length == 0

- name: Report Netris networking configuration
  ansible.builtin.debug:
    msg: "Netris configured: VPC={{ ocp_vpc_name }}, VNet={{ ocp_vnet_name }}, Subnet={{ ocp_subnet_cidr }}, DNAT={{ ocp_dnat_ip }} → {{ ocp_node_ip }}"
