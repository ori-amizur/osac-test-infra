---
- name: Configure CaaS CLI with explicit workload tenant
  ansible.builtin.import_role:
    name: caas-client

- name: Ensure CaaS workload tenant exists and is ready
  ansible.builtin.import_tasks: ensure-tenant.yml

- name: Look up existing CaaS cluster in the workload tenant
  ansible.builtin.import_role:
    name: caas-client
    tasks_from: find-cluster.yml

- name: Validate CaaS worker node set
  ansible.builtin.assert:
    that:
      - caas_cluster_node_set_name | default('') | length > 0
      - caas_cluster_node_set_size | int > 0
      - caas_cluster_baremetal_instance_type | default('') | length > 0
    fail_msg: >-
      CaaS cluster creation requires a positive worker node count and a shared
      BareMetalInstanceType name. The instance type must also have a matching
      NETRIS_RESOURCE_CLASS_MAP entry.

- name: Build CaaS worker node-set argument
  ansible.builtin.set_fact:
    _caas_worker_node_set_arg: >-
      name={{ caas_cluster_node_set_name }},size={{ caas_cluster_node_set_size }},
      baremetal-instance-type={{ caas_cluster_baremetal_instance_type }}

# Template -f parameters preserve the file's trailing newline. Assisted Service
# interprets that newline as an empty SSH key when registering the worker InfraEnv.
# Keep the legacy template parameter and the explicit worker field identical.
- name: Read CaaS SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_public_key_path }}"
  register: _caas_ssh_public_key_file
  when:
    - _caas_existing_cluster_id | length == 0
    - (caas_cluster_params | default([]) | length) == 0

- name: Normalize CaaS SSH public key
  ansible.builtin.set_fact:
    _caas_ssh_public_key: "{{ _caas_ssh_public_key_file.content | b64decode | trim }}"
  when:
    - _caas_existing_cluster_id | length == 0
    - (caas_cluster_params | default([]) | length) == 0

- name: Require a non-empty CaaS SSH public key
  ansible.builtin.assert:
    that:
      - _caas_ssh_public_key | length > 0
    fail_msg: "SSH public key file '{{ ssh_public_key_path }}' is empty after trimming whitespace."
  when:
    - _caas_existing_cluster_id | length == 0
    - (caas_cluster_params | default([]) | length) == 0

# Default CaaS path: pull secret from a file, normalized SSH key in both fields.
# MaaS uses explicit credential file flags, whose SSH reader already trims whitespace.
- name: Create cluster (CaaS template field params)
  ansible.builtin.command:
    # This option was added in ansible-core 2.16; older CI runners reject it.
    expand_argument_vars: "{{ false if ansible_version.full is version('2.16', '>=') else omit }}"
    argv:
      - osac
      - --config
      - "{{ caas_cli_config_dir }}"
      - create
      - cluster
      - --template
      - "{{ caas_cluster_template }}"
      - --version
      - "{{ caas_cluster_version }}"
      - -f
      - "pull_secret={{ pull_secret_path }}"
      - -p
      - "ssh_public_key={{ _caas_ssh_public_key }}"
      - --ssh-public-key
      - "{{ _caas_ssh_public_key }}"
      - --name
      - "{{ caas_cluster_name }}"
      - --node-set
      - "{{ _caas_worker_node_set_arg }}"
  environment:
    KUBECONFIG: /root/.kube/config
  register: _cluster_create_fields
  when:
    - _caas_existing_cluster_id | length == 0
    - (caas_cluster_params | default([]) | length) == 0
  changed_when: true

- name: Create cluster (explicit -p params)
  ansible.builtin.shell: |
    set -euo pipefail
    args=(
      osac --config {{ caas_cli_config_dir | quote }} create cluster
      --template "{{ caas_cluster_template }}"
      --pull-secret-file "{{ pull_secret_path }}"
      --ssh-public-key-file "{{ ssh_public_key_path }}"
      --name "{{ caas_cluster_name }}"
    )
    args+=(--node-set {{ _caas_worker_node_set_arg | quote }})
    {% for p in caas_cluster_params | default([]) %}
    args+=(-p {{ p | quote }})
    {% endfor %}
    printf '+';
    printf ' %q' "${args[@]}"
    printf '\n'
    "${args[@]}"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  register: _cluster_create_params
  when:
    - _caas_existing_cluster_id | length == 0
    - (caas_cluster_params | default([]) | length) > 0
  changed_when: true

- name: Select create result
  ansible.builtin.set_fact:
    _cluster_create: "{{ _cluster_create_params if (caas_cluster_params | default([]) | length) > 0 else _cluster_create_fields }}"
  when: _caas_existing_cluster_id | length == 0

- name: Extract cluster ID
  ansible.builtin.set_fact:
    caas_cluster_id: "{{ _caas_existing_cluster_id if _caas_existing_cluster_id | length > 0 else (_cluster_create.stdout | regex_search('[0-9a-f-]{36}')) }}"

- name: Require a cluster ID before checking ownership
  ansible.builtin.assert:
    that:
      - caas_cluster_id is string
      - caas_cluster_id | length > 0
    fail_msg: "The CaaS cluster command did not return a cluster ID."

- name: Read CaaS cluster ownership from the API
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      osac --config {{ caas_cli_config_dir | quote }} get clusters {{ caas_cluster_id | quote }} -o json \
        | python3 -c '
      import json, sys
      cluster = json.load(sys.stdin)
      metadata = cluster.get("metadata", {})
      print(json.dumps({"id": cluster.get("id"), "name": metadata.get("name"), "tenant": metadata.get("tenant")}))
      '
    executable: /bin/bash
  environment:
    KUBECONFIG: /root/.kube/config
  register: _caas_cluster_ownership
  changed_when: false

- name: Verify CaaS cluster belongs to the workload tenant
  ansible.builtin.assert:
    that:
      - _caas_owner.id == caas_cluster_id
      - _caas_owner.name == caas_cluster_name
      - _caas_owner.tenant == caas_cluster_tenant
    fail_msg: >-
      Cluster '{{ caas_cluster_name }}' ({{ caas_cluster_id }}) has unexpected ownership:
      {{ _caas_owner }}. Expected tenant '{{ caas_cluster_tenant }}'.
      Worker BMIs inherit the cluster tenant; stop before waiting for provisioning.
  vars:
    _caas_owner: "{{ _caas_cluster_ownership.stdout | from_json }}"

- name: Report cluster creation started
  ansible.builtin.debug:
    msg: >-
      Cluster '{{ caas_cluster_name }}' {{ 'already exists' if _caas_existing_cluster_id | length > 0 else 'created' }}
      with ID {{ caas_cluster_id }} in tenant '{{ caas_cluster_tenant }}'.

# The HyperShift operator creates the hosted control plane namespace with
# PodSecurity enforce=restricted, which blocks ALL CP pods (etcd, apiserver,
# capi-provider). We must relabel it to privileged before they can start.
- name: Wait for hosted control plane namespace to appear
  ansible.builtin.shell:
    cmd: >-
      oc get ns -l hypershift.openshift.io/hosted-control-plane=true --no-headers 2>/dev/null
      | grep '{{ snapshot_osac_namespace | default(osac_namespace) }}'
      | awk '{print $1}'
      | grep -v '^$'
      | head -1
  environment:
    KUBECONFIG: /root/.kube/config
  register: _cp_namespace
  until: _cp_namespace.stdout | length > 0
  retries: 30
  delay: 10
  changed_when: false

- name: Label hosted control plane namespace with privileged PodSecurity
  ansible.builtin.command:
    cmd: >-
      oc label ns {{ _cp_namespace.stdout }}
      pod-security.kubernetes.io/enforce=privileged
      pod-security.kubernetes.io/audit=privileged
      pod-security.kubernetes.io/warn=privileged
      --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  register: _cp_namespace_label
  until: _cp_namespace_label.rc == 0
  retries: 10
  delay: 15
  changed_when: true

- name: Also label the HostedCluster namespace with privileged PodSecurity
  ansible.builtin.shell:
    cmd: >-
      HC_NS=$(oc get hostedcluster -A --no-headers 2>/dev/null
      | grep '{{ snapshot_osac_namespace | default(osac_namespace) }}'
      | awk '{print $1}'
      | head -1);
      [ -n "$HC_NS" ] && oc label ns "$HC_NS"
      pod-security.kubernetes.io/enforce=privileged
      --overwrite 2>/dev/null || true
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Configure CaaS worker hosted API access
  ansible.builtin.include_tasks: configure-hosted-api-access.yml
  when:
    - caas_hosted_api_proxy_enabled | default(true) | bool
    - caas_use_order_infraenv_for_worker_boot | default(true) | bool

- name: Require a ready CaaS cluster
  block:
    - name: Wait for cluster to reach READY or FAILED
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          osac --config {{ caas_cli_config_dir | quote }} get clusters {{ caas_cluster_id | quote }} -o json \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',{}).get('state',''))"
        executable: /bin/bash
      environment:
        KUBECONFIG: /root/.kube/config
      register: _cluster_state
      until:
        - _cluster_state.rc == 0
        - _cluster_state.stdout in ['CLUSTER_STATE_READY', 'CLUSTER_STATE_FAILED']
      retries: 120
      delay: 30
      changed_when: false

    - name: Verify cluster is ready
      ansible.builtin.assert:
        that:
          - _cluster_state.stdout == 'CLUSTER_STATE_READY'
        fail_msg: "CaaS cluster entered FAILED state."
  rescue:
    - name: Fail deployment when cluster readiness was not reached
      ansible.builtin.fail:
        msg: >-
          CaaS cluster '{{ caas_cluster_name }}' ({{ caas_cluster_id }}) did not
          become READY. Last state: {{ _cluster_state.stdout | default('unknown', true) }};
          query exit code: {{ _cluster_state.rc | default('unknown') }}.
          See the OSAC artifacts for ClusterOrder conditions, operator logs and AAP job output.

- name: Report final cluster state
  ansible.builtin.debug:
    msg: >-
      CaaS cluster '{{ caas_cluster_name }}' ({{ caas_cluster_id }}) is
      {{ _cluster_state.stdout }}.
