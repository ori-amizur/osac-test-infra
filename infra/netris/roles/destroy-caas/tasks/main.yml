---
# Delete the named CaaS/MaaS cluster via osac CLI, then tear down legacy shared
# discovery resources where applicable and clean up the worker VM disks.
#
# Use the same saved tenant as deploy-caas; do not create a tenant during teardown.
- name: Configure CaaS CLI with explicit workload tenant
  ansible.builtin.import_role:
    name: caas-client

- name: Look up CaaS cluster in the workload tenant
  ansible.builtin.import_role:
    name: caas-client
    tasks_from: find-cluster.yml

- name: Report when named cluster is already absent
  ansible.builtin.debug:
    msg: "No osac cluster named '{{ caas_cluster_name }}' in tenant '{{ caas_cluster_tenant }}' — skip osac delete"
  when: _caas_existing_cluster_id | length == 0

- name: Delete cluster via osac CLI
  ansible.builtin.command:
    argv: [osac, --config, "{{ caas_cli_config_dir }}", delete, cluster, "{{ _caas_existing_cluster_id }}"]
  environment:
    KUBECONFIG: /root/.kube/config
  register: _osac_delete
  when: _caas_existing_cluster_id | length > 0
  changed_when: _osac_delete.rc == 0
  failed_when: false

- name: Warn if osac delete failed
  ansible.builtin.debug:
    msg: >-
      osac delete cluster {{ _caas_existing_cluster_id }} in tenant '{{ caas_cluster_tenant }}' failed
      (rc={{ _osac_delete.rc }}): {{ _osac_delete.stderr | default(_osac_delete.stdout) | trim }}
  when:
    - _osac_delete is not skipped
    - _osac_delete.rc | default(0) != 0

# Steps 2–4 apply only to MaaS's manually-created shared discovery resources.
# In CaaS, deleting the ClusterOrder lets OSAC clean up its order-scoped Agents
# and InfraEnv. Never delete every Agent from the shared workload tenant here.
- name: Clean up legacy shared discovery resources
  when: not (caas_use_order_infraenv_for_worker_boot | default(true) | bool)
  block:
    - name: Get shared discovery Agent names
      ansible.builtin.shell:
        cmd: oc get agent -n {{ caas_agent_namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true
      environment:
        KUBECONFIG: /root/.kube/config
      register: _agents
      changed_when: false
      failed_when: false

    - name: Remove finalizers from shared discovery Agents
      ansible.builtin.command:
        cmd: >-
          oc patch agent/{{ item }} -n {{ caas_agent_namespace }}
          --type=merge -p '{"metadata":{"finalizers":null}}'
      environment:
        KUBECONFIG: /root/.kube/config
      loop: "{{ _agents.stdout.split() }}"
      when: _agents.stdout | length > 0
      failed_when: false
      changed_when: true

    - name: Delete shared discovery Agents
      ansible.builtin.command:
        cmd: oc delete agent --all -n {{ caas_agent_namespace }} --wait=false
      environment:
        KUBECONFIG: /root/.kube/config
      failed_when: false
      changed_when: true

    - name: Remove finalizers from shared discovery InfraEnv
      ansible.builtin.command:
        cmd: >-
          oc patch infraenv/{{ caas_discovery_infraenv_name }} -n {{ caas_discovery_infraenv_namespace }}
          --type=merge -p '{"metadata":{"finalizers":null}}'
      environment:
        KUBECONFIG: /root/.kube/config
      failed_when: false
      changed_when: true

    - name: Delete shared discovery InfraEnv
      ansible.builtin.command:
        cmd: oc delete infraenv {{ caas_discovery_infraenv_name }} -n {{ caas_discovery_infraenv_namespace }} --wait=false
      environment:
        KUBECONFIG: /root/.kube/config
      failed_when: false
      changed_when: true

    - name: Delete shared discovery InfraEnv namespace
      ansible.builtin.command:
        cmd: oc delete namespace {{ caas_discovery_infraenv_namespace }} --wait=false
      environment:
        KUBECONFIG: /root/.kube/config
      failed_when: false
      changed_when: true

# Step 5: Shut down worker VMs and clean up disks
- name: Find worker VMs
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ item }}" || true
  register: _discovery_vm_lookup
  changed_when: false
  failed_when: false
  loop: "{{ caas_discovery_vm_patterns }}"

- name: Build VM name list
  ansible.builtin.set_fact:
    caas_discovery_vms: "{{ _discovery_vm_lookup.results | selectattr('stdout', 'ne', '') | map(attribute='stdout_lines') | map('first') | list }}"

- name: Shut down running VMs
  ansible.builtin.command:
    cmd: virsh destroy {{ item }}
  loop: "{{ caas_discovery_vms }}"
  failed_when: false
  changed_when: true

- name: Remove discovery VM disks
  ansible.builtin.file:
    path: /var/lib/libvirt/images/{{ item }}-disk.qcow2
    state: absent
  loop: "{{ caas_discovery_vms }}"

- name: Remove discovery ISO
  ansible.builtin.file:
    path: /var/lib/libvirt/images/caas-discovery.iso
    state: absent
