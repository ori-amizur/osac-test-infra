---
- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_public_key_path }}"
  register: _ssh_pub_key

- name: Read pull secret
  ansible.builtin.slurp:
    src: "{{ pull_secret_path }}"
  register: _pull_secret
  no_log: true

- name: Regenerate assisted-service auth keypair
  ansible.builtin.shell:
    cmd: |
      oc delete secret assisted-servicelocal-auth -n multicluster-engine --ignore-not-found
      for i in $(seq 30); do
        oc get secret assisted-servicelocal-auth -n multicluster-engine --no-headers 2>/dev/null && break
        sleep 2
      done
      sleep 10
      oc rollout restart deployment/assisted-service -n multicluster-engine
      oc rollout status deployment/assisted-service -n multicluster-engine --timeout=300s
      oc rollout restart statefulset/assisted-image-service -n multicluster-engine
      # assisted-image-service re-caches the RHCOS base images on startup and
      # serves 503 on /health until they are ready, which can take several
      # minutes after a restart -- 120s was too short and failed intermittently.
      oc rollout status statefulset/assisted-image-service -n multicluster-engine --timeout=600s
  environment:
    KUBECONFIG: /root/.kube/config

- name: Create InfraEnv namespace
  ansible.builtin.command:
    cmd: oc create namespace {{ caas_discovery_infraenv_namespace }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: _ns_create
  failed_when: false
  changed_when: _ns_create.rc == 0

- name: Ensure pull-secret exists in InfraEnv namespace
  ansible.builtin.shell:
    cmd: >
      oc get secret pull-secret -n {{ caas_discovery_infraenv_namespace }} ||
      oc create secret generic pull-secret -n {{ caas_discovery_infraenv_namespace }}
      --from-literal=.dockerconfigjson='{{ _pull_secret.content | b64decode | trim }}'
      --type=kubernetes.io/dockerconfigjson
  environment:
    KUBECONFIG: /root/.kube/config
  no_log: true
  register: _pull_secret_result
  changed_when: "'created' in _pull_secret_result.stdout"
  until: _pull_secret_result.rc == 0
  retries: 10
  delay: 15

- name: Create InfraEnv CR
  ansible.builtin.template:
    src: infraenv.yml.j2
    dest: /tmp/caas-infraenv.yml
    mode: "0600"

- name: Delete existing InfraEnv to regenerate ISO token
  ansible.builtin.command:
    cmd: oc delete infraenv {{ caas_discovery_infraenv_name }} -n {{ caas_discovery_infraenv_namespace }} --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Apply InfraEnv CR
  ansible.builtin.command:
    cmd: oc apply -f /tmp/caas-infraenv.yml
  environment:
    KUBECONFIG: /root/.kube/config
  register: _infraenv_apply
  changed_when: "'created' in _infraenv_apply.stdout or 'configured' in _infraenv_apply.stdout"
  until: _infraenv_apply.rc == 0
  retries: 10
  delay: 15

- name: Wait for discovery ISO URL
  ansible.builtin.shell:
    cmd: oc get infraenv {{ caas_discovery_infraenv_name }} -n {{ caas_discovery_infraenv_namespace }} -o jsonpath='{.status.isoDownloadURL}'
  register: _iso_url
  until: _iso_url.stdout | length > 0
  retries: 60
  delay: 10
  changed_when: false

- name: Download discovery ISO
  ansible.builtin.get_url:
    url: "{{ _iso_url.stdout }}"
    dest: /var/lib/libvirt/images/caas-discovery.iso
    mode: "0644"
    validate_certs: false
  register: _iso_download
  until: _iso_download is success
  retries: 30
  delay: 10

- name: Prepare CaaS worker VMs for provisioning
  ansible.builtin.include_tasks: prepare-worker-vms.yml

- name: Check if discovery ISO is attached
  ansible.builtin.shell:
    cmd: virsh domblklist {{ item }} | grep -q 'caas-discovery.iso'
  register: _iso_attached
  failed_when: false
  changed_when: false
  loop: "{{ caas_discovery_vms }}"

- name: Attach discovery ISO as cdrom
  ansible.builtin.command:
    cmd: virsh attach-disk {{ item.item }} /var/lib/libvirt/images/caas-discovery.iso sda --type cdrom --config
  when: item.rc != 0
  loop: "{{ _iso_attached.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Set boot order (per-VM override, default disk then cdrom)
  ansible.builtin.command:
    cmd: virt-xml {{ item }} --edit --boot {{ caas_discovery_vm_overrides[item].boot_order | default('hd,cdrom') }}
  loop: "{{ caas_discovery_vms }}"
  register: _boot_order
  changed_when: "'--boot' not in _boot_order.stderr | default('')"

# Per-VM discovery experiments (caas_discovery_vm_overrides). No-op unless set.
# Detach requested NICs before boot so each VM can run a different network
# config in the same run; diagnostics then show which config registers.
- name: Apply per-VM discovery experiment — detach networks
  ansible.builtin.shell:
    cmd: |
      set -e
      VM="{{ item.0.key }}"
      NET="{{ item.1 }}"
      MAC=$(virsh domiflist "$VM" | awk -v n="$NET" '$3 == n {print $5; exit}')
      if [ -n "$MAC" ]; then
        virsh detach-interface "$VM" network --mac "$MAC" --config
        echo "experiment: detached ${NET} (${MAC}) from ${VM}"
      else
        echo "experiment: no ${NET} NIC on ${VM}; nothing to detach"
      fi
    executable: /bin/bash
  loop: "{{ caas_discovery_vm_overrides | default({}) | dict2items | subelements('value.detach_networks', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.key }} detach {{ item.1 }}"
  register: _discovery_experiment_detach
  changed_when: "'detached' in _discovery_experiment_detach.stdout | default('')"

- name: Report applied discovery experiments
  ansible.builtin.debug:
    msg: "{{ _discovery_experiment_detach.results | map(attribute='stdout') | select('string') | list }}"
  when: caas_discovery_vm_overrides | default({}) | length > 0

- name: Detach the BMaaS lifecycle NIC before the Assisted boot
  ansible.builtin.include_tasks: detach-bmc-net.yml

- name: Start discovery VMs
  ansible.builtin.command:
    cmd: virsh start {{ item }}
  loop: "{{ caas_discovery_vms }}"
  register: _vm_start
  failed_when: _vm_start.rc != 0 and 'already active' not in _vm_start.stderr
  changed_when: _vm_start.rc == 0

- name: Report CaaS discovery hosts started
  ansible.builtin.debug:
    msg: >-
      CaaS discovery: {{ caas_discovery_vms | length }} VMs booted with discovery ISO
      ({{ caas_discovery_vcpu }} vCPU, {{ caas_discovery_memory_mb }}MB RAM,
      {{ caas_discovery_disk_gb }}GB disk; default boot order disk,cdrom,
      per-VM overrides: {{ caas_discovery_vm_overrides | default({}) }})

# Capture each VM's serial console for the first ~150s of boot. The agent gets
# stuck fetching the rootfs in the initramfs stage (no ssh / guest-agent), so
# this early window is the only place the dracut network setup -- which NICs
# come up, DHCP results, the default route, DNS -- is visible. Written to a
# directory the archive step uploads. Best-effort; never fails the play.
- name: Create discovery early-boot log directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../logs/caas-discovery-boot"
    state: directory
    mode: "0755"
  failed_when: false

- name: Capture discovery VM early-boot serial console
  ansible.builtin.shell:
    cmd: |
      set +e
      VM="{{ item }}"
      OUT="{{ playbook_dir }}/../logs/caas-discovery-boot/vm-${VM}-earlyboot.txt"
      if command -v script >/dev/null 2>&1; then
        timeout 155s script -q -c "timeout --signal=INT 150s virsh console --force --safe '$VM'" /dev/null > "$OUT" 2>&1
      else
        echo "util-linux script unavailable; cannot capture serial console" > "$OUT"
      fi
      exit 0
    executable: /bin/bash
  loop: "{{ caas_discovery_vms }}"
  changed_when: false
  failed_when: false
