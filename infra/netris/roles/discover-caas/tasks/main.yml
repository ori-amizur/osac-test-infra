---
# Without bind-interfaces, dnsmasq binds the wildcard address (0.0.0.0:53)
# regardless of any interface= filters, which races with libvirt's "default"
# network dnsmasq (bound to virbr0's 192.168.122.1:53, used for mgmt-server/
# isp-server outbound NAT, so that network can't be removed) -- if libvirtd
# already grabbed its specific-address bind first, the wildcard bind fails
# outright ("Address already in use"). bind-interfaces makes dnsmasq bind
# only its named interfaces (br-mgmt here, where the OCP node and Assisted
# workers reach the service) instead of the wildcard address.
- name: Ensure dnsmasq listens on br-mgmt for agent DNS
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.d/ocp-sno.conf
    line: "{{ item }}"
    state: present
  loop:
    - "interface=br-mgmt"
    - "no-dhcp-interface=br-mgmt"
    - "bind-interfaces"
  register: _dnsmasq_mgmt
  notify: restart dnsmasq

- name: Restart dnsmasq if config changed
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
  when: _dnsmasq_mgmt is changed

- name: Configure OCP DNS on mgmt-server for Assisted worker registration
  ansible.builtin.shell:
    cmd: |
      ssh -o StrictHostKeyChecking=no root@192.168.16.1 "
        changed=false

        # Install dnsmasq if missing
        if ! command -v dnsmasq &>/dev/null; then
          apt-get update -qq && apt-get install -y -qq dnsmasq >/dev/null 2>&1
          changed=true
        fi

        # Write OCP DNS config — listen on mgmt IP only to avoid conflict with systemd-resolved
        mkdir -p /etc/dnsmasq.d
        DESIRED='address=/api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
      address=/.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
      listen-address=192.168.16.1
      bind-interfaces'
        if [ ! -f /etc/dnsmasq.d/ocp-sno.conf ] || [ \"\$(cat /etc/dnsmasq.d/ocp-sno.conf)\" != \"\$DESIRED\" ]; then
          echo \"\$DESIRED\" > /etc/dnsmasq.d/ocp-sno.conf
          changed=true
        fi

        # Ensure dnsmasq has upstream resolvers
        mkdir -p /run/dnsmasq
        echo 'nameserver {{ dns_server }}' > /run/dnsmasq/resolv.conf

        # Point DHCP DNS to mgmt-server so worker agents use local dnsmasq
        if grep -q 'option domain-name-servers 192.168.16.1' /etc/dhcp/dhcpd.conf; then
          :
        else
          sed -i 's/option domain-name-servers .*/option domain-name-servers 192.168.16.1, {{ dns_server }};/' /etc/dhcp/dhcpd.conf
          systemctl restart isc-dhcp-server 2>/dev/null || true
          changed=true
        fi

        # Ensure dnsmasq is running
        systemctl enable dnsmasq 2>/dev/null
        systemctl restart dnsmasq

        echo \$changed
      "
  register: _mgmt_dns_result
  changed_when: "'true' in _mgmt_dns_result.stdout"

# The Assisted agents' default gateway is mgmt-server (servers_gw 192.168.16.1),
# but mgmt-server did not forward/NAT their traffic to the OCP ingress. So the
# agents could reach neither the rootfs (coreos.live.rootfs_url) nor
# assisted-service at {{ ocp_dnat_ip }}, and discovery stalled with
# "curl: (7) Couldn't connect to server". mgmt-server can reach {{ ocp_dnat_ip }}
# itself (via virbr0 -> host -> br-public), so enabling IP forwarding and
# masquerading the servers network extends that reachability to the agents.
- name: Enable forwarding and NAT on mgmt-server for Assisted agents
  ansible.builtin.shell:
    cmd: |
      ssh -o StrictHostKeyChecking=no root@192.168.16.1 "
        changed=false
        if [ \"\$(sysctl -n net.ipv4.ip_forward)\" != 1 ]; then
          sysctl -w net.ipv4.ip_forward=1
          changed=true
        fi
        mkdir -p /etc/sysctl.d
        echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-osac-forward.conf
        if ! iptables -t nat -C POSTROUTING -s 192.168.16.0/20 ! -d 192.168.16.0/20 -j MASQUERADE 2>/dev/null; then
          iptables -t nat -A POSTROUTING -s 192.168.16.0/20 ! -d 192.168.16.0/20 -j MASQUERADE
          changed=true
        fi
        # ip_forward + NAT are not enough if the FORWARD filter policy is DROP;
        # accept forwarded traffic to/from the servers network explicitly.
        for rule in '-s 192.168.16.0/20' '-d 192.168.16.0/20'; do
          if ! iptables -C FORWARD \$rule -j ACCEPT 2>/dev/null; then
            iptables -I FORWARD 1 \$rule -j ACCEPT
            changed=true
          fi
        done
        echo \$changed
      "
  register: _mgmt_forward_result
  changed_when: "'true' in _mgmt_forward_result.stdout"

# The cloudsim dhcpd template deliberately omits 'option routers' for the
# _servers_mgmt subnet, so Assisted agents get a management address but no
# default route and cannot reach the OCP ingress. Real OCP nodes get their
# default via the fabric NIC and ignore the DHCP gateway (nmstate
# auto-gateway/auto-routes: false), but Assisted agents need the
# management NIC. Add a default route via mgmt-server (which forwards to the
# ingress) for the servers subnet so the agents can reach assisted-service.
- name: Give Assisted agents a default route via mgmt-server
  ansible.builtin.shell:
    cmd: |
      ssh -o StrictHostKeyChecking=no root@192.168.16.1 "
        if grep -q 'option routers 192.168.16.1;' /etc/dhcp/dhcpd.conf; then
          echo false
        else
          sed -i '/subnet 192.168.16.0/a option routers 192.168.16.1;' /etc/dhcp/dhcpd.conf
          systemctl restart isc-dhcp-server 2>/dev/null || true
          echo true
        fi
      "
  register: _mgmt_routers_result
  changed_when: "'true' in _mgmt_routers_result.stdout"

- name: Boot workers with the shared discovery InfraEnv when requested
  ansible.builtin.include_tasks: discover-workers.yml
  when: not (caas_use_order_infraenv_for_worker_boot | default(true) | bool)
