---
- name: Resolve CaaS worker VM names when not already known
  ansible.builtin.include_tasks: find-worker-vms.yml
  when: caas_discovery_vms is not defined

- name: Get VM states
  ansible.builtin.shell:
    cmd: virsh domstate {{ item }}
  register: _vm_states
  changed_when: false
  loop: "{{ caas_discovery_vms }}"

- name: Shut down running VMs
  ansible.builtin.command:
    cmd: virsh destroy {{ item.item }}
  when: item.stdout | trim == 'running'
  loop: "{{ _vm_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Get current vCPU count
  ansible.builtin.shell:
    cmd: virsh vcpucount {{ item }} --config --maximum
  register: _current_vcpus
  changed_when: false
  loop: "{{ caas_discovery_vms }}"

- name: Set maximum vCPUs
  ansible.builtin.command:
    cmd: virsh setvcpus {{ item.item }} {{ caas_discovery_vcpu_overrides[item.item] | default(caas_discovery_vcpu) }} --config --maximum
  when: item.stdout | int != (caas_discovery_vcpu_overrides[item.item] | default(caas_discovery_vcpu)) | int
  loop: "{{ _current_vcpus.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Set vCPUs
  ansible.builtin.command:
    cmd: virsh setvcpus {{ item.item }} {{ caas_discovery_vcpu_overrides[item.item] | default(caas_discovery_vcpu) }} --config
  when: item.stdout | int != (caas_discovery_vcpu_overrides[item.item] | default(caas_discovery_vcpu)) | int
  loop: "{{ _current_vcpus.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Get current max memory
  ansible.builtin.shell:
    cmd: virsh dommemstat {{ item }} | awk '/actual/{print int($2/1024)}'
  register: _current_memory
  changed_when: false
  loop: "{{ caas_discovery_vms }}"

- name: Set maximum memory
  ansible.builtin.command:
    cmd: >-
      virsh setmaxmem {{ item.item }}
      {{ caas_discovery_memory_mb_overrides[item.item] | default(caas_discovery_memory_mb) }}M
      --config
  when: >-
    item.stdout | int !=
    (caas_discovery_memory_mb_overrides[item.item] | default(caas_discovery_memory_mb)) | int
  loop: "{{ _current_memory.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Set memory
  ansible.builtin.command:
    cmd: >-
      virsh setmem {{ item.item }}
      {{ caas_discovery_memory_mb_overrides[item.item] | default(caas_discovery_memory_mb) }}M
      --config
  when: >-
    item.stdout | int !=
    (caas_discovery_memory_mb_overrides[item.item] | default(caas_discovery_memory_mb)) | int
  loop: "{{ _current_memory.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Detach all existing disks
  ansible.builtin.shell:
    cmd: |
      for target in $(virsh domblklist {{ item }} | awk 'NR>2 && NF>1 {print $1}'); do
        virsh detach-disk {{ item }} "$target" --config 2>/dev/null || true
      done
  loop: "{{ caas_discovery_vms }}"
  changed_when: true

- name: Create empty boot disk for each VM
  ansible.builtin.command:
    cmd: qemu-img create -f qcow2 /var/lib/libvirt/images/{{ item }}-disk.qcow2 {{ caas_discovery_disk_gb }}G
    creates: /var/lib/libvirt/images/{{ item }}-disk.qcow2
  loop: "{{ caas_discovery_vms }}"

- name: Check if boot disk is attached
  ansible.builtin.shell:
    cmd: virsh domblklist {{ item }} | grep -q '{{ item }}-disk.qcow2'
  register: _boot_disk_attached
  failed_when: false
  changed_when: false
  loop: "{{ caas_discovery_vms }}"

- name: Attach boot disk
  ansible.builtin.command:
    cmd: virsh attach-disk {{ item.item }} /var/lib/libvirt/images/{{ item.item }}-disk.qcow2 vda --persistent --subdriver qcow2
  when: item.rc != 0
  loop: "{{ _boot_disk_attached.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Set CaaS worker boot order for BMaaS provisioning
  ansible.builtin.command:
    cmd: virt-xml {{ item }} --edit --boot network,hd
  loop: "{{ caas_discovery_vms }}"
  register: _worker_boot_order
  changed_when: "'--boot' not in _worker_boot_order.stderr | default('')"
