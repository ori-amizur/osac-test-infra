---
- name: Detect effective OSAC namespace
  ansible.builtin.shell:
    cmd: oc get namespace {{ snapshot_osac_namespace }} >/dev/null 2>&1 && echo {{ snapshot_osac_namespace }} || echo {{ osac_namespace }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: _detected_osac_ns
  changed_when: false
  failed_when: false

- name: Set effective OSAC namespace
  ansible.builtin.set_fact:
    _osac_namespace: "{{ _detected_osac_ns.stdout | default(osac_namespace) }}"

- name: Create caas gather subdirectories
  ansible.builtin.file:
    path: "{{ _gather_dir }}/caas/{{ item }}"
    state: directory
    mode: "0755"
  failed_when: false
  loop:
    - fulfillment-api

# ── Fulfillment API ──
- name: Get fulfillment API URL for gather
  ansible.builtin.shell:
    cmd: oc --request-timeout=15s get route fulfillment-internal-api -n {{ _osac_namespace }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _gather_fulfillment_host
  changed_when: false
  failed_when: false

- name: Get service account token for gather
  ansible.builtin.shell:
    cmd: oc --request-timeout=15s create token -n {{ _osac_namespace }} admin
  environment:
    KUBECONFIG: /root/.kube/config
  register: _gather_sa_token
  changed_when: false
  failed_when: false
  no_log: true

- name: Gather fulfillment host types
  ansible.builtin.shell: |
    curl -sfk -H "Authorization: Bearer ${GATHER_TOKEN}" \
      "https://{{ _gather_fulfillment_host.stdout }}/api/private/v1/host_types" \
      2>&1 | python3 -m json.tool > {{ _gather_dir }}/caas/fulfillment-api/host-types.json 2>&1 \
      || echo "unavailable" > {{ _gather_dir }}/caas/fulfillment-api/host-types.json
  environment:
    GATHER_TOKEN: "{{ _gather_sa_token.stdout }}"
  changed_when: false
  failed_when: false
  no_log: true
  when: _gather_fulfillment_host.stdout | default('') | length > 0

- name: Gather fulfillment cluster catalog items
  ansible.builtin.shell: |
    curl -sfk -H "Authorization: Bearer ${GATHER_TOKEN}" \
      "https://{{ _gather_fulfillment_host.stdout }}/api/private/v1/cluster_catalog_items" \
      2>&1 | python3 -m json.tool > {{ _gather_dir }}/caas/fulfillment-api/catalog-items.json 2>&1 \
      || echo "unavailable" > {{ _gather_dir }}/caas/fulfillment-api/catalog-items.json
  environment:
    GATHER_TOKEN: "{{ _gather_sa_token.stdout }}"
  changed_when: false
  failed_when: false
  no_log: true
  when: _gather_fulfillment_host.stdout | default('') | length > 0

- name: Gather fulfillment clusters
  ansible.builtin.shell: |
    curl -sfk -H "Authorization: Bearer ${GATHER_TOKEN}" \
      "https://{{ _gather_fulfillment_host.stdout }}/api/private/v1/clusters" 2>/dev/null \
      | python3 -c "
    import sys, json
    try:
        data = json.load(sys.stdin)
        for cluster in (data if isinstance(data, list) else data.get('clusters', data.get('items', [data]))):
            params = cluster.get('spec', {}).get('template_parameters', {})
            for key in ['pull_secret', 'ssh_private_key']:
                if key in params:
                    params[key] = {'value': '*** REDACTED ***'}
        json.dump(data, sys.stdout, indent=4)
    except Exception as e:
        print(f'Error: {e}')
    " > {{ _gather_dir }}/caas/fulfillment-api/clusters.json 2>&1 \
      || echo "unavailable" > {{ _gather_dir }}/caas/fulfillment-api/clusters.json
  environment:
    GATHER_TOKEN: "{{ _gather_sa_token.stdout }}"
  changed_when: false
  failed_when: false
  no_log: true
  when: _gather_fulfillment_host.stdout | default('') | length > 0

- name: Gather fulfillment cluster templates
  ansible.builtin.shell: |
    curl -sfk -H "Authorization: Bearer ${GATHER_TOKEN}" \
      "https://{{ _gather_fulfillment_host.stdout }}/api/private/v1/cluster_templates" \
      2>&1 | python3 -m json.tool > {{ _gather_dir }}/caas/fulfillment-api/cluster-templates.json 2>&1 \
      || echo "unavailable" > {{ _gather_dir }}/caas/fulfillment-api/cluster-templates.json
  environment:
    GATHER_TOKEN: "{{ _gather_sa_token.stdout }}"
  changed_when: false
  failed_when: false
  no_log: true
  when: _gather_fulfillment_host.stdout | default('') | length > 0

# ── CaaS hosting cluster inspect ──
- name: Run oc adm inspect on CaaS-related namespaces
  ansible.builtin.shell: |
    oc adm inspect \
      ns/{{ caas_discovery_infraenv_namespace }} \
      --dest-dir={{ _gather_dir }}/caas/inspect/hosting \
      2>&1 || echo "inspect failed or cluster unreachable"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false

# ── Hosted cluster must-gather + inspect ──
- name: Get hosted cluster namespace
  ansible.builtin.shell:
    cmd: >-
      oc --request-timeout=15s get hostedclusters.hypershift.openshift.io --all-namespaces -o jsonpath='{.items[0].metadata.namespace}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _hc_ns
  changed_when: false
  failed_when: false

- name: Get hosted cluster name
  ansible.builtin.shell:
    cmd: >-
      oc --request-timeout=15s get hostedclusters.hypershift.openshift.io --all-namespaces -o jsonpath='{.items[0].metadata.name}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _hc_name
  changed_when: false
  failed_when: false
  when: _hc_ns.stdout | default('') | length > 0

- name: Extract hosted cluster kubeconfig
  ansible.builtin.shell: |
    SECRET_NAME=$(oc --request-timeout=15s get hostedclusters.hypershift.openshift.io --all-namespaces -o jsonpath='{.items[0].status.kubeconfig.name}' 2>/dev/null)
    if [ -n "${SECRET_NAME}" ] && \
      oc --request-timeout=15s get secret "${SECRET_NAME}" -n "{{ _hc_ns.stdout }}" -o jsonpath='{.data.kubeconfig}' 2>/dev/null \
        | base64 -d > /tmp/caas-hosted-kubeconfig 2>/dev/null && [ -s /tmp/caas-hosted-kubeconfig ]; then
      exit 0
    fi
    echo "hosted cluster kubeconfig unavailable"
    rm -f /tmp/caas-hosted-kubeconfig
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false
  no_log: true
  when: _hc_ns.stdout | default('') | length > 0

- name: Gather redaction-friendly hosted cluster diagnostics
  ansible.builtin.shell: |
    set +e
    out="{{ _gather_dir }}/caas/hosted-cluster"
    mkdir -p "$out/pods"
    kubeconfig=/tmp/caas-hosted-kubeconfig
    if [ ! -s "$kubeconfig" ]; then
      echo "Hosted cluster kubeconfig unavailable" > "$out/collection-status.txt"
      exit 0
    fi

    export KUBECONFIG="$kubeconfig"
    capture_oc() {
      local output="$1"
      shift
      oc --request-timeout=15s "$@" > "$output" 2>&1
    }

    capture_oc "$out/nodes.txt" get nodes -o wide || true
    capture_oc "$out/clusteroperators.txt" get clusteroperators -o wide || true
    capture_oc "$out/clusterversion.txt" get clusterversion -o wide || true
    capture_oc "$out/pods-all.txt" get pods -A -o wide || true
    capture_oc "$out/workloads.txt" get deployments,statefulsets,daemonsets,jobs -A -o wide || true
    capture_oc "$out/events.txt" get events -A --sort-by=.metadata.creationTimestamp || true

    pod_data=$(mktemp)
    capture_oc "$pod_data" get pods -A -o json || true
    pods=$(jq -r '
      .items[]
      | select(.status.phase != "Succeeded")
      | select(
          .status.phase != "Running"
          or any((.status.containerStatuses // [])[]; (.ready != true) or ((.restartCount // 0) > 0))
          or any((.status.initContainerStatuses // [])[];
            ((.restartCount // 0) > 0)
            or (.state.waiting != null)
            or ((.state.terminated.exitCode // 0) != 0)
          )
        )
      | [.metadata.namespace, .metadata.name]
      | @tsv
    ' "$pod_data" 2>/dev/null || true)
    rm -f "$pod_data"
    while IFS=$'\t' read -r namespace pod; do
      [ -n "$namespace" ] && [ -n "$pod" ] || continue
      safe_name=$(printf '%s-%s' "$namespace" "$pod" | tr -c 'A-Za-z0-9._-' '_')
      capture_oc "$out/pods/${safe_name}.log" logs "$pod" -n "$namespace" --all-containers --timestamps --tail=2000 || true
      capture_oc "$out/pods/${safe_name}-previous.log" logs "$pod" -n "$namespace" --all-containers --previous --timestamps --tail=2000 || true
    done <<< "$pods"

    echo "Collected hosted-cluster status and unhealthy-pod logs; raw must-gather and inspect archives are excluded from the upload."
  environment:
    KUBECONFIG: /root/.kube/config
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: _hc_ns.stdout | default('') | length > 0

- name: Run oc adm must-gather on hosted cluster
  ansible.builtin.shell: |
    oc adm must-gather \
      --dest-dir={{ _gather_dir }}/caas/must-gather/hosted-cluster \
      2>&1 || echo "must-gather failed or cluster unreachable"
  environment:
    KUBECONFIG: /tmp/caas-hosted-kubeconfig
  changed_when: false
  failed_when: false
  when: _hc_ns.stdout | default('') | length > 0

- name: Run oc adm inspect on hosted control plane namespace
  ansible.builtin.shell: |
    oc adm inspect \
      ns/{{ _hc_ns.stdout }}-{{ _hc_name.stdout }} \
      --dest-dir={{ _gather_dir }}/caas/inspect/hosted-control-plane \
      2>&1 || echo "inspect failed or namespace not found"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false
  when: _hc_name.stdout | default('') | length > 0

- name: Clean up hosted cluster kubeconfig
  ansible.builtin.file:
    path: /tmp/caas-hosted-kubeconfig
    state: absent
  failed_when: false
