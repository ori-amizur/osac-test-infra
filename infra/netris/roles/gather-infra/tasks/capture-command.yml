---
- name: "Capture {{ _gather_lab_command.label }}"
  ansible.builtin.command:
    argv: "{{ _gather_lab_command.argv }}"
  environment: "{{ _gather_lab_command.environment | default({}) }}"
  register: _gather_lab_command_result
  changed_when: false
  failed_when: false
  until: _gather_lab_command_result.rc == 0
  retries: "{{ _gather_lab_command.retries | default(1) }}"
  delay: "{{ _gather_lab_command.delay | default(1) }}"

- name: "Write {{ _gather_lab_command.label }} diagnostics"
  ansible.builtin.copy:
    dest: "{{ _gather_dir }}/lab/{{ _gather_lab_command.path }}"
    mode: "0644"
    content: |
      collector={{ _gather_lab_command.label }}
      attempts={{ _gather_lab_command_result.attempts | default(1) }}
      exit_code={{ _gather_lab_command_result.rc | default(-1) }}
      {{ _gather_lab_command_result.stdout | default('') }}
      {{ _gather_lab_command_result.stderr | default('') }}
  changed_when: false
