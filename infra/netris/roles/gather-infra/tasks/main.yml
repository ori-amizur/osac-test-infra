---
- name: Load netris-lab variables
  ansible.builtin.include_vars:
    file: "{{ netris_lab_dir }}/group_vars/all.yml"

- name: Create lab gather subdirectories
  ansible.builtin.file:
    path: "{{ _gather_dir }}/lab/{{ item }}"
    state: directory
    mode: "0755"
  failed_when: false
  loop:
    - host
    - networking
    - libvirt
    - k3s
    - netris
    - openvpn
    - socat
    - dns
    - systemd
    - journal
    - k3s/pods
    - k3s/installer
    - libvirt/qemu
    - libvirt/domains

- name: Gather comprehensive Netris lab diagnostics
  ansible.builtin.include_tasks: lab-diagnostics.yml

# ── Host ──
- name: Gather uptime
  ansible.builtin.shell: uptime > {{ _gather_dir }}/lab/host/uptime 2>&1
  changed_when: false
  failed_when: false

- name: Gather memory usage
  ansible.builtin.shell: free -h > {{ _gather_dir }}/lab/host/memory 2>&1
  changed_when: false
  failed_when: false

- name: Gather disk usage
  ansible.builtin.shell: df -h > {{ _gather_dir }}/lab/host/disk 2>&1
  changed_when: false
  failed_when: false

- name: Gather CPU info
  ansible.builtin.shell: lscpu > {{ _gather_dir }}/lab/host/cpu 2>&1
  changed_when: false
  failed_when: false

- name: Gather OS and kernel
  ansible.builtin.shell: "{ uname -a; echo; cat /etc/os-release; } > {{ _gather_dir }}/lab/host/os 2>&1"
  changed_when: false
  failed_when: false

# ── Networking ──
- name: Gather br-mgmt status
  ansible.builtin.shell: ip -d link show {{ mgmt_bridge_name }} > {{ _gather_dir }}/lab/networking/br-mgmt 2>&1 || echo "not found" > {{ _gather_dir }}/lab/networking/br-mgmt
  changed_when: false
  failed_when: false

- name: Gather br-public status
  ansible.builtin.shell: ip -d link show {{ public_bridge_name }} > {{ _gather_dir }}/lab/networking/br-public 2>&1 || echo "not found" > {{ _gather_dir }}/lab/networking/br-public
  changed_when: false
  failed_when: false

- name: Gather IP addresses
  ansible.builtin.shell: ip -4 addr show > {{ _gather_dir }}/lab/networking/ip-addresses 2>&1
  changed_when: false
  failed_when: false

- name: Gather routes
  ansible.builtin.shell: ip route show > {{ _gather_dir }}/lab/networking/routes 2>&1
  changed_when: false
  failed_when: false

- name: Gather iptables rules
  ansible.builtin.shell: iptables-save > {{ _gather_dir }}/lab/networking/iptables 2>&1 || echo "iptables not available" > {{ _gather_dir }}/lab/networking/iptables
  changed_when: false
  failed_when: false

- name: Gather nftables ruleset
  ansible.builtin.shell: nft list ruleset > {{ _gather_dir }}/lab/networking/nftables 2>&1 || echo "nftables not available" > {{ _gather_dir }}/lab/networking/nftables
  changed_when: false
  failed_when: false

# ── Libvirt/KVM ──
- name: Gather VM list
  ansible.builtin.shell: virsh list --all > {{ _gather_dir }}/lab/libvirt/vm-list 2>&1
  changed_when: false
  failed_when: false

- name: Gather VM XML dumps
  ansible.builtin.shell: |
    for vm in $(virsh list --all --name 2>/dev/null); do
      [ -z "$vm" ] && continue
      echo "=== $vm ==="
      virsh dumpxml "$vm" 2>&1
      echo
    done > {{ _gather_dir }}/lab/libvirt/vm-xml-dump 2>&1
  changed_when: false
  failed_when: false

# ── Netris controller API ──
- name: Discover Netris controller URL for gather
  ansible.builtin.shell: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _gather_traefik_np
  changed_when: false
  failed_when: false
  until: _gather_traefik_np.rc == 0 and (_gather_traefik_np.stdout | length) > 0
  retries: 4
  delay: 2

- name: Set Netris controller URL for gather
  ansible.builtin.set_fact:
    _gather_netris_url: "http://localhost:{{ _gather_traefik_np.stdout | default('0') }}"

- name: Check Netris controller API
  ansible.builtin.shell: "curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 5 --max-time 30 -o /dev/null -w '%{http_code}' {{ _gather_netris_url }} > {{ _gather_dir }}/lab/netris/api-status 2>&1 || echo 'unreachable' > {{ _gather_dir }}/lab/netris/api-status"
  changed_when: false
  failed_when: false

- name: Login to Netris controller
  ansible.builtin.shell: |
    curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 5 --max-time 30 -c - {{ _gather_netris_url }}/api/auth \
      -H 'Content-Type: application/json' \
      -d '{"user":"{{ netris_login }}","password":"{{ netris_password }}","auth_scheme_id":1}' \
      2>/dev/null | grep connect.sid | awk '{print $NF}'
  register: _gather_netris_cookie
  changed_when: false
  failed_when: false
  no_log: true

- name: Gather Netris VPCs
  ansible.builtin.shell: "curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 5 --max-time 30 -b 'connect.sid={{ _gather_netris_cookie.stdout }}' {{ _gather_netris_url }}/api/v2/vpc 2>&1 | python3 -m json.tool > {{ _gather_dir }}/lab/netris/vpcs 2>&1 || echo 'unavailable' > {{ _gather_dir }}/lab/netris/vpcs"
  changed_when: false
  failed_when: false

- name: Gather Netris VNets
  ansible.builtin.shell: "curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 5 --max-time 30 -b 'connect.sid={{ _gather_netris_cookie.stdout }}' {{ _gather_netris_url }}/api/v2/vnet 2>&1 | python3 -m json.tool > {{ _gather_dir }}/lab/netris/vnets 2>&1 || echo 'unavailable' > {{ _gather_dir }}/lab/netris/vnets"
  changed_when: false
  failed_when: false

- name: Gather Netris subnets
  ansible.builtin.shell: "curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 5 --max-time 30 -b 'connect.sid={{ _gather_netris_cookie.stdout }}' {{ _gather_netris_url }}/api/v2/ipam/subnets 2>&1 | python3 -m json.tool > {{ _gather_dir }}/lab/netris/subnets 2>&1 || echo 'unavailable' > {{ _gather_dir }}/lab/netris/subnets"
  changed_when: false
  failed_when: false

- name: Gather Netris NAT rules
  ansible.builtin.shell: "curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 5 --max-time 30 -b 'connect.sid={{ _gather_netris_cookie.stdout }}' {{ _gather_netris_url }}/api/v2/nat 2>&1 | python3 -m json.tool > {{ _gather_dir }}/lab/netris/nats 2>&1 || echo 'unavailable' > {{ _gather_dir }}/lab/netris/nats"
  changed_when: false
  failed_when: false

# ── OpenVPN ──
- name: Gather tun0 interface
  ansible.builtin.shell: ip addr show tun0 > {{ _gather_dir }}/lab/openvpn/tun0 2>&1 || echo "tun0 not found" > {{ _gather_dir }}/lab/openvpn/tun0
  changed_when: false
  failed_when: false

# ── DNS ──
- name: Gather dnsmasq status
  ansible.builtin.shell: systemctl status dnsmasq --no-pager > {{ _gather_dir }}/lab/dns/dnsmasq-status 2>&1 || echo "dnsmasq not running" > {{ _gather_dir }}/lab/dns/dnsmasq-status
  changed_when: false
  failed_when: false

- name: Gather dnsmasq config
  ansible.builtin.shell: cat /etc/dnsmasq.d/ocp-sno.conf > {{ _gather_dir }}/lab/dns/dnsmasq-config 2>&1 || echo "no config" > {{ _gather_dir }}/lab/dns/dnsmasq-config
  changed_when: false
  failed_when: false

- name: Gather DNS resolution test
  ansible.builtin.shell: |
    resolve_with_retry() {
      local host="$1"
      local attempt
      for attempt in 1 2 3 4 5; do
        if getent hosts "$host"; then
          return 0
        fi
        echo "DNS lookup attempt ${attempt}/5 failed for ${host}"
        [ "$attempt" -eq 5 ] || sleep 2
      done
      echo "unresolvable"
      return 0
    }
    {
      echo "=== api.{{ ocp_cluster_name }}.{{ ocp_base_domain }} ==="
      resolve_with_retry api.{{ ocp_cluster_name }}.{{ ocp_base_domain }} 2>&1
      echo
      echo "=== *.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }} ==="
      resolve_with_retry test.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }} 2>&1
      echo
      echo "=== /etc/resolv.conf ==="
      cat /etc/resolv.conf
    } > {{ _gather_dir }}/lab/dns/resolution-test 2>&1
  changed_when: false
  failed_when: false

# ── socat forwarders ──
- name: Gather socat forwarder units
  ansible.builtin.shell: systemctl list-units 'socat-forwarder@*' --all --no-pager > {{ _gather_dir }}/lab/socat/forwarder-units 2>&1 || echo "no units" > {{ _gather_dir }}/lab/socat/forwarder-units
  changed_when: false
  failed_when: false

# ── systemd ──
- name: Gather failed systemd units
  ansible.builtin.shell: systemctl --failed --no-pager > {{ _gather_dir }}/lab/systemd/failed-units 2>&1
  changed_when: false
  failed_when: false

# ── Journal ──
- name: Gather recent journal errors
  ansible.builtin.shell: journalctl -p err --no-pager -n 100 > {{ _gather_dir }}/lab/journal/errors 2>&1
  changed_when: false
  failed_when: false
