---
- name: Find OCP server VM
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ ocp_vm_name_pattern }}"
  register: _vm_lookup
  changed_when: false

- name: Set VM name
  ansible.builtin.set_fact:
    ocp_vm_name: "{{ _vm_lookup.stdout_lines[0] }}"

- name: Check if VM is running
  ansible.builtin.shell:
    cmd: virsh domstate {{ ocp_vm_name }}
  register: _vm_state
  changed_when: false

- name: Shut down VM
  ansible.builtin.command:
    cmd: virsh destroy {{ ocp_vm_name }}
  when: _vm_state.stdout | trim == 'running'
  changed_when: true

- name: Check which disks are attached
  ansible.builtin.shell:
    cmd: virsh domblklist {{ ocp_vm_name }}
  register: _attached_disks
  changed_when: false

- name: Detach existing disks
  ansible.builtin.command:
    cmd: virsh detach-disk {{ ocp_vm_name }} {{ item }} --config
  loop: [vda, vdb, hdd]
  register: _detach
  failed_when: false
  changed_when: _detach.rc == 0

- name: Remove old disk images
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/libvirt/images/hgx-00-ocp.qcow2
    - /var/lib/libvirt/images/hgx-00-lvm.qcow2

- name: Create CoW overlay for OS disk
  ansible.builtin.command:
    cmd: >-
      qemu-img create -f qcow2
      -b {{ snapshot_flavor_dir }}/disk-0.qcow2
      -F qcow2
      /var/lib/libvirt/images/hgx-00-ocp.qcow2

- name: Create CoW overlay for LVM disk
  ansible.builtin.command:
    cmd: >-
      qemu-img create -f qcow2
      -b {{ snapshot_flavor_dir }}/disk-1.qcow2
      -F qcow2
      /var/lib/libvirt/images/hgx-00-lvm.qcow2

# MaaS: grow CoW OS overlay before nbd mount (flavor root is ~100Gi).
- name: Resize CoW OS overlay for MaaS
  ansible.builtin.command:
    cmd: qemu-img resize /var/lib/libvirt/images/hgx-00-ocp.qcow2 {{ ocp_snapshot_disk_gb }}G
  when: (suite | default('caas')) == 'maas'

- name: Set disk ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: qemu
    group: qemu
  loop:
    - /var/lib/libvirt/images/hgx-00-ocp.qcow2
    - /var/lib/libvirt/images/hgx-00-lvm.qcow2

- name: Mount OS disk and configure pre-boot settings
  block:
    - name: Load nbd kernel module
      ansible.builtin.command:
        cmd: modprobe nbd max_part=8

    - name: Disconnect stale nbd device
      ansible.builtin.shell:
        cmd: umount /tmp/flavor-mount 2>/dev/null; qemu-nbd --disconnect /dev/nbd0 2>/dev/null; true
      changed_when: false

    - name: Connect OS disk overlay to nbd
      ansible.builtin.command:
        cmd: qemu-nbd --connect=/dev/nbd0 /var/lib/libvirt/images/hgx-00-ocp.qcow2

    - name: Wait for nbd device
      ansible.builtin.pause:
        seconds: 2

    - name: Grow GPT and root partition to fill overlay (MaaS)
      ansible.builtin.shell: |
        set -euo pipefail
        sgdisk -e /dev/nbd0
        partprobe /dev/nbd0 || true
        sleep 1
        parted -s /dev/nbd0 resizepart 4 100%
        partprobe /dev/nbd0 || true
        sleep 1
      when: (suite | default('caas')) == 'maas'

    - name: Create mount point
      ansible.builtin.file:
        path: /tmp/flavor-mount
        state: directory

    - name: Mount ostree partition
      ansible.posix.mount:
        path: /tmp/flavor-mount
        src: /dev/nbd0p4
        fstype: xfs
        state: mounted

    - name: Grow root XFS filesystem (MaaS)
      ansible.builtin.command:
        cmd: xfs_growfs /tmp/flavor-mount
      when: (suite | default('caas')) == 'maas'

    - name: Find ostree deploy directory
      ansible.builtin.shell:
        cmd: ls -d /tmp/flavor-mount/ostree/deploy/rhcos/deploy/*/ | head -1
      register: _ostree_deploy
      changed_when: false

    - name: Set deploy dir fact
      ansible.builtin.set_fact:
        _deploy: "{{ _ostree_deploy.stdout | trim }}"

    # --- Read source identity ---

    - name: Read source hostname
      ansible.builtin.slurp:
        src: "{{ _deploy }}etc/hostname"
      register: _src_hostname_raw

    - name: Set source hostname fact
      ansible.builtin.set_fact:
        snapshot_source_hostname: "{{ _src_hostname_raw.content | b64decode | trim }}"

    - name: Read source kubeconfig
      ansible.builtin.slurp:
        src: "{{ _deploy }}etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/lb-ext.kubeconfig"
      register: _src_kubeconfig_raw

    - name: Parse source cluster name and domain from kubeconfig
      ansible.builtin.set_fact:
        _src_api_url: "{{ (_src_kubeconfig_raw.content | b64decode | from_yaml).clusters[0].cluster.server }}"

    - name: Extract source cluster and domain
      ansible.builtin.set_fact:
        snapshot_source_cluster: "{{ _src_api_url | regex_search('api\\.([^.]+)\\.', '\\1') | first }}"
        snapshot_source_domain: "{{ _src_api_url | regex_search('api\\.[^.]+\\.(.+):6443', '\\1') | first }}"

    - name: Parse source IP from CRI-O nodenet config
      ansible.builtin.shell:
        cmd: |
          # Read CONTAINER_STREAM_ADDRESS from CRI-O nodenet drop-in
          conf="{{ _deploy }}etc/systemd/system/crio.service.d/20-nodenet.conf"
          if [ -f "$conf" ]; then
            ip=$(grep -oP 'CONTAINER_STREAM_ADDRESS=\K[0-9.]+' "$conf")
            if [ -n "$ip" ]; then
              echo "$ip"
              exit 0
            fi
          fi
          echo "UNKNOWN"
      register: _src_ip_result
      changed_when: false

    - name: Set source IP fact
      ansible.builtin.set_fact:
        snapshot_source_ip: "{{ _src_ip_result.stdout | trim }}"

    - name: Read etcd image from static pod manifest
      ansible.builtin.shell:
        cmd: >-
          python3 -c "import yaml;
          d=yaml.safe_load(open('{{ _deploy }}etc/kubernetes/manifests/etcd-pod.yaml'));
          print([c['image'] for c in d['spec']['containers'] if c['name']=='etcd'][0])"
      register: _etcd_image_result
      changed_when: false
      failed_when: false

    - name: Set etcd image fact
      ansible.builtin.set_fact:
        snapshot_etcd_image: "{{ _etcd_image_result.stdout | default('') | trim }}"

    - name: Read ingress CN from flavor
      ansible.builtin.slurp:
        src: "{{ snapshot_flavor_dir }}/crypto/ingress-cn.txt"
      register: _ingress_cn_raw

    - name: Set ingress CN fact
      ansible.builtin.set_fact:
        _ingress_cn: "{{ _ingress_cn_raw.content | b64decode | trim }}"

    - name: Set shared var directory path
      ansible.builtin.set_fact:
        _var: "{{ _deploy | regex_replace('deploy/[^/]+/$', 'var/') }}"

    - name: Report source identity
      ansible.builtin.debug:
        msg: >-
          Source identity: hostname={{ snapshot_source_hostname }},
          cluster={{ snapshot_source_cluster }}.{{ snapshot_source_domain }},
          ip={{ snapshot_source_ip }},
          etcd_image={{ snapshot_etcd_image | default('not found') }}

    # --- Write target config ---

    - name: Write target hostname
      ansible.builtin.copy:
        content: "{{ ocp_vm_name }}"
        dest: "{{ _deploy }}etc/hostname"
        mode: "0644"

    - name: Write nodeip hint
      ansible.builtin.copy:
        content: |
          KUBELET_NODEIP_HINT={{ ocp_subnet_cidr | ansible.utils.ipaddr('network') }}
        dest: "{{ _deploy }}etc/default/nodeip-configuration"
        mode: "0644"

    - name: Write dnsmasq overrides
      ansible.builtin.copy:
        content: |
          SNO_CLUSTER_NAME_OVERRIDE={{ ocp_cluster_name }}
          SNO_BASE_DOMAIN_OVERRIDE={{ ocp_base_domain }}
          SNO_DNSMASQ_IP_OVERRIDE={{ ocp_node_ip }}
        dest: "{{ _deploy }}etc/default/sno_dnsmasq_configuration_overrides"
        mode: "0644"

    # --- Stage recert working directory ---

    - name: Create recert working directory on disk
      ansible.builtin.file:
        path: "{{ _var }}lib/snapshot-recert/crypto"
        state: directory
        mode: "0755"

    - name: Copy crypto directory to disk
      ansible.builtin.shell:
        cmd: cp -a {{ snapshot_flavor_dir }}/crypto/* {{ _var }}lib/snapshot-recert/crypto/
      changed_when: true

    - name: Copy pull-secret to disk
      ansible.builtin.copy:
        src: "{{ pull_secret_path }}"
        dest: "{{ _var }}lib/snapshot-recert/crypto/pull-secret"
        mode: "0600"
        remote_src: true

    - name: Write nmstate config to recert working directory
      ansible.builtin.copy:
        content: |
          interfaces:
          - name: {{ ocp_vpc_interface }}
            type: ethernet
            state: up
            ipv4:
              enabled: true
              dhcp: false
              address:
              - ip: {{ ocp_node_ip }}
                prefix-length: {{ ocp_subnet_cidr | ansible.utils.ipaddr('prefix') }}
            ipv6:
              enabled: false
              dhcp: false
              autoconf: false
          # Management interface stays addressable (for host-side SSH and
          # diagnostics) but must NOT install a default route, DHCP routes, or
          # DNS. {{ ocp_vpc_interface }} is the only interface that reaches the
          # outside world via the Netris DNAT frontend; a competing default
          # route here would send DNAT reply traffic (which arrives on
          # {{ ocp_vpc_interface }}) back out the management link, so external
          # SSH/API through the external IP never completes.
          - name: {{ caas_netris_mgmt_interface | default('ens4') }}
            type: ethernet
            state: up
            ipv4:
              enabled: true
              dhcp: true
              auto-gateway: false
              auto-routes: false
              auto-dns: false
            ipv6:
              enabled: false
              dhcp: false
              autoconf: false
          routes:
            config:
            # The VPC data interface owns the sole default route so DNAT return
            # traffic is symmetric. No metric override: it must win outright, not
            # merely lose to the management link's DHCP default.
            - destination: 0.0.0.0/0
              next-hop-interface: {{ ocp_vpc_interface }}
              next-hop-address: {{ ocp_gateway | ansible.utils.ipaddr('address') }}
              table-id: 254
          dns-resolver:
            config:
              server:
              - 192.168.16.1
              - {{ dns_server }}
        dest: "{{ _var }}lib/snapshot-recert/nmstate.yaml"
        mode: "0644"

    - name: Template recert script to disk
      ansible.builtin.template:
        src: recert.sh.j2
        dest: "{{ _var }}lib/snapshot-recert/recert.sh"
        mode: "0755"

    # --- Write systemd service and mask kubelet ---

    - name: Write snapshot-recert systemd service
      ansible.builtin.template:
        src: snapshot-recert.service.j2
        dest: "{{ _deploy }}etc/systemd/system/snapshot-recert.service"
        mode: "0644"

    - name: Enable snapshot-recert service
      ansible.builtin.shell:
        cmd: ln -sf /etc/systemd/system/snapshot-recert.service {{ _deploy }}etc/systemd/system/multi-user.target.wants/snapshot-recert.service
      changed_when: true

    - name: Disable kubelet so it does not start on boot
      ansible.builtin.shell:
        cmd: mv {{ _deploy }}etc/systemd/system/kubelet.service {{ _deploy }}etc/systemd/system/kubelet.service.snapshot-disabled
      changed_when: true

    - name: Add SSH public key to core user authorized_keys
      ansible.builtin.shell:
        cmd: |
          mkdir -p {{ _var }}home/core/.ssh
          cat {{ ssh_public_key_path }} >> {{ _var }}home/core/.ssh/authorized_keys
          chmod 700 {{ _var }}home/core/.ssh
          chmod 600 {{ _var }}home/core/.ssh/authorized_keys
          chown -R 1000:1000 {{ _var }}home/core/.ssh
      changed_when: true

    - name: Use loose reverse-path filtering for the multi-homed OCP VM
      ansible.builtin.copy:
        content: |
          # Loose mode (RFC 3704). The VM is multi-homed (VPC data path plus
          # the management interface). Strict rp_filter drops inbound DNAT
          # packets on the VPC NIC whenever the kernel's reverse-path lookup for the
          # client source resolves to a different interface, and also drops
          # management traffic whose source is only reachable off a non-default
          # link. The effective value is max(all, <iface>), so relaxing "all"
          # relaxes every interface.
          net.ipv4.conf.all.rp_filter=2
        dest: "{{ _deploy }}etc/sysctl.d/99-snapshot-rp-filter.conf"
        mode: "0644"

    - name: Fix SELinux labels on written files
      ansible.builtin.shell:
        cmd: |
          chcon system_u:object_r:bin_t:s0 {{ _var }}lib/snapshot-recert/recert.sh
          chcon system_u:object_r:systemd_unit_file_t:s0 {{ _deploy }}etc/systemd/system/snapshot-recert.service
          chcon -h system_u:object_r:systemd_unit_file_t:s0 {{ _deploy }}etc/systemd/system/multi-user.target.wants/snapshot-recert.service
          chcon system_u:object_r:etc_t:s0 {{ _deploy }}etc/default/sno_dnsmasq_configuration_overrides
          chcon system_u:object_r:system_conf_t:s0 {{ _deploy }}etc/sysctl.d/99-snapshot-rp-filter.conf
      changed_when: true

    # --- Delete OVN/OVS state ---

    - name: Delete OVN/OVS databases and stale state
      ansible.builtin.file:
        path: "{{ _deploy }}{{ item }}"
        state: absent
      loop:
        - etc/openvswitch/conf.db
        - etc/openvswitch/.conf.db.~lock~
        - etc/ovn/ovnsb_db.db
        - etc/ovn/ovnnb_db.db
        - etc/cni/multus/certs
        - run/nodeip-configuration

    - name: Delete OVN interconnect state
      ansible.builtin.file:
        path: "{{ _deploy }}var/lib/ovn-ic/etc"
        state: absent

  always:
    - name: Unmount ostree partition
      ansible.posix.mount:
        path: /tmp/flavor-mount
        state: unmounted
      failed_when: false

    - name: Disconnect nbd device
      ansible.builtin.command:
        cmd: qemu-nbd --disconnect /dev/nbd0
      failed_when: false

# --- Attach disks, resize VM, boot ---

- name: Attach OS disk
  ansible.builtin.command:
    cmd: virsh attach-disk {{ ocp_vm_name }} /var/lib/libvirt/images/hgx-00-ocp.qcow2 vda --persistent --subdriver qcow2

- name: Attach LVM disk
  ansible.builtin.command:
    cmd: virsh attach-disk {{ ocp_vm_name }} /var/lib/libvirt/images/hgx-00-lvm.qcow2 vdb --persistent --subdriver qcow2

- name: Get current vCPU count
  ansible.builtin.shell:
    cmd: virsh dominfo {{ ocp_vm_name }} | grep 'CPU(s)' | head -1 | awk '{print $2}'
  register: _current_vcpu
  changed_when: false

- name: Set maximum vCPUs
  ansible.builtin.command:
    cmd: virsh setvcpus {{ ocp_vm_name }} {{ ocp_server_vcpu }} --config --maximum
  when: _current_vcpu.stdout | int != ocp_server_vcpu | int

- name: Set vCPUs
  ansible.builtin.command:
    cmd: virsh setvcpus {{ ocp_vm_name }} {{ ocp_server_vcpu }} --config
  when: _current_vcpu.stdout | int != ocp_server_vcpu | int

- name: Get current max memory
  ansible.builtin.shell:
    cmd: virsh dominfo {{ ocp_vm_name }} | grep 'Max memory' | awk '{print $3}'
  register: _current_mem_kb
  changed_when: false

- name: Set maximum memory
  ansible.builtin.command:
    cmd: virsh setmaxmem {{ ocp_vm_name }} {{ ocp_server_memory_gb }}G --config
  when: (_current_mem_kb.stdout | int / 1048576) | round(0) | int != ocp_server_memory_gb | int

- name: Set memory
  ansible.builtin.command:
    cmd: virsh setmem {{ ocp_vm_name }} {{ ocp_server_memory_gb }}G --config
  when: (_current_mem_kb.stdout | int / 1048576) | round(0) | int != ocp_server_memory_gb | int

- name: Reserve OCP VM bmc-net address before boot
  when: bare_metal_services | default(false) | bool
  ansible.builtin.include_role:
    name: reserve-ocp-bmc

- name: Boot VM
  ansible.builtin.command:
    cmd: virsh start {{ ocp_vm_name }}

# Require SSH over the Netris DNAT external IP -- the only supported path.
# nmstate (which brings up the VPC data NIC and its default route) is the first
# thing snapshot-recert runs, so the external path is reachable within a minute
# or two of boot. Probing it here is an end-to-end test of DNAT that fails fast
# with diagnostics, instead of only discovering a DNAT break ~50 minutes later
# at the node-Ready check. There is no management-interface fallback: the node
# installation needs the VPC data path, which ens4 cannot substitute for.
- name: Probe SSH through the Netris DNAT external IP (VPC data NIC)
  ansible.builtin.command:
    cmd: >-
      ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=5 -i {{ snapshot_flavor_dir }}/crypto/cluster-tool.key
      core@{{ ocp_dnat_ip }} true
  register: _dnat_ssh_check
  until: _dnat_ssh_check.rc == 0
  retries: 90
  delay: 5
  changed_when: false
  failed_when: false

- name: Select the DNAT (VPC data NIC) SSH address when reachable
  ansible.builtin.set_fact:
    _vm_ssh_ip: "{{ ocp_dnat_ip }}"
    _vm_ssh_transport: "Netris DNAT external IP (VPC data NIC)"
  when: _dnat_ssh_check.rc == 0

- name: Capture DNAT-path diagnostics whenever the external path failed
  ansible.builtin.include_tasks: boot-failure-diagnostics.yml
  when: _dnat_ssh_check.rc != 0

- name: Fail when the required Netris DNAT SSH path is unreachable
  ansible.builtin.fail:
    msg: >-
      VM {{ ocp_vm_name }} did not become reachable via the required Netris
      DNAT external IP {{ ocp_dnat_ip }}. Boot diagnostics were saved to
      {{ _ocp_boot_failure_diag_dir }}.
  when: _dnat_ssh_check.rc != 0

- name: Report VM booted
  ansible.builtin.debug:
    msg: "VM {{ ocp_vm_name }} booted, SSH accessible at {{ _vm_ssh_ip }} via {{ _vm_ssh_transport }}"

- name: Set SSH command prefix
  ansible.builtin.set_fact:
    _ssh_cmd: >-
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
      -i {{ snapshot_flavor_dir }}/crypto/cluster-tool.key
      core@{{ _vm_ssh_ip }}

# --- Wait for snapshot-recert.service to complete ---

- name: Wait for snapshot-recert service to finish
  ansible.builtin.shell:
    cmd: >-
      {{ _ssh_cmd }} "systemctl is-active snapshot-recert.service 2>/dev/null; true"
  register: _svc_status
  until: _svc_status.stdout | trim in ['inactive', 'failed']
  retries: 120
  delay: 10
  changed_when: false

- name: Fetch service logs on failure
  ansible.builtin.shell:
    cmd: >-
      {{ _ssh_cmd }} "sudo journalctl -u snapshot-recert.service --no-pager -n 100"
  register: _svc_logs
  when: _svc_status.stdout | trim == 'failed'

- name: Fail if recert service failed
  ansible.builtin.fail:
    msg: |
      snapshot-recert.service failed. Logs:
      {{ _svc_logs.stdout | default('no logs available') }}
  when: _svc_status.stdout | trim == 'failed'

# --- Wait for cluster health ---

- name: Wait for API server healthy
  ansible.builtin.shell:
    cmd: >-
      {{ _ssh_cmd }} "curl -sk https://localhost:6443/healthz"
  register: _api_health
  until: _api_health.stdout | default('') == 'ok'
  retries: 60
  delay: 10

# --- Extract kubeconfig ---

- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Extract kubeconfig from VM
  ansible.builtin.shell:
    cmd: >-
      {{ _ssh_cmd }} "sudo cat /etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/lb-ext.kubeconfig"
  register: _kubeconfig_content

- name: Write kubeconfig
  ansible.builtin.copy:
    content: "{{ _kubeconfig_content.stdout }}"
    dest: "/root/kubeconfig.{{ ocp_cluster_name }}"
    mode: "0600"

- name: Copy kubeconfig to default location
  ansible.builtin.copy:
    content: "{{ _kubeconfig_content.stdout }}"
    dest: /root/.kube/config
    mode: "0600"

# --- Wait for cluster ready ---

- name: Wait for node Ready
  ansible.builtin.shell:
    cmd: >-
      oc get nodes --no-headers 2>/dev/null | grep -q ' Ready'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _node_ready
  until: _node_ready.rc == 0
  retries: 60
  delay: 30

- name: Wait for all ClusterOperators healthy
  ansible.builtin.shell:
    cmd: |
      oc get co -o json | python3 -c "
      import json, sys
      cos = json.load(sys.stdin)['items']
      for co in cos:
          name = co['metadata']['name']
          conditions = {c['type']: c['status'] for c in co.get('status', {}).get('conditions', [])}
          if conditions.get('Available') != 'True':
              print(f'NOT READY: {name} (Available={conditions.get(\"Available\")})')
              sys.exit(1)
          if conditions.get('Degraded') == 'True':
              print(f'DEGRADED: {name}')
              sys.exit(1)
      print(f'All {len(cos)} ClusterOperators healthy')
      "
  environment:
    KUBECONFIG: /root/.kube/config
  register: _co_health
  until: _co_health.rc == 0
  retries: 40
  delay: 30

- name: Verify OCP API and ingress through the Netris DNAT frontend
  block:
    - name: Check OCP API health through public DNS and DNAT
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --insecure
          - --noproxy
          - "*"
          - --connect-timeout
          - "5"
          - --max-time
          - "15"
          - "https://api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}:6443/healthz"
      register: _ocp_external_api_health
      until:
        - _ocp_external_api_health.rc == 0
        - _ocp_external_api_health.stdout | trim == 'ok'
      retries: 30
      delay: 10
      changed_when: false

    # The snapshot's console route can still have its original hostname while
    # the console operator reconciles the restored cluster. Keep reading it
    # until it matches this run's DNS domain before starting the HTTP probe.
    - name: Wait for the OCP console route to use this run's hostname
      ansible.builtin.command:
        argv:
          - oc
          - get
          - route
          - console
          - -n
          - openshift-console
          - -o
          - jsonpath={.spec.host}
      environment:
        KUBECONFIG: /root/.kube/config
      register: _ocp_console_route_host
      until:
        - _ocp_console_route_host.rc == 0
        - >-
          (_ocp_console_route_host.stdout | trim) ==
          ('console-openshift-console.apps.' ~ ocp_cluster_name ~ '.' ~ ocp_base_domain)
      retries: 12
      delay: 10
      changed_when: false

    - name: Check OCP console ingress through public DNS and DNAT
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --insecure
          - --noproxy
          - "*"
          - --connect-timeout
          - "5"
          - --max-time
          - "15"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "https://{{ _ocp_console_route_host.stdout | trim }}/"
      register: _ocp_external_ingress_status
      until:
        - _ocp_external_ingress_status.rc == 0
        - _ocp_external_ingress_status.stdout | trim in ['200', '301', '302', '303', '307', '308']
      retries: 30
      delay: 10
      changed_when: false
  rescue:
    - name: Capture diagnostics for external OCP access failure
      ansible.builtin.include_tasks: boot-failure-diagnostics.yml

    - name: Preserve failure because OCP API or ingress is unreachable through DNAT
      ansible.builtin.fail:
        msg: >-
          OCP API or console ingress did not become reachable through
          {{ ocp_dnat_ip }}. Diagnostics were saved to
          {{ _ocp_boot_failure_diag_dir | default('the OCP boot diagnostics directory') }}.

# recert's --extend-expiration regenerates every certificate it finds in
# etcd, including MCE's self-signed cluster-proxy-signer CA. That CA has no
# --use-key mapping, so recert generates a replacement key in PKCS#1
# encoding, but cluster-proxy-addon-manager only accepts PKCS#8 and
# crash-loops after any recert-based restore that bakes in MCE ("failed to
# parse ca key: x509: failed to parse private key"). MCE's own controller
# regenerates the secret correctly once it's missing, so delete the
# corrupted secret and restart -- gated on the multicluster-engine namespace
# existing, since flavors without MCE never hit this.
- name: Check if multicluster-engine namespace exists
  ansible.builtin.command:
    cmd: oc get namespace multicluster-engine
  environment:
    KUBECONFIG: /root/.kube/config
  register: _mce_namespace_check
  until: _mce_namespace_check.rc == 0 or 'NotFound' in (_mce_namespace_check.stderr | default(''))
  retries: 90
  delay: 10
  changed_when: false
  failed_when: false

- name: Recover cluster-proxy-addon-manager from a corrupted signer key
  when: _mce_namespace_check.rc == 0
  block:
    - name: Check for cluster-proxy-addon-manager crash loop
      ansible.builtin.shell:
        cmd: |
          oc get pods -n multicluster-engine -l component=cluster-proxy-addon-manager -o json | python3 -c "
          import json, sys
          pods = json.load(sys.stdin)['items']
          for pod in pods:
              for cs in pod.get('status', {}).get('containerStatuses', []):
                  if cs.get('restartCount', 0) > 1:
                      print('CRASHING')
                      sys.exit(0)
                  waiting = cs.get('state', {}).get('waiting', {})
                  if waiting.get('reason') == 'CrashLoopBackOff':
                      print('CRASHING')
                      sys.exit(0)
          print('OK')
          "
      environment:
        KUBECONFIG: /root/.kube/config
      register: _cpam_crash_check
      until: _cpam_crash_check.stdout | default('') | trim in ['CRASHING', 'OK']
      retries: 9
      delay: 10
      changed_when: false
      failed_when: false

    - name: Delete corrupted cluster-proxy-signer secret and restart
      when: _cpam_crash_check.stdout | default('') | trim == 'CRASHING'
      block:
        - name: Delete cluster-proxy-signer secret
          ansible.builtin.command:
            cmd: oc delete secret cluster-proxy-signer -n multicluster-engine
          environment:
            KUBECONFIG: /root/.kube/config

        - name: Restart cluster-proxy-addon-manager deployment
          ansible.builtin.command:
            cmd: oc rollout restart deployment/cluster-proxy-addon-manager -n multicluster-engine
          environment:
            KUBECONFIG: /root/.kube/config

        # Rollout can stall on a stale watch connection at "1 old replicas
        # pending termination" -- retry re-issues a fresh `oc rollout
        # status` watch rather than waiting longer on one connection.
        - name: Wait for cluster-proxy-addon-manager rollout
          ansible.builtin.command:
            cmd: oc rollout status deployment/cluster-proxy-addon-manager -n multicluster-engine --timeout=300s
          environment:
            KUBECONFIG: /root/.kube/config
          register: _cpam_rollout
          until: _cpam_rollout.rc == 0
          retries: 2
          delay: 5

        # MCE can take longer than 120s to settle after the addon-manager
        # restart, and on SNO the API server can also be transiently
        # unreachable during kube-apiserver static-pod cycling -- retry with
        # enough budget to cover both.
        - name: Wait for MultiClusterEngine to be Available
          ansible.builtin.command:
            cmd: >-
              oc wait --for=jsonpath='{.status.phase}'=Available
              multiclusterengine/multiclusterengine --timeout=120s
          environment:
            KUBECONFIG: /root/.kube/config
          register: _mce_available
          until: _mce_available.rc == 0
          retries: 10
          delay: 10

# Same recert key-format issue as cluster-proxy-signer above: recert
# regenerates the cert-manager-webhook-ca self-signed CA key in a format
# the webhook can't parse ("failed to parse private key (use
# ParsePKCS8PrivateKey instead)"), causing a permanent readiness probe
# failure. cert-manager regenerates the secret correctly once deleted.
- name: Check if cert-manager namespace exists
  ansible.builtin.command:
    cmd: oc get namespace cert-manager
  environment:
    KUBECONFIG: /root/.kube/config
  register: _certmgr_namespace_check
  changed_when: false
  failed_when: false

- name: Recover cert-manager webhook from a corrupted CA key
  when: _certmgr_namespace_check.rc == 0
  block:
    - name: Check for cert-manager-webhook readiness failure
      ansible.builtin.shell:
        cmd: |
          oc get pods -n cert-manager -l app.kubernetes.io/component=webhook -o json | python3 -c "
          import json, sys
          pods = json.load(sys.stdin)['items']
          for pod in pods:
              for cs in pod.get('status', {}).get('containerStatuses', []):
                  if not cs.get('ready', False):
                      print('NOT_READY')
                      sys.exit(0)
          print('OK')
          "
      environment:
        KUBECONFIG: /root/.kube/config
      register: _certmgr_webhook_check
      changed_when: false
      failed_when: false

    - name: Delete corrupted cert-manager-webhook-ca secret and restart
      when: _certmgr_webhook_check.stdout | default('') | trim == 'NOT_READY'
      block:
        - name: Delete cert-manager-webhook-ca secret
          ansible.builtin.command:
            cmd: oc delete secret cert-manager-webhook-ca -n cert-manager
          environment:
            KUBECONFIG: /root/.kube/config

        - name: Restart cert-manager-webhook deployment
          ansible.builtin.command:
            cmd: oc rollout restart deployment/cert-manager-webhook -n cert-manager
          environment:
            KUBECONFIG: /root/.kube/config

        - name: Wait for cert-manager-webhook rollout
          ansible.builtin.command:
            cmd: oc rollout status deployment/cert-manager-webhook -n cert-manager --timeout=300s
          environment:
            KUBECONFIG: /root/.kube/config
          register: _certmgr_rollout
          until: _certmgr_rollout.rc == 0
          retries: 2
          delay: 5

- name: Patch SSH key in cluster-config-v1 install-config
  ansible.builtin.shell:
    cmd: |
      SSH_KEY=$(cat {{ ssh_public_key_path }})
      oc get configmap cluster-config-v1 -n kube-system -o json \
        | python3 -c "
      import sys, json, yaml
      obj = json.load(sys.stdin)
      ic = yaml.safe_load(obj['data']['install-config'])
      ic['sshKey'] = '''${SSH_KEY}'''
      obj['data']['install-config'] = yaml.dump(ic, default_flow_style=False)
      json.dump(obj, sys.stdout)
      " | oc replace -f -
  environment:
    KUBECONFIG: /root/.kube/config

- name: Report cluster status
  ansible.builtin.debug:
    msg: "{{ _co_health.stdout }}"
