---
# Phase 1: Enable Ironic via Provisioning CR
#
# All Ironic traffic (virtual media, rootfs download, IPA callback) flows
# over bmc-net (br-bmc, 10.99.0.0/24). The BMH VM's bootMACAddress is set
# to its bmc-net NIC so IPA's BOOTIF kernel param matches that NIC, dracut
# configures it via DHCP, and IPA can reach the rootfs URL + callback on
# the same L2 segment. This mirrors dev-scripts' pattern where provisioning
# and rootfs traffic share a single network.

- name: Apply Provisioning CR
  ansible.builtin.shell:
    cmd: |
      oc apply -f - <<EOF
      apiVersion: metal3.io/v1alpha1
      kind: Provisioning
      metadata:
        name: provisioning-configuration
      spec:
        provisioningNetwork: "Disabled"
        watchAllNamespaces: true
        disableVirtualMediaTLS: true
        provisioningIP: "{{ bmc_net_ocp_ip }}"
        externalIPs:
          - {{ bmc_net_ocp_ip }}
      EOF
  environment:
    KUBECONFIG: /root/.kube/config
  register: _prov_cr
  changed_when: "'created' in _prov_cr.stdout or 'configured' in _prov_cr.stdout"

- name: Wait for metal3 pods to appear
  ansible.builtin.command:
    cmd: >-
      oc wait --for=create pods
      -l baremetal.openshift.io/cluster-baremetal-operator=metal3-state
      -n openshift-machine-api --timeout=300s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Wait for metal3 pods to be ready
  ansible.builtin.command:
    cmd: >-
      oc wait --for=condition=Ready pods
      -l baremetal.openshift.io/cluster-baremetal-operator=metal3-state
      -n openshift-machine-api --timeout=600s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

# Phase 1b: BM provisioning V-Net
# Create the Netris "bm-provisioning" V-Net (gateway + DHCP + SNAT) and attach
# every server's fabric port (eth9) to it, BEFORE the BMHs boot for inspection.
# This gives the metal3 IPA internet egress (to pull the ironic-agent image from
# quay.io) via its fabric NIC, so bmc-net can stay isolated (no default route,
# no multi-NIC default-route conflict). The OSAC operator later moves the port
# bm-provisioning -> tenant V-Net on provision and back on delete
# (NETRIS_BM_PROVISIONING_VNET). The vendored netris.controller.vnet role only
# exposes dhcpEnabled (no range), so the V-Net is created via a direct API call
# to set the explicit DHCP range; VPC/IPAM/SNAT reuse the roles (mirrors
# configure-netris).
- name: Set up BM provisioning V-Net
  when: bmaas_provisioning_enabled | bool
  block:
    - name: Discover Netris controller URL (k3s)
      ansible.builtin.shell:
        cmd: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: _provisioning_traefik_nodeport
      changed_when: false
      until: _provisioning_traefik_nodeport.rc == 0 and _provisioning_traefik_nodeport.stdout | length > 0
      retries: 10
      delay: 15

    - name: Set Netris controller URL
      ansible.builtin.set_fact:
        netris_controller_url: "http://localhost:{{ _provisioning_traefik_nodeport.stdout }}"

    - name: Authenticate to Netris controller
      ansible.builtin.include_role:
        name: netris.controller.auth

    - name: Create provisioning VPC
      ansible.builtin.include_role:
        name: netris.controller.vpc
      vars:
        vpc_name: "{{ bmaas_provisioning_vpc_name }}"
        vpc_state: present
        vpc_tenant_id: 1

    - name: Create IPAM allocation for provisioning
      ansible.builtin.include_role:
        name: netris.controller.ipam
      vars:
        ipam_state: create_allocation
        ipam_name: "{{ bmaas_provisioning_vnet_name }}-allocation"
        ipam_cidr: "{{ bmaas_provisioning_cidr }}"
        ipam_tenant_id: 1
        ipam_vpc_id: "{{ vpc_id }}"

    - name: Create IPAM subnet for provisioning
      ansible.builtin.include_role:
        name: netris.controller.ipam
      vars:
        ipam_state: create_subnet
        ipam_name: "{{ bmaas_provisioning_vnet_name }}-subnet"
        ipam_cidr: "{{ bmaas_provisioning_cidr }}"
        ipam_purpose: common
        ipam_site_id: 1
        ipam_tenant_id: 1
        ipam_vpc_id: "{{ vpc_id }}"

    - name: Build provisioning fabric port list
      ansible.builtin.set_fact:
        _provisioning_ports: "{{ _provisioning_ports | default([]) + [{'name': bmaas_provisioning_fabric_iface ~ '@' ~ item, 'accessMode': true}] }}"
      loop: "{{ bmaas_vm_patterns }}"

    - name: Get existing V-Nets
      ansible.builtin.uri:
        url: "{{ netris_controller_url }}/api/v2/vnet"
        method: GET
        headers:
          Cookie: "connect.sid={{ netris_session_cookie }}"
        status_code: 200
        validate_certs: "{{ netris_validate_certs | default(false) }}"
      register: _provisioning_vnet_list
      no_log: true

    - name: Create provisioning V-Net (gateway + DHCP range + fabric ports)
      ansible.builtin.uri:
        url: "{{ netris_controller_url }}/api/v2/vnet"
        method: POST
        headers:
          Cookie: "connect.sid={{ netris_session_cookie }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ bmaas_provisioning_vnet_name }}"
          # Single Jinja expression so the dict (and its int id) survives as JSON;
          # a quoted "{{ vpc_id | int }}" would stringify id and Netris rejects it
          # ("Invalid vpc/id: must be integer").
          vpc: "{{ {'id': vpc_id | int} }}"
          sites: [{id: 1}]
          state: active
          vlan: auto
          tenant: {id: 1}
          gateways:
            - prefix: "{{ bmaas_provisioning_gateway }}"
              dhcpEnabled: true
              dhcpStartIp: "{{ bmaas_provisioning_dhcp_start }}"
              dhcpEndIp: "{{ bmaas_provisioning_dhcp_end }}"
          ports: "{{ _provisioning_ports }}"
        status_code: [200, 201]
        validate_certs: "{{ netris_validate_certs | default(false) }}"
      register: _provisioning_vnet_create
      changed_when: true
      when: >-
        (_provisioning_vnet_list.json.data | default([])
         | selectattr('name', 'equalto', bmaas_provisioning_vnet_name) | list | length) == 0

    - name: Resolve existing provisioning V-Net id (for port update)
      ansible.builtin.set_fact:
        _provisioning_vnet_id: >-
          {{ (_provisioning_vnet_list.json.data | default([])
              | selectattr('name', 'equalto', bmaas_provisioning_vnet_name)
              | map(attribute='id') | list | first) | default('') }}
      when: _provisioning_vnet_create is skipped

    - name: Ensure provisioning V-Net has fabric ports attached
      ansible.builtin.uri:
        url: "{{ netris_controller_url }}/api/v2/vnet/{{ _provisioning_vnet_id }}"
        method: PUT
        headers:
          Cookie: "connect.sid={{ netris_session_cookie }}"
          Content-Type: "application/json"
        body_format: json
        body:
          ports: "{{ _provisioning_ports }}"
        status_code: [200]
        validate_certs: "{{ netris_validate_certs | default(false) }}"
      when:
        - _provisioning_vnet_create is skipped
        - _provisioning_vnet_id | length > 0
        - (_provisioning_vnet_list.json.data | default([])
           | selectattr('name', 'equalto', bmaas_provisioning_vnet_name)
           | map(attribute='ports') | first | default([]) | length) == 0
      changed_when: true

    # The SNAT target IP must belong to a Netris IPAM subnet with purpose "nat",
    # in the Default VPC (mirrors the mgmt "Public NAT Allocation"/"NAT pool" that
    # backs ocp_snat_ip). Without it Netris rejects the SNAT rule with
    # "Destination address is out of any defined subnets."
    - name: Create IPAM allocation for provisioning SNAT pool
      ansible.builtin.include_role:
        name: netris.controller.ipam
      vars:
        ipam_state: create_allocation
        ipam_name: "{{ bmaas_provisioning_vnet_name }}-snat-allocation"
        ipam_cidr: "{{ bmaas_provisioning_snat_cidr }}"
        ipam_tenant_id: 1
        ipam_vpc_id: "{{ bmaas_provisioning_snat_vpc_id }}"

    - name: Create IPAM subnet for provisioning SNAT pool (purpose nat)
      ansible.builtin.include_role:
        name: netris.controller.ipam
      vars:
        ipam_state: create_subnet
        ipam_name: "{{ bmaas_provisioning_vnet_name }}-snat-pool"
        ipam_cidr: "{{ bmaas_provisioning_snat_cidr }}"
        ipam_purpose: nat
        ipam_site_id: 1
        ipam_tenant_id: 1
        ipam_vpc_id: "{{ bmaas_provisioning_snat_vpc_id }}"

    - name: Create provisioning SNAT rule
      ansible.builtin.include_role:
        name: netris.controller.nat
      vars:
        nat_name: "{{ bmaas_provisioning_vnet_name }}-snat"
        nat_state: present
        nat_action: snat
        nat_protocol: all
        nat_site_id: 1
        nat_vpc_id: "{{ vpc_id }}"
        nat_source_address: "{{ bmaas_provisioning_cidr }}"
        nat_snat_to_ip: "{{ bmaas_provisioning_snat_ip }}"

    - name: Create ACL permit rule for provisioning subnet
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: create
      vars:
        acl_name: "{{ bmaas_provisioning_vnet_name }}-permit-all"
        acl_action: permit
        acl_proto: all
        acl_vpc_id: "{{ vpc_id }}"
        acl_src_prefix: "{{ bmaas_provisioning_cidr }}"
        acl_dst_prefix: "0.0.0.0/0"
        acl_reverse: "yes"
        acl_comment: "Allow all traffic from provisioning subnet"

    - name: Create V-Net lock Lease for provisioning network
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: coordination.k8s.io/v1
          kind: Lease
          metadata:
            name: "netris-vnet-lock-{{ bmaas_provisioning_vnet_name }}"
            namespace: "{{ osac_namespace }}"
          spec:
            leaseDurationSeconds: 120
      environment:
        KUBECONFIG: /root/.kube/config

# Phase 2: Prepare virtual BMH VMs (repurpose HGX VMs)
# Skip if BMHs already exist and are available (idempotent re-run)
- name: Check existing BMH states
  ansible.builtin.shell:
    cmd: >-
      oc get bmh -n {{ bmaas_bmh_namespace }}
      -o jsonpath='{range .items[*]}{.status.provisioning.state}{"\n"}{end}' 2>/dev/null
  environment:
    KUBECONFIG: /root/.kube/config
  register: _existing_bmh_states
  changed_when: false
  failed_when: false

- name: Set BMH setup needed flag
  ansible.builtin.set_fact:
    _bmh_setup_needed: "{{ _existing_bmh_states.stdout_lines | select('equalto', 'available') | list | length < bmaas_vm_patterns | length }}"

- name: Find BMaaS VMs
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ item }}"
  register: _bmaas_vm_lookup
  changed_when: false
  loop: "{{ bmaas_vm_patterns }}"

- name: Build VM name list
  ansible.builtin.set_fact:
    bmaas_vms: "{{ _bmaas_vm_lookup.results | map(attribute='stdout_lines') | map('first') | list }}"

- name: Prepare BMH VMs
  when: _bmh_setup_needed | bool
  block:
    - name: Get VM states
      ansible.builtin.shell:
        cmd: virsh domstate {{ item }}
      register: _vm_states
      changed_when: false
      loop: "{{ bmaas_vms }}"

    - name: Shut down running VMs
      ansible.builtin.command:
        cmd: virsh destroy {{ item.item }}
      when: item.stdout | trim == 'running'
      loop: "{{ _vm_states.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true

    - name: Remove UEFI firmware and set BIOS boot order
      ansible.builtin.shell:
        cmd: |
          virsh dumpxml {{ item }} > /tmp/{{ item }}.xml
          changed=false
          if grep -q '<loader' /tmp/{{ item }}.xml; then
            sed -i '/<loader/d; /<nvram/d' /tmp/{{ item }}.xml
            rm -f /var/lib/libvirt/qemu/nvram/{{ item }}_VARS.fd
            changed=true
          fi
          if grep -q '<boot order=' /tmp/{{ item }}.xml; then
            sed -i '/<boot order=/d' /tmp/{{ item }}.xml
            changed=true
          fi
          if ! grep -q '<boot dev=' /tmp/{{ item }}.xml; then
            sed -i '/<\/type>/a\    <boot dev="network"\/>\n    <boot dev="hd"\/>' /tmp/{{ item }}.xml
            changed=true
          fi
          if [ "$changed" = true ]; then
            virsh define /tmp/{{ item }}.xml
            echo "cleaned"
          else
            echo "no change"
          fi
      loop: "{{ bmaas_vms }}"
      register: _uefi_cleanup
      changed_when: "'cleaned' in _uefi_cleanup.stdout"

    - name: Get current vCPU count
      ansible.builtin.shell:
        cmd: virsh vcpucount {{ item }} --config --maximum
      register: _current_vcpus
      changed_when: false
      loop: "{{ bmaas_vms }}"

    - name: Set maximum vCPUs
      ansible.builtin.command:
        cmd: virsh setvcpus {{ item.item }} {{ bmaas_vm_vcpu }} --config --maximum
      when: item.stdout | int != bmaas_vm_vcpu | int
      loop: "{{ _current_vcpus.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true

    - name: Set vCPUs
      ansible.builtin.command:
        cmd: virsh setvcpus {{ item.item }} {{ bmaas_vm_vcpu }} --config
      when: item.stdout | int != bmaas_vm_vcpu | int
      loop: "{{ _current_vcpus.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true

    - name: Get current max memory
      ansible.builtin.shell:
        cmd: virsh dommemstat {{ item }} | awk '/actual/{print int($2/1024)}'
      register: _current_memory
      changed_when: false
      loop: "{{ bmaas_vms }}"

    - name: Set maximum memory
      ansible.builtin.command:
        cmd: virsh setmaxmem {{ item.item }} {{ bmaas_vm_memory_mb }}M --config
      when: item.stdout | int != bmaas_vm_memory_mb | int
      loop: "{{ _current_memory.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true

    - name: Set memory
      ansible.builtin.command:
        cmd: virsh setmem {{ item.item }} {{ bmaas_vm_memory_mb }}M --config
      when: item.stdout | int != bmaas_vm_memory_mb | int
      loop: "{{ _current_memory.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true

    - name: Detach all existing disks
      ansible.builtin.shell:
        cmd: |
          for target in $(virsh domblklist {{ item }} | awk 'NR>2 && NF>1 {print $1}'); do
            virsh detach-disk {{ item }} "$target" --config 2>/dev/null || true
          done
      loop: "{{ bmaas_vms }}"
      changed_when: true

    - name: Remove old BMaaS disk if present
      ansible.builtin.file:
        path: "{{ sushy_tools_disk_dir }}/{{ item }}-disk.qcow2"
        state: absent
      loop: "{{ bmaas_vms }}"

    - name: Create empty boot disk for each VM
      ansible.builtin.command:
        cmd: qemu-img create -f qcow2 {{ sushy_tools_disk_dir }}/{{ item }}-disk.qcow2 {{ bmaas_vm_disk_gb }}G
      loop: "{{ bmaas_vms }}"
      changed_when: true

    - name: Attach boot disk
      ansible.builtin.command:
        cmd: >-
          virsh attach-disk {{ item }}
          {{ sushy_tools_disk_dir }}/{{ item }}-disk.qcow2
          vda --persistent --subdriver qcow2
      loop: "{{ bmaas_vms }}"
      changed_when: true

    - name: Attach bmc-net NIC to BMH VMs
      ansible.builtin.shell:
        cmd: |
          existing=$(virsh domiflist {{ item }} | grep {{ bmc_net_name }} | awk '{print $5}')
          if [ -z "$existing" ]; then
            virsh attach-interface {{ item }} network {{ bmc_net_name }} --model virtio --config
            echo "attached"
          else
            echo "already attached"
          fi
      loop: "{{ bmaas_vms }}"
      register: _bmc_nic
      changed_when: "'attached' in _bmc_nic.stdout and 'already' not in _bmc_nic.stdout"

# Phase 3: Create BMH resources
- name: Create BMH namespace
  ansible.builtin.command:
    cmd: oc create namespace {{ bmaas_bmh_namespace }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: _ns_create
  failed_when: false
  changed_when: _ns_create.rc == 0

- name: Get VM UUIDs
  ansible.builtin.shell:
    cmd: virsh domuuid {{ item }}
  register: _vm_uuids
  changed_when: false
  loop: "{{ bmaas_vms }}"

- name: Get VM MAC addresses (bmc-net NIC)
  ansible.builtin.shell:
    cmd: virsh domiflist {{ item }} | awk '/{{ bmc_net_name }}/{print $5}'
  register: _vm_macs
  changed_when: false
  loop: "{{ bmaas_vms }}"

- name: Verify BMH SSH host mapping
  ansible.builtin.assert:
    that:
      - bmaas_ssh_hosts is mapping
      - bmaas_vms | difference(bmaas_ssh_hosts.keys() | list) | length == 0
    fail_msg: >-
      bmaas_ssh_hosts must provide a management-network SSH address for every
      BMH in bmaas_vm_patterns.

- name: Build BMH SSH host mapping
  ansible.builtin.set_fact:
    _bmaas_ssh_hosts: "{{ bmaas_ssh_hosts }}"

- name: Publish BMH SSH hosts for host-side networking tests
  ansible.builtin.lineinfile:
    path: "{{ inventory_dir }}/../.env.infra"
    regexp: '^OSAC_BMH_SSH_HOSTS='
    line: "OSAC_BMH_SSH_HOSTS={{ _bmaas_ssh_hosts | to_json | quote }}"
    create: true
    mode: "0644"

# The tenant data interfaces (eth9, eth10, ...) are the Netris fabric NICs,
# which appear as the "udp"-type interfaces in domiflist, in order. This is a
# DIFFERENT MAC than bootMACAddress (the bmc-net NIC) — the DHCP lease the
# operator's IP-discovery matches against is on the fabric NIC, not the boot
# NIC. Order matches bmaas_host_type_interfaces' non-lifecycle entries:
# 1st udp NIC = eth9, 2nd = eth10, ...
- name: Get VM tenant fabric NIC MACs (Netris udp NICs, ordered)
  ansible.builtin.shell:
    cmd: virsh domiflist {{ item }} | awk '$2=="udp"{print $5}'
  register: _vm_fabric_macs
  changed_when: false
  loop: "{{ bmaas_vms }}"

- name: Compute tenant (non-lifecycle) host type interface names
  ansible.builtin.set_fact:
    _tenant_iface_names: >-
      {{ bmaas_host_type_interfaces
         | rejectattr('role', 'equalto', 'lifecycle')
         | map(attribute='name') | list }}

- name: Create BMC credential secrets
  ansible.builtin.shell:
    cmd: |
      oc apply -f - <<'EOF'
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ item }}-bmc-secret
        namespace: {{ bmaas_bmh_namespace }}
      type: Opaque
      stringData:
        username: admin
        password: password
      EOF
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ bmaas_vms }}"
  register: _bmc_secret
  changed_when: "'created' in _bmc_secret.stdout or 'configured' in _bmc_secret.stdout"

- name: Create BareMetalHost resources
  ansible.builtin.shell:
    cmd: |
      oc apply -f - <<EOF
      apiVersion: metal3.io/v1alpha1
      kind: BareMetalHost
      metadata:
        name: {{ item }}
        namespace: {{ bmaas_bmh_namespace }}
        annotations:
          # Map each tenant data interface (eth9, eth10, role: fabric) to its
          # Netris fabric NIC MAC so the operator's IP-discovery job matches the
          # DHCP lease by MAC. These are the "udp"-type NICs (not bootMACAddress,
          # which is the bmc-net NIC). Names come from bmaas_host_type_interfaces.
          osac.openshift.io/interface-macs: '{{ dict(_tenant_iface_names | zip(_vm_fabric_macs.results[idx].stdout_lines)) | to_json }}'
      spec:
        online: true
        bootMACAddress: "{{ _vm_macs.results[idx].stdout | trim }}"
        bootMode: UEFI
        automatedCleaningMode: metadata
        rootDeviceHints:
          deviceName: /dev/vda
        bmc:
          address: "redfish-virtualmedia+http://{{ sushy_tools_ip }}:{{ sushy_tools_port }}/redfish/v1/Systems/{{ _vm_uuids.results[idx].stdout | trim }}"
          credentialsName: {{ item }}-bmc-secret
      EOF
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ bmaas_vms }}"
  loop_control:
    index_var: idx
  register: _bmh_create
  changed_when: "'created' in _bmh_create.stdout or 'configured' in _bmh_create.stdout"

# Phase 4: Wait for BMH availability (IPA can now pull its image via SNAT)
- name: Wait for BMHs to reach available state
  ansible.builtin.shell:
    cmd: >-
      oc get bmh {{ item }} -n {{ bmaas_bmh_namespace }}
      -o jsonpath='{.status.provisioning.state}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _bmh_state
  until: _bmh_state.stdout == 'available'
  retries: 120
  delay: 10
  changed_when: false
  loop: "{{ bmaas_vms }}"

# Phase 6: BMF secrets are created by prep-bmaas (runs before deploy-osac)
# so the BMF pod can start without Helm --wait timing out.

# Phase 7: Register in fulfillment service
- name: Get fulfillment internal API URL
  ansible.builtin.shell:
    cmd: oc get route fulfillment-internal-api -n {{ osac_namespace }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _fulfillment_host
  changed_when: false
  until: _fulfillment_host.rc == 0 and _fulfillment_host.stdout | length > 0
  retries: 10
  delay: 15

- name: Set fulfillment API URL
  ansible.builtin.set_fact:
    _fulfillment_api: "https://{{ _fulfillment_host.stdout }}"

- name: Get service account token
  ansible.builtin.shell:
    cmd: oc create token -n {{ osac_namespace }} admin
  environment:
    KUBECONFIG: /root/.kube/config
  register: _sa_token
  changed_when: false
  until: _sa_token.rc == 0 and _sa_token.stdout | length > 0
  retries: 10
  delay: 15

- name: Ensure osac CLI config directory exists
  ansible.builtin.file:
    path: /root/.config/osac
    state: directory
    mode: "0700"

- name: Configure osac CLI
  ansible.builtin.copy:
    content: |
      {
        "token_script": "oc create token -n {{ osac_namespace }} admin --duration 1h",
        "insecure": true,
        "address": "{{ _fulfillment_host.stdout }}:443"
      }
    dest: /root/.config/osac/config.json
    mode: "0600"

- name: Check whether Fulfillment Service exposes the legacy HostTypes API
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/host_types"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200, 404]
  register: _host_types_api
  changed_when: false

- name: Create host type
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/host_types"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ bmaas_host_type }}"
      title: "{{ bmaas_host_type_title }}"
      description: "{{ bmaas_host_type_description }}"
      interfaces: "{{ bmaas_host_type_interfaces }}"
    validate_certs: false
    status_code: [200, 201, 409]
  when: _host_types_api.status == 200

# The template's host_type must be the host type's ID, not its name — the
# fulfillment-service resolves it as an ID at BMI-create time (host_type by
# name yields "host type 'default' ... not found"). Look it up by name.
- name: List host types
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/host_types"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200]
  register: _host_types
  when: _host_types_api.status == 200

- name: Resolve host type id
  ansible.builtin.set_fact:
    _host_type_id: >-
      {{ (_host_types.json.get('items', [])
          | selectattr('metadata.name', 'equalto', bmaas_host_type)
          | map(attribute='id') | list | first) }}
  when: _host_types_api.status == 200

- name: Require the BMaaS host type ID to be resolved
  ansible.builtin.assert:
    that:
      - (_host_type_id | default('', true) | string | length) > 0
    fail_msg: >-
      Could not resolve host type '{{ bmaas_host_type }}' to an ID from the
      fulfillment service. Refusing to label BMHs with the host type name.
  when: _host_types_api.status == 200

- name: Use the fulfillment service default host selector when HostTypes is unavailable
  ansible.builtin.set_fact:
    _host_type_id: default
  when: _host_types_api.status == 404

- name: Report legacy HostTypes API compatibility mode
  ansible.builtin.debug:
    msg: >-
      The Fulfillment Service does not expose /api/private/v1/host_types.
      Leaving the BMI template's host_type unset and selecting BMHs with the
      service's default host selector ('default'). Legacy interface validation
      is unavailable in this mode.
  when: _host_types_api.status == 404

# The BMF operator uses the BMI hostType value as the BMH host-type label
# selector. Legacy deployments use the resolved HostType ID; deployments
# without HostTypes use the fulfillment service's default selector.
- name: Label BMHs with the selected host type selector
  ansible.builtin.command:
    cmd: >-
      oc label bmh {{ item }} -n {{ bmaas_bmh_namespace }}
      osac.openshift.io/host-type={{ _host_type_id }}
      --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ bmaas_vms }}"
  changed_when: true

- name: Wait for BMI template to be published by AAP
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_templates/{{ bmaas_bmi_template }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200]
  register: _bmi_template
  until: _bmi_template.status == 200
  retries: 40
  delay: 15

# The published template has no host_type, so the fulfillment-service skips
# interface validation for BMIs created from it. Link it to the host type so the
# tenant's network-attachment interface is validated against the interfaces list.
- name: Link BMI template to host type
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_templates/{{ bmaas_bmi_template }}?update_mask=host_type"
    method: PATCH
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ bmaas_bmi_template }}"
      host_type: "{{ _host_type_id }}"
    validate_certs: false
    status_code: [200]
  when: _host_types_api.status == 200

- name: Create BMI catalog item
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_catalog_items"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ bmaas_catalog_item }}"
      title: "{{ bmaas_catalog_item_title }}"
      description: "{{ bmaas_catalog_item_description }}"
      template:
        id: "{{ _bmi_template.json.id }}"
      published: true
      fields:
        ssh_public_key:
          editable: {}
        network_attachments:
          editable: {}
    validate_certs: false
    status_code: [200, 201, 409]

- name: Create BMI catalog item with auto ExternalIP
  ansible.builtin.uri:
    url: "{{ _fulfillment_api }}/api/private/v1/baremetal_instance_catalog_items"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ bmaas_auto_eip_catalog_item }}"
      title: "{{ bmaas_auto_eip_catalog_item_title }}"
      description: "{{ bmaas_auto_eip_catalog_item_description }}"
      template:
        id: "{{ _bmi_template.json.id }}"
      published: true
      fields:
        ssh_public_key:
          editable: {}
        network_attachments:
          editable: {}
        auto_external_ip_attachment:
          editable: {}
    validate_certs: false
    status_code: [200, 201, 409]

- name: Verify catalog items are accessible
  ansible.builtin.command:
    cmd: osac get baremetalinstancecatalogitems
  register: _catalog_check
  changed_when: false
  until: bmaas_catalog_item in _catalog_check.stdout and bmaas_auto_eip_catalog_item in _catalog_check.stdout
  retries: 10
  delay: 5

- name: Report BMaaS setup complete
  ansible.builtin.debug:
    msg: >-
      BMaaS setup complete. {{ bmaas_vms | length }} virtual BMHs available in namespace {{ bmaas_bmh_namespace }}.
      Catalog items '{{ bmaas_catalog_item }}' and '{{ bmaas_auto_eip_catalog_item }}' ready.
      Create a BMI with: osac create baremetalinstance --catalog-item {{ bmaas_catalog_item }}
