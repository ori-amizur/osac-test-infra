---
# Shared lab infrastructure: sushy-tools BMC emulator.
- name: Reserve OCP VM bmc-net address
  when: bare_metal_services | default(false) | bool
  ansible.builtin.include_role:
    name: reserve-ocp-bmc

# ── sushy-tools ─────────────────────────────────────────────────────

# libvirt-python is a native binding and should match the host's libvirt-libs;
# use the RHEL-family package instead of compiling a PyPI sdist.
- name: Install native libvirt Python bindings
  ansible.builtin.dnf:
    name: python3-libvirt
    state: present

- name: Check sushy-tools Python dependencies
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - import libvirt, sushy_tools
  register: _sushy_dependencies_import
  changed_when: false
  failed_when: false

- name: Install sushy-tools for Ansible Python
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -m
      - pip
      - install
      - --ignore-installed
      - sushy-tools
  changed_when: true
  when: _sushy_dependencies_import.rc != 0

- name: Verify sushy-tools Python dependencies
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - import libvirt, sushy_tools
  changed_when: false

- name: Create sushy-tools disk directory
  ansible.builtin.file:
    path: "{{ sushy_tools_disk_dir }}"
    state: directory
    mode: "0777"

- name: Check if libvirt storage pool exists
  ansible.builtin.shell:
    cmd: virsh pool-info {{ sushy_tools_storage_pool }} 2>/dev/null
  register: _pool_check
  failed_when: false
  changed_when: false

- name: Define libvirt storage pool
  ansible.builtin.command:
    cmd: virsh pool-define-as {{ sushy_tools_storage_pool }} dir --target {{ sushy_tools_disk_dir }}
  when: _pool_check.rc != 0

- name: Start libvirt storage pool
  ansible.builtin.command:
    cmd: virsh pool-start {{ sushy_tools_storage_pool }}
  when: _pool_check.rc != 0
  register: _pool_start
  failed_when: _pool_start.rc != 0 and 'already active' not in _pool_start.stderr

- name: Detect OVMF firmware path
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _ovmf_check
  loop:
    - /usr/share/OVMF/OVMF_CODE.fd
    - /usr/share/edk2/ovmf/OVMF_CODE.fd
    - /usr/share/OVMF/OVMF_CODE.secboot.fd
    - /usr/share/edk2/ovmf/OVMF_CODE.secboot.fd

- name: Set OVMF firmware path
  ansible.builtin.set_fact:
    _ovmf_code_path: "{{ (_ovmf_check.results | selectattr('stat.exists') | first).item }}"

- name: Create sushy-tools config directory
  ansible.builtin.file:
    path: "{{ sushy_tools_config_dir }}"
    state: directory
    mode: "0755"

- name: Create sushy-tools persistent state directory
  ansible.builtin.file:
    path: "{{ sushy_tools_state_dir | default('/var/lib/sushy-tools') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write sushy-tools config
  ansible.builtin.copy:
    content: |
      SUSHY_EMULATOR_LISTEN_IP = "{{ sushy_tools_ip }}"
      SUSHY_EMULATOR_LISTEN_PORT = {{ sushy_tools_port }}
      SUSHY_EMULATOR_SSL_CERT = None
      SUSHY_EMULATOR_SSL_KEY = None
      SUSHY_EMULATOR_STATE_DIR = "{{ sushy_tools_state_dir | default('/var/lib/sushy-tools') }}"
      SUSHY_EMULATOR_LIBVIRT_URI = "qemu:///system"
      SUSHY_EMULATOR_IGNORE_BOOT_DEVICE = False
      SUSHY_EMULATOR_STORAGE_POOL = "{{ sushy_tools_storage_pool }}"
      SUSHY_EMULATOR_BOOT_LOADER_MAP = {
          "UEFI": {
              "x86_64": None
          },
          "Legacy": {
              "x86_64": None
          }
      }
    dest: "{{ sushy_tools_config_dir }}/sushy-emulator.conf"
    mode: "0644"
  register: _sushy_config

- name: Check if sushy-emulator is already running
  ansible.builtin.shell:
    cmd: >-
      pgrep -f '[/]sushy-emulator --config
      {{ sushy_tools_config_dir }}/sushy-emulator.conf'
  register: _sushy_running
  failed_when: false
  changed_when: false

- name: Stop existing sushy-emulator if config changed
  ansible.builtin.shell:
    cmd: >-
      pkill -f '[/]sushy-emulator --config
      {{ sushy_tools_config_dir }}/sushy-emulator.conf'
  register: _sushy_stop
  failed_when: _sushy_stop.rc not in [0, 1]
  changed_when: _sushy_stop.rc == 0
  when: _sushy_config is changed and _sushy_running.rc == 0

- name: Start sushy-emulator
  ansible.builtin.shell:
    cmd: |
      nohup sushy-emulator --config {{ sushy_tools_config_dir }}/sushy-emulator.conf \
        > {{ sushy_tools_config_dir }}/sushy.log 2>&1 &
      echo $!
  register: _sushy_start
  when: _sushy_running.rc != 0 or _sushy_config is changed

- name: Check if firewalld is running
  ansible.builtin.command: firewall-cmd --state
  register: _firewalld_state
  changed_when: false
  failed_when: false

- name: Allow sushy-tools traffic through firewalld on bmc-net bridge
  when:
    - _firewalld_state.rc == 0
    - _firewalld_state.stdout | trim == 'running'
  block:
    - name: Add bmc-net bridge to libvirt firewalld zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=libvirt --add-interface={{ bmc_net_bridge }} --permanent
      register: _fw_iface
      changed_when: "'ALREADY_ENABLED' not in _fw_iface.stderr"
      failed_when: _fw_iface.rc != 0 and 'ALREADY_ENABLED' not in _fw_iface.stderr

    - name: Remove libvirt zone reject-all rich rule
      ansible.builtin.command:
        cmd: firewall-cmd --zone=libvirt --remove-rich-rule='rule priority="32767" reject' --permanent
      register: _fw_reject
      changed_when: _fw_reject.rc == 0
      failed_when: false

    - name: Open sushy-tools port in libvirt zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=libvirt --add-port={{ sushy_tools_port }}/tcp --permanent
      register: _fw_port
      changed_when: "'ALREADY_ENABLED' not in _fw_port.stderr"
      failed_when: _fw_port.rc != 0 and 'ALREADY_ENABLED' not in _fw_port.stderr

    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when: _fw_iface is changed or _fw_reject is changed or _fw_port is changed

- name: Wait for sushy-emulator to respond
  ansible.builtin.uri:
    url: "http://{{ sushy_tools_ip }}:{{ sushy_tools_port }}/redfish/v1/"
    method: GET
    status_code: 200
  register: _sushy_health
  until: _sushy_health.status == 200
  retries: 15
  delay: 2

- name: Report setup-bmc status
  ansible.builtin.debug:
    msg: >-
      setup-bmc complete: {{ bmc_net_name }} ({{ bmc_net_bridge }}) with OCP at {{ bmc_net_ocp_ip }},
      sushy-tools on {{ sushy_tools_ip }}:{{ sushy_tools_port }}
