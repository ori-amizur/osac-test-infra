---
# Step 1: Wait for all agents to register from the discovery ISO boot.
# Budget ~22.5 min (90 x 15s) so the rescue diagnostics still run within the
# 30-minute step timeout if the agents never register.
- name: Wait for discovery agents to register
  block:
    - name: Wait for expected number of agents
      ansible.builtin.shell:
        cmd: oc get agent -n {{ caas_agent_namespace }} --no-headers 2>/dev/null | wc -l
      environment:
        KUBECONFIG: /root/.kube/config
      register: _agent_count
      until: _agent_count.stdout | int >= caas_agents | length
      retries: 90
      delay: 15
      changed_when: false
  rescue:
    - name: Capture CaaS discovery diagnostics
      ansible.builtin.include_tasks: discovery-diagnostics.yml

    - name: Fail because discovery agents did not register
      ansible.builtin.fail:
        msg: >-
          Only {{ _agent_count.stdout | default('0') | trim }} of
          {{ caas_agents | length }} discovery agents registered with
          assisted-service before the timeout. Diagnostics saved to
          {{ _caas_discovery_diag_dir }}.

- name: Get agent names
  ansible.builtin.shell:
    cmd: oc get agent -n {{ caas_agent_namespace }} -o jsonpath='{.items[*].metadata.name}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agent_names
  changed_when: false
  until: _agent_names.rc == 0 and _agent_names.stdout | length > 0
  retries: 10
  delay: 15

- name: Set agent name list
  ansible.builtin.set_fact:
    caas_agent_names: "{{ _agent_names.stdout.split() }}"

# Step 2: Label agents with resource class and netris server name
# Agent CRs appear before status.inventory is populated; wait until every
# expected agent has a hostname before building the label map.
- name: Get agent hostnames
  ansible.builtin.shell:
    cmd: |
      oc get agent -n {{ caas_agent_namespace }} -o json | python3 -c '
      import json, sys
      agents = json.load(sys.stdin).get("items") or []
      expected = {{ caas_agents | length }}
      if len(agents) < expected:
          raise SystemExit(f"only {len(agents)}/{expected} agents present")
      missing = [
          a["metadata"]["name"]
          for a in agents
          if not ((a.get("status") or {}).get("inventory") or {}).get("hostname")
      ]
      if missing:
          raise SystemExit("inventory hostname missing for: " + ",".join(missing))
      print(json.dumps({
          a["metadata"]["name"]: a["status"]["inventory"]["hostname"]
          for a in agents
      }))
      '
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agent_hostnames_raw
  until: _agent_hostnames_raw.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: Build agent-to-hostname map
  ansible.builtin.set_fact:
    _agent_hostname_map: "{{ _agent_hostnames_raw.stdout | from_json }}"

# caas_resource_class_hostnames empty → all agents (CaaS). Non-empty → only those
# inventory hostnames get resource_class (MaaS defaults to h02+h03).
- name: Build resource_class agent allow-list by hostname
  ansible.builtin.set_fact:
    _agents_for_resource_class: >-
      {{
        caas_agent_names
        if (caas_resource_class_hostnames | default([]) | length) == 0 else
        (
          _agent_hostname_map
          | dict2items
          | selectattr('value', 'in', caas_resource_class_hostnames)
          | map(attribute='key')
          | list
        )
      }}

- name: Show resource_class labeling plan
  ansible.builtin.debug:
    msg: >-
      resource_class={{ caas_host_type_id }} on
      {{ _agents_for_resource_class | length }}/{{ caas_agent_names | length }} agents
      (filter={{ caas_resource_class_hostnames | default([]) }})

- name: Fail if resource_class hostname filter matched no agents
  ansible.builtin.fail:
    msg: >-
      caas_resource_class_hostnames={{ caas_resource_class_hostnames }} matched 0 agents.
      Known hostnames: {{ _agent_hostname_map.values() | list }}
  when:
    - (caas_resource_class_hostnames | default([]) | length) > 0
    - (_agents_for_resource_class | length) == 0

# Agents in the discovery InfraEnv identify candidate machines. The BMF
# allocator selects Metal3 BareMetalHosts in bmaas_bmh_namespace, so the same
# instance-type selector must be present on those BMHs as well.
- name: Label and validate CaaS BareMetalHosts for the OSAC allocator
  ansible.builtin.include_tasks: label-worker-bmhs.yml

- name: Label agent with resource class
  ansible.builtin.command:
    cmd: >-
      oc label agent/{{ item }} -n {{ caas_agent_namespace }}
      osac.openshift.io/resource_class={{ caas_host_type_id }}
      --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ _agents_for_resource_class }}"
  register: _label_rc
  changed_when: "'labeled' in _label_rc.stdout and 'not labeled' not in _label_rc.stdout"
  until: _label_rc.rc == 0
  retries: 5
  delay: 10

- name: Remove resource_class from agents outside the allow-list
  ansible.builtin.command:
    cmd: >-
      oc label agent/{{ item }} -n {{ caas_agent_namespace }}
      osac.openshift.io/resource_class- --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  when:
    - (caas_resource_class_hostnames | default([]) | length) > 0
    - item not in _agents_for_resource_class
  loop: "{{ caas_agent_names }}"
  register: _unlabel_rc
  changed_when: "'labeled' in _unlabel_rc.stdout or 'unlabeled' in _unlabel_rc.stdout"
  failed_when: false

- name: Label agent with netris server name
  ansible.builtin.command:
    cmd: >-
      oc label agent/{{ item.key }} -n {{ caas_agent_namespace }}
      netris.server/name={{ (caas_agents | selectattr('vm_pattern', 'search', item.value) | first).netris_server_name }}
      --overwrite
  environment:
    KUBECONFIG: /root/.kube/config
  loop: "{{ _agent_hostname_map | dict2items }}"
  loop_control:
    label: "{{ item.value }}"
  register: _label_ns
  changed_when: "'labeled' in _label_ns.stdout and 'not labeled' not in _label_ns.stdout"
  until: _label_ns.rc == 0
  retries: 5
  delay: 10

- name: Check agent approval status
  ansible.builtin.shell:
    cmd: oc get agent/{{ item }} -n {{ caas_agent_namespace }} -o jsonpath='{.spec.approved}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _agent_approved
  changed_when: false
  until: _agent_approved.rc == 0
  retries: 5
  delay: 10
  loop: "{{ _agents_for_resource_class }}"

- name: Approve agents
  ansible.builtin.command:
    cmd: >-
      oc patch agent/{{ item.item }} -n {{ caas_agent_namespace }}
      --type=merge -p '{"spec":{"approved":true}}'
  environment:
    KUBECONFIG: /root/.kube/config
  when: item.stdout != 'true'
  loop: "{{ _agent_approved.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: _approve_result
  until: _approve_result.rc == 0
  retries: 5
  delay: 10
  changed_when: true

# Step 3: Register worker catalog resources in fulfillment service
- name: Get fulfillment internal API URL
  ansible.builtin.shell:
    cmd: oc get route fulfillment-internal-api -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _fulfillment_host
  changed_when: false
  until: _fulfillment_host.rc == 0 and _fulfillment_host.stdout | length > 0
  retries: 10
  delay: 15

- name: Set fulfillment API URL
  ansible.builtin.set_fact:
    caas_fulfillment_api: "https://{{ _fulfillment_host.stdout }}"

# Must run before any osac CLI invocation in this role, including "Wait for
# cluster template to exist" below -- otherwise the CLI has no config yet
# ("Error: there is no configuration, run the 'login' command").
- name: Ensure osac CLI config directory exists
  ansible.builtin.file:
    path: /root/.config/osac
    state: directory
    mode: "0700"

- name: Configure osac CLI
  ansible.builtin.copy:
    content: |
      {
        "token_script": "oc create token -n {{ snapshot_osac_namespace | default(osac_namespace) }} admin --duration 1h",
        "insecure": true,
        "address": "{{ _fulfillment_host.stdout }}:443"
      }
    dest: /root/.config/osac/config.json
    mode: "0600"

- name: Get service account token
  ansible.builtin.shell:
    cmd: oc create token -n {{ snapshot_osac_namespace | default(osac_namespace) }} admin
  environment:
    KUBECONFIG: /root/.kube/config
  register: _sa_token
  changed_when: false
  until: _sa_token.rc == 0 and _sa_token.stdout | length > 0
  retries: 10
  delay: 15

- name: Ensure CaaS worker BareMetalInstanceType
  ansible.builtin.include_tasks: ensure-worker-instance-type.yml

- name: Ensure CaaS worker DiskImage and ClusterVersion
  ansible.builtin.include_tasks: ensure-worker-disk-image.yml

- name: Create host type
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/host_types"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ caas_host_type_id }}"
      title: "{{ caas_host_type_title }}"
      description: "{{ caas_host_type_description }}"
    validate_certs: false
    status_code: [200, 201, 409]

# AAP cluster_network looks up the BareMetalInstanceType ID in
# NETRIS_RESOURCE_CLASS_MAP (cluster-fulfillment-ig). Keep the legacy resource
# class key too: it can differ from the instance type name (which is its ID).
# Append only when the key is missing — never overwrite an existing entry.
- name: Read NETRIS_RESOURCE_CLASS_MAP from cluster-fulfillment-ig
  ansible.builtin.shell:
    cmd: >-
      oc get configmap cluster-fulfillment-ig
      -n {{ snapshot_osac_namespace | default(osac_namespace) }}
      -o jsonpath='{.data.NETRIS_RESOURCE_CLASS_MAP}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _netris_rc_map_raw
  changed_when: false
  failed_when: false

- name: Ensure worker resource class and instance type are present in NETRIS_RESOURCE_CLASS_MAP
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, subprocess, sys

    raw = os.environ.get("NETRIS_RC_MAP_RAW") or "{}"
    try:
        data = json.loads(raw)
    except json.JSONDecodeError:
        data = {}
    if not isinstance(data, dict):
        data = {}

    names = json.loads(os.environ["NETRIS_RC_NAMES"])
    missing = [name for name in names if not isinstance(data.get(name), dict) or not data[name]]
    if not missing:
        print("unchanged worker entries already in NETRIS_RESOURCE_CLASS_MAP")
        sys.exit(0)

    # Reuse the resource class's discovered configuration for a new instance
    # type alias. It can differ from the inventory's fallback template ID.
    entry = data.get(names[0])
    if not isinstance(entry, dict) or not entry:
        entry = {
            "server_cluster_template_id": int(os.environ["NETRIS_RC_TEMPLATE_ID"]),
            "mgmt_interface": os.environ["NETRIS_RC_MGMT_IF"],
            "vpc_interfaces": json.loads(os.environ["NETRIS_RC_VPC_IFS"]),
        }
    for name in missing:
        data[name] = entry
    new_json = json.dumps(data, separators=(",", ":"))
    patch = json.dumps({"data": {"NETRIS_RESOURCE_CLASS_MAP": new_json}})
    subprocess.run(
        [
            "oc", "patch", "configmap", "cluster-fulfillment-ig",
            "-n", os.environ["NETRIS_RC_NS"],
            "--type=merge", "-p", patch,
        ],
        check=True,
    )
    print(f"patched added {','.join(missing)}={json.dumps(entry)}")
    PY
  environment:
    KUBECONFIG: /root/.kube/config
    NETRIS_RC_NS: "{{ snapshot_osac_namespace | default(osac_namespace) }}"
    NETRIS_RC_MAP_RAW: "{{ _netris_rc_map_raw.stdout | default('') }}"
    NETRIS_RC_NAMES: "{{ [caas_host_type_id, caas_cluster_baremetal_instance_type] | unique | list | to_json }}"
    NETRIS_RC_TEMPLATE_ID: "{{ caas_netris_server_cluster_template_id | default(2) }}"
    NETRIS_RC_MGMT_IF: "{{ caas_netris_mgmt_interface | default('ens4') }}"
    NETRIS_RC_VPC_IFS: "{{ caas_netris_vpc_interfaces | default(['ens6']) | to_json }}"
  register: _netris_rc_map_ensure
  changed_when: "'patched ' in _netris_rc_map_ensure.stdout"

# Step 4: Trigger AAP publish-templates job and wait for cluster template
- name: Get AAP route
  ansible.builtin.shell:
    cmd: oc get route osac-aap -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.spec.host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _aap_route
  changed_when: false
  until: _aap_route.rc == 0 and _aap_route.stdout | length > 0
  retries: 10
  delay: 15

- name: Get AAP admin password
  ansible.builtin.shell:
    cmd: oc get secret osac-aap-controller-admin-password -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.data.password}' | base64 -d
  environment:
    KUBECONFIG: /root/.kube/config
  register: _aap_admin_pw
  changed_when: false
  no_log: true

- name: Wait for publish-templates job template to be available
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/job_templates/?name=osac-publish-templates"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
  register: _jt_check
  until: _jt_check.status == 200 and (_jt_check.json.count | default(0)) > 0
  retries: 40
  delay: 15
  no_log: true

- name: Wait for AAP gateway to be fully ready
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/ping/"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _gw_ping
  until: _gw_ping.status == 200
  retries: 20
  delay: 10
  no_log: true

- name: Launch publish-templates job
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/job_templates/osac-publish-templates/launch/"
    method: POST
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201]
  register: _publish_job
  retries: 5
  delay: 30
  until: _publish_job.status == 201

- name: Wait for publish-templates job to complete
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/jobs/{{ _publish_job.json.id }}/"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
  register: _publish_status
  until: _publish_status.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 15
  no_log: true

- name: Fail if publish-templates job did not succeed
  ansible.builtin.fail:
    msg: "publish-templates job {{ _publish_job.json.id }} finished with status: {{ _publish_status.json.status }}"
  when: _publish_status.json.status != 'successful'

- name: Wait for cluster template to exist
  ansible.builtin.command:
    cmd: osac get clustertemplates
  register: _templates
  until: caas_cluster_template in _templates.stdout
  retries: 30
  delay: 10
  changed_when: false

# Step 5: Create catalog item from template
- name: Create cluster catalog item
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/cluster_catalog_items"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ caas_catalog_item }}"
      title: "{{ caas_catalog_item_title }}"
      description: "{{ caas_catalog_item_description }}"
      template:
        id: "{{ caas_cluster_template }}"
      published: true
      # Recent CaaS change: ClusterCatalogItem replaced the flat field_definitions
      # list with typed per-field policies under `fields` (see osac
      # fulfillment-service examples/catalog-items/ocp-ci-cluster.yaml). Sending
      # field_definitions now 400s ("unknown field"). create-caas creates clusters
      # via --template + -f, not through these policies, so a minimal fields block
      # (mirroring the upstream CI example) is enough.
      fields:
        network:
          pod_cidr:
            editable:
              default_value: "10.128.0.0/14"
          service_cidr:
            editable:
              default_value: "172.30.0.0/16"
    validate_certs: false
    status_code: [200, 201, 409]
