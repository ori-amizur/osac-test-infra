---
- name: Prepare workers through the shared discovery InfraEnv
  ansible.builtin.include_tasks: prepare-discovered-workers.yml
  when: not (caas_use_order_infraenv_for_worker_boot | default(true) | bool)

- name: Prepare workers for their ClusterOrder InfraEnv
  ansible.builtin.include_tasks: prepare-order-infraenv-workers.yml
  when: caas_use_order_infraenv_for_worker_boot | default(true) | bool

# Step 3: Register worker catalog resources in fulfillment service
- name: Get fulfillment internal API URL
  ansible.builtin.shell:
    cmd: oc get route fulfillment-internal-api -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _fulfillment_host
  changed_when: false
  until: _fulfillment_host.rc == 0 and _fulfillment_host.stdout | length > 0
  retries: 10
  delay: 15

- name: Set fulfillment API URL
  ansible.builtin.set_fact:
    caas_fulfillment_api: "https://{{ _fulfillment_host.stdout }}"

# Must run before any osac CLI invocation in this role, including "Wait for
# cluster template to exist" below -- otherwise the CLI has no config yet
# ("Error: there is no configuration, run the 'login' command").
- name: Ensure osac CLI config directory exists
  ansible.builtin.file:
    path: /root/.config/osac
    state: directory
    mode: "0700"

- name: Configure osac CLI
  ansible.builtin.copy:
    content: |
      {
        "token_script": "oc create token -n {{ snapshot_osac_namespace | default(osac_namespace) }} admin --duration 1h",
        "insecure": true,
        "address": "{{ _fulfillment_host.stdout }}:443"
      }
    dest: /root/.config/osac/config.json
    mode: "0600"

- name: Get service account token
  ansible.builtin.shell:
    cmd: oc create token -n {{ snapshot_osac_namespace | default(osac_namespace) }} admin
  environment:
    KUBECONFIG: /root/.kube/config
  register: _sa_token
  changed_when: false
  until: _sa_token.rc == 0 and _sa_token.stdout | length > 0
  retries: 10
  delay: 15

- name: Ensure CaaS worker BareMetalInstanceType
  ansible.builtin.include_tasks: ensure-worker-instance-type.yml

- name: Ensure CaaS worker DiskImage and ClusterVersion
  ansible.builtin.include_tasks: ensure-worker-disk-image.yml

- name: Check whether Fulfillment Service exposes the legacy HostTypes API
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/host_types"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200, 404]
  register: _host_types_api
  changed_when: false

- name: Create host type
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/host_types"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ caas_host_type_id }}"
      title: "{{ caas_host_type_title }}"
      description: "{{ caas_host_type_description }}"
    validate_certs: false
    status_code: [200, 201, 409]
  when: _host_types_api.status == 200

- name: Report that the legacy HostTypes API is not available
  ansible.builtin.debug:
    msg: >-
      Skipping legacy HostType registration because this Fulfillment Service
      does not expose /api/private/v1/host_types. The CaaS BareMetalInstanceType
      has already been registered and is used for worker allocation.
  when: _host_types_api.status == 404

# AAP cluster_network looks up the BareMetalInstanceType ID in
# NETRIS_RESOURCE_CLASS_MAP (cluster-fulfillment-ig). Keep the legacy resource
# class key too: it can differ from the instance type name (which is its ID).
# The hostname patterns let AAP map order-bound Agents to Netris servers; those
# Agents are created later by the ClusterOrder InfraEnv and have no discovery
# Agent labels to copy.
- name: Read NETRIS_RESOURCE_CLASS_MAP from cluster-fulfillment-ig
  ansible.builtin.shell:
    cmd: >-
      oc get configmap cluster-fulfillment-ig
      -n {{ snapshot_osac_namespace | default(osac_namespace) }}
      -o jsonpath='{.data.NETRIS_RESOURCE_CLASS_MAP}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _netris_rc_map_raw
  changed_when: false
  failed_when: false

- name: Ensure worker resource class and instance type are present in NETRIS_RESOURCE_CLASS_MAP
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, re, subprocess, sys

    raw = os.environ.get("NETRIS_RC_MAP_RAW") or "{}"
    try:
        data = json.loads(raw)
    except json.JSONDecodeError:
        data = {}
    if not isinstance(data, dict):
        data = {}

    names = json.loads(os.environ["NETRIS_RC_NAMES"])
    hostname_patterns = []
    for mapping in json.loads(os.environ["NETRIS_RC_AGENT_MAPPINGS"]):
        pattern = mapping.get("vm_pattern", "")
        server_name = mapping.get("netris_server_name", "")
        if not pattern or not server_name:
            raise SystemExit(f"invalid caas_agents mapping: {mapping!r}")
        try:
            re.compile(pattern)
        except re.error as exc:
            raise SystemExit(f"invalid caas_agents hostname pattern {pattern!r}: {exc}") from exc
        hostname_patterns.append({"hostname_pattern": pattern, "server_name": server_name})
    missing = [name for name in names if not isinstance(data.get(name), dict) or not data[name]]
    changed_names = set(missing)

    # Reuse the resource class's discovered configuration for a new instance
    # type alias. It can differ from the inventory's fallback template ID.
    entry = data.get(names[0])
    if not isinstance(entry, dict) or not entry:
        entry = {
            "server_cluster_template_id": int(os.environ["NETRIS_RC_TEMPLATE_ID"]),
            "mgmt_interface": os.environ["NETRIS_RC_MGMT_IF"],
            "vpc_interfaces": json.loads(os.environ["NETRIS_RC_VPC_IFS"]),
        }
    for name in missing:
        data[name] = dict(entry)

    for name in names:
        current = data[name]
        if current.get("agent_server_name_patterns") != hostname_patterns:
            current["agent_server_name_patterns"] = hostname_patterns
            changed_names.add(name)

    if not changed_names:
        print("unchanged worker entries already in NETRIS_RESOURCE_CLASS_MAP")
        sys.exit(0)
    new_json = json.dumps(data, separators=(",", ":"))
    patch = json.dumps({"data": {"NETRIS_RESOURCE_CLASS_MAP": new_json}})
    subprocess.run(
        [
            "oc", "patch", "configmap", "cluster-fulfillment-ig",
            "-n", os.environ["NETRIS_RC_NS"],
            "--type=merge", "-p", patch,
        ],
        check=True,
    )
    print(f"patched worker entries {','.join(sorted(changed_names))}")
    PY
  environment:
    KUBECONFIG: /root/.kube/config
    NETRIS_RC_NS: "{{ snapshot_osac_namespace | default(osac_namespace) }}"
    NETRIS_RC_MAP_RAW: "{{ _netris_rc_map_raw.stdout | default('') }}"
    NETRIS_RC_NAMES: "{{ [caas_host_type_id, caas_cluster_baremetal_instance_type] | unique | list | to_json }}"
    NETRIS_RC_TEMPLATE_ID: "{{ caas_netris_server_cluster_template_id | default(2) }}"
    NETRIS_RC_MGMT_IF: "{{ caas_netris_mgmt_interface | default('ens4') }}"
    NETRIS_RC_VPC_IFS: "{{ caas_netris_vpc_interfaces | default(['ens6']) | to_json }}"
    NETRIS_RC_AGENT_MAPPINGS: "{{ caas_agents | to_json }}"
  register: _netris_rc_map_ensure
  changed_when: "'patched ' in _netris_rc_map_ensure.stdout"

# Step 4: Trigger AAP publish-templates job and wait for cluster template
- name: Get AAP route
  ansible.builtin.shell:
    cmd: oc get route osac-aap -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.spec.host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _aap_route
  changed_when: false
  until: _aap_route.rc == 0 and _aap_route.stdout | length > 0
  retries: 10
  delay: 15

- name: Get AAP admin password
  ansible.builtin.shell:
    cmd: oc get secret osac-aap-controller-admin-password -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.data.password}' | base64 -d
  environment:
    KUBECONFIG: /root/.kube/config
  register: _aap_admin_pw
  changed_when: false
  no_log: true

- name: Wait for publish-templates job template to be available
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/job_templates/?name=osac-publish-templates"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
  register: _jt_check
  until: _jt_check.status == 200 and (_jt_check.json.count | default(0)) > 0
  retries: 40
  delay: 15
  no_log: true

- name: Wait for AAP gateway to be fully ready
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/ping/"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _gw_ping
  until: _gw_ping.status == 200
  retries: 20
  delay: 10
  no_log: true

- name: Launch publish-templates job
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/job_templates/osac-publish-templates/launch/"
    method: POST
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201]
  register: _publish_job
  retries: 5
  delay: 30
  until: _publish_job.status == 201

- name: Wait for publish-templates job to complete
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/jobs/{{ _publish_job.json.id }}/"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
  register: _publish_status
  until: _publish_status.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 15
  no_log: true

- name: Fail if publish-templates job did not succeed
  ansible.builtin.fail:
    msg: "publish-templates job {{ _publish_job.json.id }} finished with status: {{ _publish_status.json.status }}"
  when: _publish_status.json.status != 'successful'

- name: Wait for cluster template to exist
  ansible.builtin.command:
    cmd: osac get clustertemplates
  register: _templates
  until: caas_cluster_template in _templates.stdout
  retries: 30
  delay: 10
  changed_when: false

# Step 5: Create catalog item from template
- name: Create cluster catalog item
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/cluster_catalog_items"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ caas_catalog_item }}"
      title: "{{ caas_catalog_item_title }}"
      description: "{{ caas_catalog_item_description }}"
      template:
        id: "{{ caas_cluster_template }}"
      published: true
      # Recent CaaS change: ClusterCatalogItem replaced the flat field_definitions
      # list with typed per-field policies under `fields` (see osac
      # fulfillment-service examples/catalog-items/ocp-ci-cluster.yaml). Sending
      # field_definitions now 400s ("unknown field"). create-caas creates clusters
      # via --template + -f, not through these policies, so a minimal fields block
      # (mirroring the upstream CI example) is enough.
      fields:
        network:
          pod_cidr:
            editable:
              default_value: "10.128.0.0/14"
          service_cidr:
            editable:
              default_value: "172.30.0.0/16"
    validate_certs: false
    status_code: [200, 201, 409]
